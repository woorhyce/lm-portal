*,*::before,*::after{box-sizing:border-box}
body{margin:0}
/* Layout: arcade cabinet column — marquee, HUD, 4:3 multiview playfield, control deck. Single dark look by choice. */
:root {
  --void: #07061c; --panel: #120f33; --line: #2b2766;
  --cyan: #3fe0ff; --amber: #ffb52e; --tally: #ff3346; --green: #4dff9a;
  --ink: #e8e6ff; --dim: #8f8ac7;
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--void);
  background-image: radial-gradient(ellipse at 50% -10%, #1d1760 0%, var(--void) 60%);
  color: var(--ink); font-family: var(--body); font-size: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cab { max-width: 860px; margin: 0 auto; padding-block: 14px 24px; display: flex; flex-direction: column; gap: 10px; }
.marquee { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.marquee h1 { font-family: var(--display); font-size: clamp(16px, 4.4vw, 26px); margin: 0; color: var(--cyan); text-shadow: 3px 3px 0 var(--tally); letter-spacing: 2px; }
.marquee small { font-family: var(--display); font-size: 8px; color: var(--dim); letter-spacing: 2px; }
.hud {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  font-family: var(--display); font-size: 9px; letter-spacing: 1px;
  border: 2px solid var(--line); background: var(--panel); padding: 10px 12px;
}
.score { color: var(--amber); font-variant-numeric: tabular-nums; }
.lvl { color: var(--cyan); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { display: flex; gap: 10px; align-items: center; }
.balls { display: flex; gap: 4px; }
.balls b { width: 9px; height: 9px; background: var(--ink); }
.balls b.off { background: #2b2766; }
.pu { color: var(--amber); }
.screen { position: relative; border: 3px solid var(--line); background: #000; box-shadow: 0 0 0 2px #000, 0 0 30px #2a1f8a55; touch-action: none; }
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
  box-shadow: inset 0 0 70px rgba(0,0,0,.6);
}
canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; cursor: none; }
.ov {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 16px; background: rgba(7,6,28,.8); z-index: 2; cursor: pointer;
}
.ov h2 { font-family: var(--display); font-size: clamp(14px, 3.6vw, 22px); margin: 0; line-height: 1.5; color: var(--cyan); }
.ov h2.red { color: var(--tally); } .ov h2.amber { color: var(--amber); }
.ov p { margin: 0; max-width: 40ch; font-size: 22px; line-height: 1.15; }
.ov .sub { font-family: var(--display); font-size: 8px; color: var(--dim); letter-spacing: 2px; line-height: 1.8; }
.ov .blink { font-family: var(--display); font-size: 10px; color: var(--amber); animation: blink 1s steps(1) infinite; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--display); font-size: 8px; letter-spacing: 1px; justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 10px; border: 3px solid; }
.deck { display: flex; gap: 8px; }
.btn { font-family: var(--display); font-size: 11px; letter-spacing: 1px; cursor: pointer; border: none; padding: 14px 12px; }
.fire { flex: 1; background: var(--tally); box-shadow: 0 4px 0 #8a0f1e; color: #fff; }
.fire:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a0f1e; }
.mute { background: var(--line); color: var(--ink); box-shadow: 0 4px 0 #15123a; }
.btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.help { margin: 0; color: var(--dim); font-size: 18px; text-align: center; line-height: 1.15; }
kbd { font-family: var(--display); font-size: 8px; color: var(--cyan); }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ov .blink { animation: none; } }
</style>
</head>
<body>
<div class="cab">
  <div class="marquee">
    <h1>INPUT BREAKER</h1>
    <small>BREAK OUT THE DYNAMIC INPUTS · REV 1</small>
  </div>
  <div class="hud">
    <span class="score" id="score">000000</span>
    <span class="lvl" id="lvl">LEVEL 1 · ARENA</span>
    <span class="right"><span class="pu" id="pu"></span><span class="balls" id="balls"></span></span>
  </div>
  <div class="screen" id="screen">
    <canvas id="cv" width="640" height="480" aria-label="Input Breaker game screen"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <div class="legend">
    <span style="color:var(--tally)"><i style="border-color:var(--tally)"></i>PGM · 3 HITS</span>
    <span style="color:var(--amber)"><i style="border-color:var(--amber)"></i>PVW · 2 HITS</span>
    <span style="color:#c9c4ff"><i style="border-color:#6b66a8"></i>ISO · 1 HIT</span>
    <span style="color:var(--cyan)">CATCH: SLO-MO · 4-UP SPLIT · WIDE ANGLE</span>
  </div>
  <div class="deck">
    <button class="btn fire" id="fire">INSERT COIN</button>
    <button class="btn mute" id="mute" aria-pressed="false">SND ON</button>
  </div>
  <p class="help">Drag or move the mouse to slide the <kbd>T-BAR</kbd> · <kbd>← →</kbd> also work · <kbd>SPACE</kbd> or tap to launch · <kbd>P</kbd> pause</p>
</div>

<script>
/* ===================== LEVELS =====================
   6 columns. r = PGM tally (3 hits), y = PVW (2 hits), g = ISO (1 hit), . = empty.
   set = which camera shots fill that level's multiview. */
const LEVELS = [
  { name: "ARENA",    speed: 250, set: ["hoops", "netcam", "iso", "crowd", "score", "hoops", "bars"],
    rows: ["gggggg", "gyyyyg", "gggggg"] },
  { name: "STADIUM",  speed: 280, set: ["football", "skycam", "iso", "crowd", "score", "football"],
    rows: ["yyyyyy", "gryyrg", "gggggg", "g.gg.g"] },
  { name: "BALLPARK", speed: 305, set: ["baseball", "crowd", "iso", "score", "baseball", "bars"],
    rows: ["rgrrgr", "yyyyyy", "gyggyg", "yyyyyy"] },
  { name: "RINK",     speed: 330, set: ["hockey", "crowd", "iso", "score", "hockey", "skycam"],

/* ---------- tiles ---------- */
const BASE = 16 * 3600 + 6 * 60 + 50;
function buildLevel(i) {

      x: LEFT + c * (TW + GAP), y: TOP + r * (TH + GAP), hp, max: hp, alive: true,
      shot: L.set[(n * 5 + r) % L.set.length], seed: (n * 7 + i * 3) % 23, input: n + 1,

}

  const hh = Math.floor(tot / 3600) % 24, mm = Math.floor(tot / 60) % 60, ss = tot % 60;
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}.${String(fr).padStart(2, "0")}`;

/* ---------- game flow ---------- */

const pad = n => String(n).padStart(6, "0");
function hud() {
  els.score.textContent = pad(score);
  els.lvl.textContent = `LEVEL ${lvl + 1} · ${LEVELS[lvl].name}`;
  els.balls.innerHTML = [0, 1, 2].map(i => `<b class="${i < lives ? "" : "off"}"></b>`).join("");
  els.pu.textContent = slowT > 0 ? `SLO-MO ${Math.ceil(slowT)}` : wideT > 0 ? `WIDE ${Math.ceil(wideT)}` : "";
}
function overlay(html) { els.ov.innerHTML = html; els.ov.hidden = !html; }
function serve() { balls = [{ x: px, y: PY - 8, vx: 0, vy: 0, stuck: true }]; state = "serve"; overlay(""); els.fire.textContent = "LAUNCH"; }

}

    <span class="sub">${LEVELS.length} VENUES · ARENA · STADIUM · BALLPARK · RINK<br>HI-SCORE ${pad(hi)}</span><span class="blink">PRESS START</span>`);
  els.fire.textContent = "INSERT COIN";
}

  state = "intro";

  els.fire.textContent = "START";
}
function levelClear() {

  if (lvl >= LEVELS.length) return win();
  startLevel();
}
function gameOver() {
  state = "over"; saveHi(); overlay(`<h2 class="red">OFF AIR</h2><p>Out of balls in the ${LEVELS[lvl].name.toLowerCase()}. Score ${pad(score)}.</p><span class="sub">HI-SCORE ${pad(hi)}</span><span class="blink">CONTINUE?</span>`);
  els.fire.textContent = "CONTINUE";
}
function win() {
  state = "win"; saveHi(); lvl = LEVELS.length - 1;
  overlay(`<span class="sub">EVERY VENUE CLEARED</span><h2 class="amber">MULTIVIEW MASTER</h2><p>Score ${pad(score)}. Every input broken out across all ${LEVELS.length} venues.</p><span class="sub">HI-SCORE ${pad(hi)}</span><span class="blink">PLAY AGAIN?</span>`);
  els.fire.textContent = "PLAY AGAIN";
}
function saveHi() { if (score > hi) { hi = score; try { localStorage.setItem("ib-hi", String(hi)); } catch (e) {} } }
function fire() {
  audio();
  if (state === "title") { sfx.coin(); score = 0; lives = 3; lvl = 0; levelBonus = 0; startLevel(); }
  else if (state === "intro") serve();
  else if (state === "serve") launch();
  else if (state === "play") togglePause();
  else if (state === "over") { sfx.coin(); lives = 3; score = Math.floor(score / 2); levelBonus = 0; startLevel(); }
  else if (state === "win") title();
}
function togglePause() {
  if (state !== "play") return;
  paused = !paused; els.fire.textContent = paused ? "RESUME" : "PAUSE";
  overlay(paused ? `<h2>PAUSED</h2><span class="blink">TAP TO RESUME</span>` : "");
}

/* ---------- physics ---------- */
function burst(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 7, s = 40 + Math.random() * 120;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .5 + Math.random() * .4, color }); }
}
function hitTile(T, b) {
  T.hp--; T.hitT = .25; combo++;
  if (T.hp <= 0) {
    T.alive = false; score += [0, 50, 100, 150][T.max] * Math.min(4, combo);
    sfx.brk(); statics.push({ x: T.x, y: T.y, life: .35 }); burst(T.x + TW / 2, T.y + TH / 2, TALLY[T.max]); shake = .15;
    if (Math.random() < .2) {
      const kinds = ["slo", "split", "wide"]; drops.push({ x: T.x + TW / 2, y: T.y + TH / 2, kind: kinds[Math.floor(Math.random() * 3)] });
    }
  } else { score += 10; sfx.hit(T.hp); }
  hud();
}
function stepBall(b, dt) {
  if (b.stuck) { b.x = px; b.y = PY - 8; return true; }
  const k = slowT > 0 ? .5 : 1;
  const steps = 4;
  for (let s = 0; s < steps; s++) {
    b.x += b.vx * dt * k / steps; b.y += b.vy * dt * k / steps;
    if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); sfx.wall(); }
    if (b.x > W - BR) { b.x = W - BR; b.vx = -Math.abs(b.vx); sfx.wall(); }
    if (b.y < BR) { b.y = BR; b.vy = Math.abs(b.vy); sfx.wall(); }
    // paddle
    const hw = pw / 2;
    if (b.vy > 0 && b.y + BR >= PY && b.y + BR <= PY + 12 && b.x > px - hw - BR && b.x < px + hw + BR) {
      const rel = Math.max(-1, Math.min(1, (b.x - px) / hw)), sp = Math.hypot(b.vx, b.vy) * 1.01, a = rel * 1.05;
      const cap = LEVELS[lvl].speed * 1.5, nsp = Math.min(sp, cap);
      b.vx = Math.sin(a) * nsp; b.vy = -Math.cos(a) * nsp; b.y = PY - BR; combo = 0; sfx.paddle();
    }
    // tiles
    for (const T of tiles) {
      if (!T.alive) continue;
      const nx = Math.max(T.x - 3, Math.min(b.x, T.x + TW + 3)), ny = Math.max(T.y - 3, Math.min(b.y, T.y + TH + 3));
      const dx = b.x - nx, dy = b.y - ny;
      if (dx * dx + dy * dy <= BR * BR) {
        const ox = Math.min(Math.abs(b.x - (T.x - 3)), Math.abs(b.x - (T.x + TW + 3)));
        const oy = Math.min(Math.abs(b.y - (T.y - 3)), Math.abs(b.y - (T.y + TH + 3)));
        if (ox < oy) b.vx = -b.vx; else b.vy = -b.vy;
        b.x += b.vx * dt / steps * 1.5; b.y += b.vy * dt / steps * 1.5;
        hitTile(T, b); break;
      }
    }
    if (b.y > H + 10) return false;
  }
  return true;
}
function update(dt) {
  t += dt;
  if (shake > 0) shake -= dt;
  for (const T of tiles) if (T.hitT > 0) T.hitT -= dt;
  statics = statics.filter(s => (s.life -= dt) > 0);
  parts = parts.filter(p => (p.life -= dt) > 0);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; });
  if (paused) return;
  const target = wideT > 0 ? 132 : 84; pw += (target - pw) * Math.min(1, dt * 8);
  if (keyL) px -= 420 * dt; if (keyR) px += 420 * dt;
  px = Math.max(pw / 2, Math.min(W - pw / 2, px));
  if (state !== "play" && state !== "serve") return;
  if (slowT > 0) { slowT -= dt; if (slowT <= 0) hud(); }
  if (wideT > 0) { wideT -= dt; if (wideT <= 0) hud(); }
  balls = balls.filter(b => stepBall(b, dt));
  for (const d of drops) {
    d.y += 90 * dt;
    if (d.y > PY - 6 && d.y < PY + 14 && Math.abs(d.x - px) < pw / 2 + 24) {
      d.got = true; score += 200; sfx.power();
      if (d.kind === "slo") slowT = 8;
      if (d.kind === "wide") wideT = 12;
      if (d.kind === "split") {
        const src = balls.find(b => !b.stuck) || balls[0];
        if (src) for (let i = 0; i < 3; i++) { const a = -0.9 + i * .9, sp = LEVELS[lvl].speed;
          balls.push({ x: src.x, y: src.y, vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp, stuck: false }); }
      }
      hud();
    }
  }
  drops = drops.filter(d => !d.got && d.y < H + 20);
  if (state === "play" && balls.length === 0) {
    lives--; sfx.lose(); shake = .4; combo = 0; slowT = 0; wideT = 0; hud();
    if (lives <= 0) gameOver(); else serve();
  }
  if (state === "play" && tiles.every(T => !T.alive)) levelClear();
  if (Math.floor(t * 4) !== Math.floor((t - dt) * 4)) hud();
}

/* ---------- render ---------- */
const PU = { slo: ["SLO-MO", C.amber], split: ["4-UP", C.cyan], wide: ["WIDE", C.green] };
function draw(dt) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 8 * shake, (Math.random() - .5) * 8 * shake);
  R(-8, -8, W + 16, H + 16, "#07061c");
  for (let i = 0; i < 40; i++) R((i * 97) % W, (i * 53 + t * 8) % H, 1, 1, "#2b2766");
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillStyle = C.dim; ctx.fillText(`LEVEL ${lvl + 1} · ${LEVELS[lvl].name} · DYNAMIC INPUTS`, W / 2, 16);
  for (const T of tiles) if (T.alive) drawTile(T, dt); else {
    ctx.setLineDash([4, 4]); ctx.strokeStyle = "#1d1a44"; ctx.lineWidth = 1; ctx.strokeRect(T.x + .5, T.y + .5, TW - 1, TH - 1); ctx.setLineDash([]);
  }
  for (const s of statics) for (let i = 0; i < 260; i++) R(s.x + Math.random() * TW, s.y + Math.random() * TH, 2, 1, Math.random() < .5 ? "#fff" : "#555");
  for (const d of drops) {
    const [lab, col] = PU[d.kind];
    R(d.x - 30, d.y - 8, 60, 16, col); R(d.x - 30, d.y - 8, 60, 2, "#fff");
    ctx.font = '7px "Press Start 2P", monospace'; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#07061c"; ctx.fillText(lab, d.x, d.y + 1);
  }
  // T-bar paddle
  drawTBar();
  for (const b of balls) { R(b.x - BR, b.y - BR, BR * 2, BR * 2, "#fff"); ctx.globalAlpha = .3; R(b.x - b.vx * .02 - 2, b.y - b.vy * .02 - 2, 4, 4, C.cyan); ctx.globalAlpha = 1; }
  for (const p of parts) R(p.x, p.y, 2, 2, p.color);
  if (slowT > 0) { ctx.globalAlpha = .12; R(0, 0, W, H, C.amber); ctx.globalAlpha = 1; ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = C.amber; ctx.textAlign = "right"; ctx.textBaseline = "top"; ctx.fillText("SLO-MO 50%", W - 10, 30); }
  if (state === "serve") { ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = C.amber; ctx.textAlign = "center"; ctx.textBaseline = "middle"; if (Math.floor(t * 2) % 2) ctx.fillText("PRESS SPACE OR TAP TO LAUNCH", W / 2, PY - 40); }
  ctx.restore();
}

/* Broadcast T-bar: gripped crossbar on a stem, riding a slotted fader track with position LEDs. */
function drawTBar() {
  const trackY = 466, x0 = px - pw / 2;
  // control-panel plate + slot
  R(0, trackY - 4, W, 18, "#1a1b26"); R(0, trackY - 4, W, 1, "#3a3d52");
  R(14, trackY + 2, W - 28, 4, "#000"); R(14, trackY + 6, W - 28, 1, "#2e3040");
  // position LEDs along the travel
  const n = 32;
  for (let i = 0; i < n; i++) {
    const lx = 18 + i * (W - 36) / (n - 1), on = Math.abs(lx - px) < pw / 2;
    R(lx - 2, trackY + 9, 4, 2, on ? (i < n * .1 || i > n * .9 ? C.tally : C.green) : "#26283a");
  }
  // stem down into the slot
  R(px - 3, PY + 9, 6, trackY + 4 - (PY + 9), "#9aa0b8"); R(px - 3, PY + 9, 2, trackY + 4 - (PY + 9), "#d6d9e8");
  R(px - 8, trackY, 16, 5, "#3a3d52");
  // crossbar body with end caps
  R(x0 + 4, PY, pw - 8, 10, "#2b2e3f");
  R(x0 + 4, PY, pw - 8, 2, "#5a5f7a"); R(x0 + 4, PY + 8, pw - 8, 2, "#16171f");
  // rubber grip ridges
  for (let gx = x0 + 10; gx < x0 + pw - 10; gx += 4) R(gx, PY + 2, 2, 6, "#3c4055");
  // end caps
  R(x0, PY - 1, 6, 12, "#c9cbe0"); R(x0 + pw - 6, PY - 1, 6, 12, "#c9cbe0");
  R(x0, PY - 1, 6, 2, "#ffffff"); R(x0 + pw - 6, PY - 1, 6, 2, "#ffffff");
  // centre tally lamp: lights when the ball comes off the bar
  const lit = combo === 0 && balls.some(b => !b.stuck && b.vy < 0 && b.y > PY - 80);
  R(px - 5, PY + 2, 10, 6, lit ? C.tally : "#5a1220"); R(px - 5, PY + 2, 10, 1, lit ? "#ffb0b8" : "#7a2a38");
}

/* ---------- input ---------- */
function toCanvasX(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener("pointermove", e => { px = toCanvasX(e); });
cv.addEventListener("pointerdown", e => { audio(); px = toCanvasX(e); if (state === "serve") launch(); else if (state === "play" && paused) togglePause(); });
els.ov.addEventListener("pointerdown", e => { e.preventDefault(); if (paused) togglePause(); else fire(); });
els.fire.addEventListener("click", fire);
els.mute.addEventListener("click", () => { muted = !muted; els.mute.textContent = muted ? "SND OFF" : "SND ON"; els.mute.setAttribute("aria-pressed", String(muted)); });
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") { keyL = true; e.preventDefault(); }
  else if (e.key === "ArrowRight" || e.key === "d") { keyR = true; e.preventDefault(); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (state === "play") { if (paused) togglePause(); } else fire(); }
  else if (e.key === "p" || e.key === "P") togglePause();
});
addEventListener("keyup", e => { if (e.key === "ArrowLeft" || e.key === "a") keyL = false; if (e.key === "ArrowRight" || e.key === "d") keyR = false; });
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play" && !paused) togglePause(); });

let last = performance.now();
function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(dt); requestAnimationFrame(loop); }
title();
requestAnimationFrame(loop);
</script>
</body>
</html>
