/* Layout: a live quiz-show stage. Light rig canvas behind everything; top bar (brand, lifelines, controls);
   centre stage (host caption, question, four RCP-style answer keys); prize ladder on the right. Single dark look by choice. */
:root {
  --bg: #04050d; --panel: rgba(11, 15, 38, .84); --panel2: #0c1130; --line: #2a3566;
  --ink: #eef1ff; --dim: #97a1d2; --cyan: #33d6ff; --amber: #ffb52e; --red: #ff3346; --green: #3dff9a; --gold: #ffd76a;
  --display: "Saira Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Saira", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

.app { position: relative; z-index: 1; min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 250px; grid-template-rows: auto 1fr;
  gap: 14px 18px; padding-block: 14px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }

/* ---------- top bar ---------- */
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 2px; line-height: 1; display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
.brand b { color: var(--gold); font-weight: 800; }
.brand small { font-family: var(--body); font-weight: 500; font-size: 10px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
.lifelines { display: flex; gap: 8px; }
.ll { position: relative; min-width: 92px; height: 48px; padding: 0 12px; border-radius: 24px; border: 2px solid var(--cyan); background: radial-gradient(ellipse at 50% 0%, #1b3a6a, #0a1030 70%);
  font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 0 14px rgba(51, 214, 255, .35); }
.ll svg { width: 20px; height: 20px; flex: none; }
.ll:disabled { cursor: default; }
.ll.locked { opacity: .45; box-shadow: none; }
.ll.used { border-color: #3a4270; color: #5d6696; box-shadow: none; background: #0a0d22; }
.ll.used::after { content: ""; position: absolute; left: 10px; right: 10px; top: 50%; height: 3px; background: var(--red); transform: rotate(-12deg); }
.ctl { display: flex; gap: 8px; }
.mini { height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 1.5px; color: var(--dim); }
.mini[aria-pressed="true"] { color: var(--ink); border-color: var(--cyan); }
.mini.walk { color: var(--gold); border-color: #6b5a2a; }
.mini:disabled { opacity: .4; cursor: default; }
.mob { display: none; grid-column: 1 / -1; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; letter-spacing: 1.5px; font-size: 15px; }
.mob .pips { display: flex; gap: 3px; flex: 1; }
.mob .pips i { flex: 1; height: 6px; background: #1a2148; border-radius: 2px; }
.mob .pips i.done { background: var(--green); } .mob .pips i.cur { background: var(--amber); } .mob .pips i.safe { box-shadow: 0 0 0 1px var(--gold); }

/* ---------- stage ---------- */
.stage { display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; min-width: 0; padding-bottom: 6px; }
.host { display: flex; gap: 12px; align-items: flex-start; min-height: 76px; }
.host .tag { flex: none; font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 2px; padding: 4px 8px; border-radius: 4px; background: var(--red); color: #fff; margin-top: 2px; }
.host p { margin: 0; font-size: clamp(15px, 1.5vw, 18px); line-height: 1.4; max-width: 68ch; text-shadow: 0 2px 8px #000; }
.host p .src { display: block; margin-top: 4px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); }
.qwrap { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(6px);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .04) inset, 0 18px 50px rgba(0, 0, 0, .55); }
.qmeta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--display); font-weight: 700; letter-spacing: 2px; font-size: 14px; color: var(--cyan); text-transform: uppercase; }
.qmeta .prize { color: var(--gold); }
.qtext { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2.9vw, 36px); line-height: 1.15; text-wrap: balance; min-height: 2.3em; }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ans { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; min-height: 72px; padding: 12px 16px 12px 12px; text-align: left;
  background: linear-gradient(#1a2250, #0d1232); border: 2px solid #33407a; border-radius: 12px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .09), 0 6px 0 #04061a, 0 10px 24px rgba(0, 0, 0, .5);
  font-size: clamp(15px, 1.55vw, 19px); font-weight: 500; line-height: 1.2; transition: transform .08s, border-color .15s, box-shadow .15s, opacity .3s; opacity: 0; transform: translateY(10px); }
.ans.in { opacity: 1; transform: none; }
.ans:not(:disabled):hover { border-color: var(--cyan); }
.ans:not(:disabled):active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .09), 0 2px 0 #04061a; }
.ans:disabled { cursor: default; }
.ans .key { width: 46px; height: 46px; border-radius: 9px; display: grid; place-items: center; background: #070a1c; border: 2px solid #3d4b8c; font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--cyan); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .6); }
.ans kbd { display: inline-block; min-width: 34px; padding: 3px 10px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.15em; letter-spacing: 1px; background: #060818; border: 1px solid #55639e; border-bottom-width: 3px; border-radius: 6px; margin-right: 6px; }
.app.pre { visibility: hidden; }
.ans .tl { position: absolute; top: 6px; right: 10px; font-family: var(--display); font-weight: 800; font-size: 11px; letter-spacing: 2px; }
.ans.pvw { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber), 0 0 34px rgba(255, 181, 46, .55), 0 6px 0 #04061a; }
.ans.pvw .key { background: var(--amber); color: #1a1000; border-color: #ffe0a0; } .ans.pvw .tl { color: var(--amber); }
.ans.pgm { border-color: var(--red); background: linear-gradient(#4a1020, #1c0612); animation: onair 1s ease-in-out infinite; }
.ans.pgm .key { background: var(--red); color: #fff; border-color: #ffb0b8; } .ans.pgm .tl { color: #ff8a96; }
.ans.ok { border-color: var(--green); background: linear-gradient(#0f4a30, #06200f); box-shadow: 0 0 0 2px var(--green), 0 0 44px rgba(61, 255, 154, .6), 0 6px 0 #04061a; animation: okblink .28s steps(1) 5; }
.ans.ok .key { background: var(--green); color: #02170b; border-color: #c6ffe0; } .ans.ok .tl { color: var(--green); }
.ans.bad { border-color: var(--red); background: linear-gradient(#3a0c18, #16040c); box-shadow: 0 0 0 2px var(--red), 0 6px 0 #04061a; }
.ans.bad .key { background: #5a1220; color: #ffb0b8; border-color: var(--red); } .ans.bad .tl { color: var(--red); }
.ans.dead { opacity: .28 !important; border-style: dashed; box-shadow: none; }
.ans.dead .txt { text-decoration: line-through; } .ans.dead .tl { color: var(--dim); }
@keyframes onair { 50% { box-shadow: 0 0 0 2px var(--red), 0 0 46px rgba(255, 51, 70, .75), 0 6px 0 #04061a; } }
@keyframes okblink { 50% { background: #0b1330; box-shadow: 0 6px 0 #04061a; } }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; min-height: 52px; }
.confirm span { font-family: var(--display); font-weight: 700; letter-spacing: 2px; font-size: 17px; color: var(--amber); margin-right: auto; text-transform: uppercase; }
.big { height: 50px; padding: 0 26px; border-radius: 8px; border: none; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: 2.5px; }
.big.take { background: var(--red); color: #fff; box-shadow: 0 5px 0 #8a0f1e, 0 0 26px rgba(255, 51, 70, .45); }
.big.go { background: var(--gold); color: #201400; box-shadow: 0 5px 0 #8a6a14, 0 0 26px rgba(255, 215, 106, .4); }
.big.ghost { background: #121838; color: var(--ink); border: 2px solid var(--line); box-shadow: 0 5px 0 #04061a; }
.big:active { transform: translateY(4px); box-shadow: none; }

/* ---------- ladder ---------- */
.ladder { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 10px; align-self: end; backdrop-filter: blur(6px); }
.ladder h2 { margin: 0 6px 8px; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
.ladder ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 2px; }
.ladder li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 5px 10px; border-radius: 6px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 1px; color: #7d88bd; font-variant-numeric: tabular-nums; }
.ladder li .n { font-size: 13px; color: #56609a; }
.ladder li .u { font-size: 10px; letter-spacing: 2px; }
.ladder li.safe { color: var(--gold); } .ladder li.safe .u::before { content: "ARCHIVED"; }
.ladder li.done { color: var(--green); } .ladder li.done .n { color: var(--green); }
.ladder li.cur { background: var(--amber); color: #1a1000; box-shadow: 0 0 22px rgba(255, 181, 46, .5); } .ladder li.cur .n { color: #5a3a00; }
.ladder li.top { font-size: 22px; }

/* ---------- overlays ---------- */
.veil { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(3, 4, 12, .72); overflow-y: auto; }
.veil.clear { background: radial-gradient(ellipse at 50% 45%, rgba(3, 4, 12, .35), rgba(3, 4, 12, .88)); }
.card { width: min(680px, 100%); max-height: 100%; overflow-y: auto; background: #0a0e28; border: 2px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 90px #000; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: 2px; line-height: 1.05; text-transform: uppercase; }
.card p { margin: 0; line-height: 1.45; color: #d5daf5; }
.card .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.eyebrow { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; }

.title { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(760px, 100%); }
.logo { font-family: var(--display); font-weight: 800; line-height: .86; text-transform: uppercase; letter-spacing: 2px; display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 8px 30px rgba(255, 190, 60, .35)); }
.logo .l1 { font-size: clamp(30px, 7vw, 62px); letter-spacing: .32em; margin-right: -.32em; color: var(--ink); }
.logo .l2 { font-size: clamp(64px, 17vw, 168px); background: linear-gradient(100deg, #b98a1e 0%, #ffe9a8 22%, #ffd76a 40%, #fff7dc 50%, #ffd76a 60%, #b98a1e 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 5s linear infinite; }
.logo .l3 { margin-top: 10px; font-size: clamp(13px, 2.2vw, 18px); letter-spacing: .5em; margin-right: -.5em; color: var(--cyan); font-weight: 700; }
@keyframes shine { to { background-position: -250% 0; } }
.title .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: center; font-family: var(--display); font-weight: 700; letter-spacing: 2.5px; font-size: 15px; color: var(--dim); text-transform: uppercase; }
.title .facts b { color: var(--ink); }
.title p { margin: 0; max-width: 54ch; line-height: 1.45; color: #d5daf5; text-shadow: 0 2px 8px #000; }

/* crowd poll */
.poll { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: end; height: 220px; padding-top: 8px; }
.poll .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.poll .pct { font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.poll .bar { width: 100%; max-width: 74px; height: 0; background: linear-gradient(var(--cyan), #1a5cff); border-radius: 6px 6px 0 0; box-shadow: 0 0 22px rgba(51, 214, 255, .5); transition: height .25s; }
.poll .lab { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: #070a1c; border: 2px solid #3d4b8c; font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--cyan); }
.poll .col.off { opacity: .25; }

/* phone */
.team { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.mate { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 12px; border: 2px solid var(--line); background: #0d1232; }
.mate:hover { border-color: var(--cyan); }
.mate .av { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; color: #06101a; }
.mate b { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 1px; }
.call { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; }
.clock { position: relative; width: 96px; height: 96px; flex: none; }
.clock svg { width: 96px; height: 96px; transform: rotate(-90deg); }
.clock .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; }
.chat { display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
.chat .ln { padding: 8px 12px; border-radius: 10px; background: #121838; line-height: 1.35; max-width: 46ch; animation: pop .25s ease-out; }
.chat .ln b { display: block; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 2px; color: var(--cyan); text-transform: uppercase; }
.chat .ln.host { align-self: flex-end; background: #2a1020; } .chat .ln.host b { color: #ff8a96; }
.chat .ln.sys { background: none; color: var(--dim); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 0; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }

/* end screen */
.win { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 9vw, 76px); line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; text-shadow: 0 0 40px rgba(255, 215, 106, .45); }
.win small { display: block; font-size: 16px; letter-spacing: 4px; color: var(--dim); margin-top: 4px; }
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.review li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 10px; border-radius: 8px; background: #0d1232; font-size: 14px; line-height: 1.35; }
.review li i { width: 18px; height: 18px; border-radius: 50%; margin-top: 2px; background: var(--green); }
.review li.x i { background: var(--red); } .review li.s i { background: #4a5590; }
.review li b { color: var(--green); font-weight: 600; } .review li.x b { color: #ff8a96; }

@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .ladder { display: none; } .mob { display: flex; }
  .answers { grid-template-columns: minmax(0, 1fr); }
  .ans { min-height: 60px; }
  .brand { font-size: 18px; }
  .ll { min-width: 0; padding: 0 12px; } .ll span { display: none; }
  .call { grid-template-columns: minmax(0, 1fr); justify-items: center; } .chat { width: 100%; }
  .stage { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .logo .l2, .ans.pgm, .ans.ok { animation: none; } }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span>MILLION <b>FRAME</b> REPLAY</span><small>The DreamCatcher operator quiz show</small></div>
    <div class="lifelines" role="group" aria-label="Lifelines">
      <button class="ll" id="llFifty" title="50:50: two wrong answers go to black">50:50</button>
      <button class="ll" id="llCrowd" title="Ask the crowd: the whole stadium votes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="9" r="2.5"/><circle cx="17" cy="9" r="2.5"/><circle cx="12" cy="6" r="2.5"/><path d="M2 20c0-3 2.2-5 5-5s5 2 5 5M12 20c0-3 2.2-5 5-5s5 2 5 5"/></svg><span>CROWD</span></button>
      <button class="ll" id="llPhone" title="Phone the team: 30 seconds with a teammate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2C10 21 3 14 3 5a2 2 0 0 1 2-2z"/></svg><span>TEAM</span></button>
    </div>
    <div class="ctl">
      <button class="mini walk" id="walk">EXPORT &amp; WALK</button>
      <button class="mini" id="snd" aria-pressed="true">SOUND</button>
      <button class="mini" id="voice" aria-pressed="false">HOST VOICE</button>
    </div>
  </header>
  <div class="mob" aria-hidden="true"><span id="mobQ">Q1</span><span class="pips" id="pips"></span><span id="mobV" style="color:var(--gold)">100</span></div>

  <main class="stage">
    <div class="host" aria-live="polite"><span class="tag">HOST</span><p id="host">Welcome to the hot seat.</p></div>
    <section class="qwrap">
      <div class="qmeta"><span id="qnum">Question 1 of 12</span><span class="prize" id="qprize">for 100 frames</span></div>
      <h1 class="qtext" id="qtext">&nbsp;</h1>
    </section>
    <div class="answers" id="answers">
      <button class="ans" id="a0" data-k="0"><span class="key">A</span><span class="txt"></span><span class="tl"></span></button>
      <button class="ans" id="a1" data-k="1"><span class="key">B</span><span class="txt"></span><span class="tl"></span></button>
      <button class="ans" id="a2" data-k="2"><span class="key">C</span><span class="txt"></span><span class="tl"></span></button>
      <button class="ans" id="a3" data-k="3"><span class="key">D</span><span class="txt"></span><span class="tl"></span></button>
    </div>
    <div class="confirm" id="confirm"></div>
  </main>

  <aside class="ladder" aria-label="Prize ladder"><h2>Prize ladder · frames</h2><ol id="ladder"></ol></aside>
</div>

<div class="veil clear" id="veil"></div>

<script>
/* ===================== QUESTION BANK =====================
   t = tier 1-4 (three questions per tier are drawn each game)
   c = category: keys (shortcuts), ops (operating + recovery), sys (system + install)
   a = answers, CORRECT ANSWER FIRST (shuffled at runtime)
   g = optional group: two questions with the same g never appear in one game
   Every fact below comes from the shortcut sheets, the Installation Guide,
   the operational notes in the team knowledge base, or the training sessions. */
const SRC = {
  K: "Keyboard shortcut sheets",
  I: "Installation Guide",
  B: "Team knowledge base",
  T: "Training sessions",
  M: "Operation Guide, via the team knowledge base",
};
const QUESTIONS = [
  /* ---------- TIER 1 · warm-up ---------- */
  { t: 1, c: "keys", g: "io", q: "You just saw the play of the game. Which key marks your IN point?", a: ["[", "]", "\\", "M"], why: "[ marks IN and ] marks OUT. The brackets are the two ends of your clip.", src: SRC.K },
  { t: 1, c: "keys", g: "io", q: "Which key marks your OUT point?", a: ["]", "[", "\\", "Backspace"], why: "] marks OUT and [ marks IN. Backspace clears the in and out marks.", src: SRC.K },
  { t: 1, c: "keys", q: "You have an IN and an OUT. Which key creates the clip?", a: ["\\ (backslash)", "/ (forward slash)", "Enter", "C"], why: "Backslash creates the clip. Forward slash opens search, Enter queues the current clip and C toggles camera mode.", src: SRC.K },
  { t: 1, c: "keys", q: "Which key plays or pauses the selected output?", a: ["Space", "Enter", "Pause", "Tab"], why: "Space (or F1) is play or pause. The Pause key is different: it sends you back to record live.", src: SRC.K },
  { t: 1, c: "keys", q: "Which key renames a clip?", a: ["R", "N", "F2", "Ctrl+R"], why: "R renames. Ctrl+R restripes the clip timecode, and F2 selects the previous clip in a package.", src: SRC.K },
  { t: 1, c: "keys", q: "Which key opens Search?", a: ["/ (forward slash)", "S", "Ctrl+F", "F3"], why: "/ or F8 opens search. Ctrl+F toggles the film effect, which you do not want by accident mid-show.", src: SRC.K },
  { t: 1, c: "ops", q: "The trainer's elevator rule: how many times do you press a key to make something happen?", a: ["Once", "Twice, to be sure", "Seven-ish", "Until it works"], why: "Once. The elevator heard you the first time, and so did DreamCatcher. Mashing a key can fire the command more than once.", src: SRC.T },
  { t: 1, c: "keys", q: "Which key shows your bins?", a: ["B", "G", "N", "F10"], why: "B or F9 shows bins. G is go to clip, and F10 shows the playlist.", src: SRC.K },
  { t: 1, c: "keys", q: "Which key shows the playlist?", a: ["P", "L", "F9", "Shift+P"], why: "P or F10 shows the playlist. F9 is bins, and Shift+P toggles a keyframe pause point.", src: SRC.K },
  { t: 1, c: "sys", q: "What is the model name of the DreamCatcher control panel?", a: ["DC-RCP10", "DC-TPIP10", "DC-Logger", "7700PTX-TRNS"], why: "The panel is the DC-RCP10. The DC-TPIP10 adds switcher protocols, and the DC-Logger is the logging station.", src: SRC.I },
  { t: 1, c: "keys", q: "Which key cancels your current selection?", a: ["Esc", "Backspace", "Del", "Space"], why: "Esc cancels the selection. Del deletes the selected clips, so do not confuse the two.", src: SRC.K },

  /* ---------- TIER 2 · working operator ---------- */
  { t: 2, c: "keys", q: "You are parked on a replay and need to get back to live record. Which key?", a: ["Pause", "Esc", "End", "Space"], why: "The Pause key is Record: it returns you to record live. Space only plays or pauses.", src: SRC.K },
  { t: 2, c: "keys", q: "Which key jogs forward one step?", a: [". (period)", ", (comma)", "] (right bracket)", "Right arrow"], why: "Period jogs forward and comma jogs backward. Right arrow moves to the next bank.", src: SRC.K },
  { t: 2, c: "keys", q: "Which key edits the tags on the selected clip?", a: ["T", "G", "F8", "Shift+M"], why: "T or F7 edits tags. F8 is search, and Shift+M opens the event editor.", src: SRC.K },
  { t: 2, c: "keys", g: "pl", q: "Which shortcut adds the selected clips to the playlist?", a: ["Alt+Enter", "Ctrl+Enter", "Enter", "Shift+Enter"], why: "Alt+Enter adds clips to the playlist. Ctrl+Enter creates a new playlist from them, and plain Enter queues the current clip.", src: SRC.K },
  { t: 2, c: "keys", g: "pl", q: "Which shortcut creates a brand new playlist from the selected clips?", a: ["Ctrl+Enter", "Alt+Enter", "Shift+Enter", "Ctrl+P"], why: "Ctrl+Enter creates a playlist from the selected clips. Alt+Enter adds them to the existing playlist.", src: SRC.K },
  { t: 2, c: "keys", q: "Which key tags a clip for export?", a: ["X", "Z", "E", "Shift+X"], why: "X tags for export and Z tags for archive. Shift+X opens the export dialog.", src: SRC.K },
  { t: 2, c: "keys", q: "Which key shows the angle selector?", a: ["A", "C", "V", "Shift+C"], why: "A shows the angle selector. C toggles camera mode, and Shift+C opens the camera dialog.", src: SRC.K },
  { t: 2, c: "keys", q: "Which key creates an event?", a: ["M", "E", "\\", "Shift+M"], why: "M creates an event, and Alt+M creates one at live. Shift+M opens the event editor.", src: SRC.K },
  { t: 2, c: "keys", q: "Which shortcut selects Output 1?", a: ["Ctrl+F1", "F1", "Ctrl+1", "Alt+1"], why: "Ctrl plus a function key selects an output. F1 by itself is play or pause.", src: SRC.K },
  { t: 2, c: "ops", q: "You have worked the recovery ladder and the system is still down. Who do you email?", a: ["lmsupport@evertz.com", "sales@evertz.com", "The camera operators", "Nobody. Keep rebooting."], why: "Live Media Venue Support at lmsupport@evertz.com is the escalation contact. Tell your producer early, too.", src: SRC.B },
  { t: 2, c: "sys", q: "Which shortcut enters VUE Edit Mode to change layouts and systems?", a: ["Ctrl+E", "Ctrl+L", "F2", "Ctrl+Alt+P"], why: "Ctrl+E enters VUE Edit Mode, and Esc exits it. Ctrl+L toggles the hybrid layout.", src: SRC.I },
  { t: 2, c: "keys", q: "In the Playlists view, which key locks a playlist?", a: ["L", "K", "Ctrl+L", "P"], why: "L locks the playlist. K moves to the previous slot.", src: SRC.K },
  { t: 2, c: "keys", q: "Which key runs a Quick Sync from the Clips view?", a: ["Q", "W", "S", "Y"], why: "Q is Quick Sync in the Clips view. S selects a clip in multiselect mode.", src: SRC.K },
  { t: 2, c: "keys", q: "Which key is Go to Clip?", a: ["G", "J", "Home", "/"], why: "G is go to clip. J moves to the next slot, and Home jumps to the first slot on the page.", src: SRC.K },

  /* ---------- TIER 3 · show-ready ---------- */
  { t: 3, c: "keys", g: "ang", q: "In the angle selector, which key swaps angle positions?", a: ["D", "B", "A", "C"], why: "D swaps angle positions. B inserts angles after the current clip, which is the classic mix-up.", src: SRC.K + " and " + SRC.T.toLowerCase() },
  { t: 3, c: "keys", g: "ang", q: "In the angle selector, what does the B key do?", a: ["Inserts angles after the current clip", "Inserts angles before the current clip", "Swaps angle positions", "Shows the bins"], why: "A inserts before, B inserts after and C inserts at the beginning of the playlist. D is the swap.", src: SRC.K },
  { t: 3, c: "keys", g: "scrub", q: "Which keyboard shortcut toggles scrub mode?", a: ["Ctrl+Alt+S", "Shift+S", "Alt+S", "Ctrl+S"], why: "Ctrl+Alt+S toggles scrub mode. Shift+S sorts clips, and Alt+S toggles multiselect.", src: SRC.K },
  { t: 3, c: "keys", q: "Which shortcut ejects ALL outputs?", a: ["Ctrl+Alt+Space", "Ctrl+Space", "Shift+Space", "Alt+Space"], why: "Ctrl+Alt+Space ejects all outputs. Ctrl+Space ejects only the selected ones.", src: SRC.K },
  { t: 3, c: "keys", q: "Which shortcut is Mark the Logs?", a: ["Both Shift keys together", "Ctrl+L", "Shift+L", "Alt+L"], why: "Press both Shift keys at once. Shift+L sets an anchor, and Alt+L selects the anchored clip location.", src: SRC.K },
  { t: 3, c: "ops", g: "ladder", q: "The interface is misbehaving mid-show. What is the first, gentlest step on the recovery ladder?", a: ["Ctrl+Alt+R, which restarts the interface only", "A Quick System Restart", "A full reboot", "Pulling the power cord"], why: "Start narrow. Ctrl+Alt+R restarts only the interface. A Quick System Restart is about 30 seconds with outputs black, and a full reboot is about 4 minutes.", src: SRC.B },
  { t: 3, c: "ops", g: "ladder", q: "A Quick System Restart takes your outputs to black for roughly how long?", a: ["About 30 seconds", "About 4 minutes", "No time at all", "About 15 minutes"], why: "About 30 seconds. A full reboot is about 4 minutes, so save that one for pre-show or halftime.", src: SRC.B },
  { t: 3, c: "sys", g: "clear", q: "In Data Management, what does Clear Record Trains remove?", a: ["Unclipped video only", "All clips and playlists", "Only your tags", "Only exported files"], why: "Clear Record Trains removes unclipped video. Clips, playlists and edit projects stay. Clear All Data removes everything and cannot be undone.", src: SRC.I },
  { t: 3, c: "sys", g: "clear", q: "You are about to run Clear All Data. How do you keep the clips you care about?", a: ["Archive or export them first", "Lock the playlist", "Rename them with a star", "Undo it afterwards"], why: "There is no undo. Archive or export clips first, and flatten playlists and edit projects before you archive or export them.", src: SRC.I },
  { t: 3, c: "keys", q: "F4 shows montage Cut and F5 shows montage Loop. What does F6 show?", a: ["Montage Mosaic", "Montage Split", "The bins", "The playlist"], why: "F6 is montage Mosaic. F9 is bins, and F10 is the playlist.", src: SRC.K },
  { t: 3, c: "keys", q: "In the current playlist, which key changes a clip's speed?", a: ["S", "C", "E", "V"], why: "S changes clip speed. C changes the transition duration, and E toggles end of sequence.", src: SRC.K },
  { t: 3, c: "keys", q: "In the current playlist, which shortcut jumps to the on-air clip?", a: ["Ctrl+A", "Home", "Ctrl+J", "G"], why: "Ctrl+A jumps to the on-air clip. Home goes to the first slot.", src: SRC.K },
  { t: 3, c: "keys", q: "Which shortcut opens Go to Timecode?", a: ["Shift+:", "Ctrl+T", "Shift+T", "Ctrl+G"], why: "Shift+: opens Go to Timecode. Shift+T opens the tag editor.", src: SRC.K },
  { t: 3, c: "keys", q: "Q runs Quick Sync in the Clips view. What does Q do in the Playlists view?", a: ["Quick mode", "Queue the package", "Quit the playlist", "Quarter speed"], why: "In the Playlists view Q is Quick mode. Same key, different job, depending on the view you are in.", src: SRC.K },
  { t: 3, c: "sys", q: "Which switcher control protocol is built into DreamCatcher with no extra hardware?", a: ["AMP", "VDCP", "PBUS", "Odetics"], why: "AMP is built in. The DC-TPIP10 adds AMP serial, VDCP, PBUS and Odetics.", src: SRC.I },
  { t: 3, c: "keys", q: "Pause returns you to record live. What does Shift+Pause do?", a: ["Returns to live without clearing", "Stops all recording", "Ejects the output", "Locks the panel"], why: "Shift+Pause is Return: back to record live without clearing.", src: SRC.K },

  /* ---------- TIER 4 · the big frames ---------- */
  { t: 4, c: "sys", q: "On a Double Density system with two I/O cards, what is the maximum HD configuration?", a: ["14 in × 2 out", "16 in × 0 out", "12 in × 6 out", "8 in × 8 out"], why: "The maximum is 14 in × 2 out for HD, and 8 in × 4 out for 1080p.", src: SRC.I },
  { t: 4, c: "sys", g: "ref", q: "Per the Installation Guide, which reference signal does the classic DreamCatcher server require?", a: ["Black burst", "Word clock", "Composite color bars", "No reference at all"], why: "Black burst, plugged into DIN 1. On a Double Density system both reference DINs must be connected.", src: SRC.I },
  { t: 4, c: "sys", g: "ref", q: "On the classic server I/O card, which connector takes the reference signal?", a: ["DIN 1, at the bottom", "DIN 9, at the top", "The DB25 connector", "Ethernet 0"], why: "DIN 1 is reference. Output 1 goes on DIN 2 directly above it, and the inputs follow the outputs.", src: SRC.I },

/* ===================== AUDIO =====================
   Everything is synthesised live with Web Audio: an original score (theme, tension beds that
   climb with the ladder, the lock-in drone) plus stings, crowd, phone and UI sounds. No samples. */
const A = { ctx: null, on: true, out: null, rev: null, mus: null, noise: null };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function initAudio() {
  if (A.ctx) { if (A.ctx.state === "suspended") A.ctx.resume(); return; }
  try { A.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const c = A.ctx;
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = .004; comp.release.value = .25;
  A.master = c.createGain(); A.master.gain.value = A.on ? .9 : 0; comp.connect(A.master).connect(c.destination);
  A.out = c.createGain(); A.out.connect(comp);                 // sfx bus
  A.mus = c.createGain(); A.mus.gain.value = .9; A.mus.connect(comp);   // music bus (duckable)
  // reverb: generated impulse
  const len = Math.floor(c.sampleRate * 2.6), ir = c.createBuffer(2, len, c.sampleRate);

  const conv = c.createConvolver(); conv.buffer = ir; const wet = c.createGain(); wet.gain.value = .5; conv.connect(wet).connect(comp);
  A.rev = c.createGain(); A.rev.connect(conv);

  const nlen = c.sampleRate * 2; A.noise = c.createBuffer(1, nlen, c.sampleRate); const nd = A.noise.getChannelData(0); for (let i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;
}
function setSound(on) { A.on = on; if (A.master) A.master.gain.setTargetAtTime(on ? .9 : 0, A.ctx.currentTime, .03); }
const now = () => A.ctx ? A.ctx.currentTime : 0;

/* ---------- primitives ---------- */

  node.connect(g); g.connect(o.bus || A.out); if (o.wet) { const w = c.createGain(); w.gain.value = o.wet; g.connect(w).connect(A.rev); }
  osc.start(t); osc.stop(t + dur + .05); return g;
}
function nz(o) {     // {t,dur,g,type,freq,f2,q,a,r,bus,wet}
  if (!A.ctx) return; const c = A.ctx, t = o.t ?? c.currentTime, dur = o.dur ?? .2, a = o.a ?? .005, r = o.r ?? .1;
  const s = c.createBufferSource(); s.buffer = A.noise; s.loop = true; s.loopStart = Math.random();
  const f = c.createBiquadFilter(); f.type = o.type || "bandpass"; f.frequency.setValueAtTime(o.freq || 1000, t); if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + dur); f.Q.value = o.q ?? .8;
  const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.g ?? .1, t + a); g.gain.setValueAtTime(o.g ?? .1, t + Math.max(a, dur - r)); g.gain.linearRampToValueAtTime(0, t + dur);
  s.connect(f).connect(g); g.connect(o.bus || A.out); if (o.wet) { const w = c.createGain(); w.gain.value = o.wet; g.connect(w).connect(A.rev); }
  s.start(t, Math.random() * 1.5); s.stop(t + dur + .05); return g;
}
/* ---------- instruments ---------- */
const pad = (m, t, dur, g = .035, bus = A.mus) => [-7, 7].forEach(det => tone({ f: mtof(m), t, dur, g, type: "sawtooth", det, a: dur * .25, r: dur * .35, lp: 1100, bus, wet: .6 }));
const brass = (m, t, dur, g = .07, bus = A.mus) => [-6, 0, 6].forEach(det => tone({ f: mtof(m), t, dur, g: g / 1.6, type: "sawtooth", det, a: .03, r: Math.min(.25, dur * .4), lp: 500, lp2: 3200, q: 1.2, bus, wet: .45 }));
const bassN = (m, t, dur, g = .16, bus = A.mus) => { tone({ f: mtof(m), t, dur, g, type: "triangle", a: .01, r: dur * .5, bus }); tone({ f: mtof(m - 12), t, dur, g: g * .7, type: "sine", a: .01, r: dur * .5, bus }); };
const kick = (t, g = .5, bus = A.mus) => tone({ f: 120, f2: 38, t, dur: .22, g, type: "sine", a: .002, r: .16, bus });
const timp = (m, t, g = .3, bus = A.mus) => { tone({ f: mtof(m) * 1.5, f2: mtof(m), t, dur: .9, g, type: "sine", a: .003, r: .8, bus, wet: .5 }); nz({ t, dur: .08, g: g * .25, type: "lowpass", freq: 400, bus }); };
const hat = (t, g = .03, bus = A.mus) => nz({ t, dur: .04, g, type: "highpass", freq: 7000, a: .001, r: .035, bus });
const snare = (t, g = .1, bus = A.mus) => { nz({ t, dur: .16, g, type: "bandpass", freq: 1900, q: .6, a: .001, r: .14, bus, wet: .3 }); tone({ f: 190, f2: 120, t, dur: .1, g: g * .6, type: "triangle", bus }); };
const pluck = (m, t, g = .05, bus = A.mus) => tone({ f: mtof(m), t, dur: .5, g, type: "triangle", a: .003, r: .46, bus, wet: .8 });

/* ---------- sequencer ---------- */
const Seq = { timer: null, step: 0, next: 0, mode: null, tier: 1 };
const PROG = [[0, 3, 7], [-4, 0, 3], [5, 8, 12], [7, 10, 14]];                     // i  VI  iv  v   (tension bed)
const TITLE = {                                                                     // original theme, D minor
  chords: [[50, 53, 57], [46, 50, 53], [53, 57, 60], [48, 52, 55], [43, 46, 50], [46, 50, 53], [45, 50, 52], [45, 49, 52]],
  mel: [[[0, 62, 6], [8, 69, 4], [12, 65, 4]], [[0, 65, 6], [8, 70, 8]], [[0, 69, 6], [8, 72, 4], [12, 69, 4]], [[0, 67, 12], [12, 64, 4]],
        [[0, 67, 4], [4, 70, 4], [8, 74, 8]], [[0, 77, 6], [8, 74, 8]], [[0, 76, 12], [12, 74, 4]], [[0, 73, 16]]],
};
function seqStop() { if (Seq.timer) clearInterval(Seq.timer); Seq.timer = null; Seq.mode = null; }
function seqStart(mode, tier = 1) {
  if (!A.ctx) return; seqStop(); Seq.mode = mode; Seq.tier = tier; Seq.step = 0; Seq.next = A.ctx.currentTime + .08;
  A.mus.gain.cancelScheduledValues(A.ctx.currentTime); A.mus.gain.setTargetAtTime(mode === "title" ? .8 : .9, A.ctx.currentTime, .05);
  Seq.timer = setInterval(() => { while (Seq.next < A.ctx.currentTime + .18) { const sd = playStep(Seq.step, Seq.next); Seq.next += sd; Seq.step++; } }, 40);
}
function playStep(s, t) {
  if (Seq.mode === "title") {
    const sd = 60 / 100 / 4, bar = Math.floor(s / 16) % 8, st = s % 16, ch = TITLE.chords[bar];
    if (st === 0) { ch.forEach(m => pad(m + 12, t, sd * 16.5, .028)); timp(ch[0] - 12, t, .34); bassN(ch[0] - 12, t, sd * 7); }
    if (st === 8) bassN(ch[0] - 12, t, sd * 7, .13);
    if (st % 8 === 0) kick(t, .4); if (st % 8 === 4) snare(t, .07); if (st % 2 === 1) hat(t, .018);
    TITLE.mel[bar].forEach(([p, m, d]) => { if (p === st) { brass(m, t, sd * d * .96, .085); brass(m - 12, t, sd * d * .96, .05); } });
    return sd;
  }
  // tension bed: slower and lower at the bottom of the ladder, tighter and higher at the top
  const tier = Seq.tier, bpm = [0, 74, 82, 90, 100][tier], sd = 60 / bpm / 4, bar = Math.floor(s / 16) % 4, st = s % 16;
  const root = 37 + tier, ch = PROG[bar].map(i => root + i);
  if (st === 0) { ch.forEach(m => pad(m + 24, t, sd * 16.4, .03)); tone({ f: mtof(ch[0] - 12), t, dur: sd * 16, g: .12, type: "sine", a: .3, r: 1, bus: A.mus }); }
  if (st % 8 === 0) kick(t, .46); if (st % 8 === 3) kick(t, .27);                      // heartbeat: lub-dub
  if (tier >= 2 && [2, 6, 10, 14].includes(st)) pluck(ch[(st >> 1) % 3] + 36, t, .04);
  if (tier >= 3 && st % 2 === 0) tone({ f: mtof(ch[0]), t, dur: sd * 1.6, g: .09, type: "triangle", a: .005, r: sd, bus: A.mus });
  if (tier >= 3 && st % 4 === 2) hat(t, .022);
  if (tier >= 4) { hat(t, st % 2 ? .012 : .02); if (st % 4 === 0) tone({ f: mtof(ch[2] + 36), t, dur: sd * 3.5, g: .012, type: "sawtooth", a: .05, r: .2, lp: 2600, bus: A.mus, wet: .9 }); }
  return sd;
}

/* ---------- show cues ---------- */
function cueLock(dur, tier) {            // lights down: drone, accelerating heartbeat, riser
  if (!A.ctx) return; seqStop(); const t = now(), root = 37 + tier;
  [root, root + 7, root + 13, root + 24].forEach((m, i) => tone({ f: mtof(m), t, dur, g: i === 3 ? .012 : .05, type: i < 2 ? "sawtooth" : "triangle", a: dur * .7, r: .08, lp: 700, lp2: 1800, bus: A.mus, wet: .6 }));
  tone({ f: mtof(root - 12), t, dur, g: .16, type: "sine", a: .2, r: .08, bus: A.mus });
  let bt = .15, gap = .95; while (bt < dur - .25) { kick(t + bt, .5); kick(t + bt + gap * .28, .3); bt += gap; gap = Math.max(.36, gap * .86); }
  nz({ t: t + Math.max(0, dur - 1.6), dur: 1.6, g: .09, type: "bandpass", freq: 300, f2: 5000, q: 1.5, a: 1.5, r: .05, bus: A.mus, wet: .4 });
}
function crowdCheer(t, dur, g = .16) {
  nz({ t, dur, g, type: "bandpass", freq: 900, f2: 1500, q: .5, a: dur * .15, r: dur * .6, wet: .5 });
  nz({ t, dur: dur * .8, g: g * .5, type: "bandpass", freq: 2600, q: .7, a: dur * .2, r: dur * .5, wet: .5 });
  const n = Math.floor(dur * 55); for (let i = 0; i < n; i++) { const tt = t + Math.random() * dur, k = 1 - (tt - t) / dur; nz({ t: tt, dur: .02, g: g * .55 * k, type: "highpass", freq: 1800 + Math.random() * 2500, a: .001, r: .015 }); }
}
function crowdOhh(t) { nz({ t, dur: 1.8, g: .14, type: "bandpass", freq: 750, f2: 280, q: 1.2, a: .12, r: 1.4, wet: .5 }); }
function crowdMurmur(t, dur) { nz({ t, dur, g: .05, type: "bandpass", freq: 500, q: .4, a: .4, r: .6, wet: .3 }); }
function cueCorrect(level) {             // 0-11
  if (!A.ctx) return; seqStop(); const t = now() + .02, r = 62 + Math.min(4, Math.floor(level / 3));
  [0, 4, 7, 12].forEach((iv, i) => brass(r + iv, t + i * .09, .5, .08, A.out));
  [0, 4, 7, 12, 16].forEach(iv => brass(r + iv, t + .42, 1.1, .06, A.out)); timp(r - 24, t + .42, .35, A.out);
  crowdCheer(t + .1, 1.6 + level * .12, .1 + level * .008);

function cueSafe() {                     // banked level: bigger fanfare
  if (!A.ctx) return; const t = now() + .02;
  [[62, 0], [66, .16], [69, .32], [74, .48], [78, .7]].forEach(([m, d]) => brass(m, t + d, .34, .09, A.out));
  [50, 62, 66, 69, 74, 81].forEach(m => brass(m, t + 1.0, 1.8, .06, A.out)); timp(38, t + 1.0, .45, A.out); timp(38, t + 1.3, .3, A.out);
  crowdCheer(t, 3.4, .2);
}
function cueWrong() {
  if (!A.ctx) return; seqStop(); const t = now() + .02;
  tone({ f: 70, f2: 28, t, dur: 1.6, g: .5, type: "sine", a: .004, r: 1.4, wet: .5 }); nz({ t, dur: .5, g: .2, type: "lowpass", freq: 300, r: .45 });
  [58, 52, 51].forEach((m, i) => brass(m, t + .05 + i * .28, 1.3 - i * .2, .09, A.out)); crowdOhh(t + .1);
}
function cueWin() {
  if (!A.ctx) return; seqStop(); const t = now() + .05;
  const mel = [[62, 0, .3], [62, .3, .15], [66, .45, .3], [69, .75, .3], [74, 1.05, .6], [73, 1.65, .2], [74, 1.85, .25], [76, 2.1, .25], [78, 2.35, 1.6]];
  mel.forEach(([m, d, l]) => { brass(m, t + d, l, .1, A.out); brass(m + 12, t + d, l, .05, A.out); });
  [[50, 54, 57], [55, 59, 62], [57, 61, 64], [50, 54, 57, 62]].forEach((ch, i) => ch.forEach(m => pad(m + 12, t + [0, 1.05, 1.65, 2.35][i], [1.05, .6, .7, 3][i], .04, A.out)));
  [0, 1.05, 1.65, 2.35, 2.6, 2.85].forEach((d, i) => timp(i === 1 ? 31 : i === 2 ? 33 : 38, t + d, .4, A.out));
  for (let i = 0; i < 14; i++) pluck(74 + [0, 4, 7, 12, 16][i % 5], t + 2.4 + i * .11, .05, A.out);

}
function cueIntro() {                    // short opening hit before the theme loop
  if (!A.ctx) return; const t = now() + .02;
  nz({ t, dur: 1.1, g: .1, type: "bandpass", freq: 200, f2: 6000, q: 1.2, a: 1.0, r: .05, wet: .5 });
  [38, 50, 57, 62, 65, 69].forEach(m => brass(m, t + 1.1, 1.3, .07, A.out)); timp(26, t + 1.1, .5, A.out); crowdCheer(t + 1.0, 3, .16);
}
/* ---------- ui + lifelines ---------- */
const sfx = {
  blip: () => tone({ f: 880, dur: .06, g: .06, type: "triangle" }),
  appear: i => tone({ f: 520 + i * 90, dur: .09, g: .06, type: "triangle", wet: .4 }),
  pvw: () => { tone({ f: 660, dur: .08, g: .08, type: "square", lp: 2400 }); tone({ f: 990, t: now() + .07, dur: .12, g: .07, type: "square", lp: 2400 }); },
  take: () => { tone({ f: 140, f2: 60, dur: .5, g: .4, type: "sine", wet: .4 }); nz({ dur: .25, g: .12, type: "highpass", freq: 3000, r: .2 }); },
  back: () => tone({ f: 420, f2: 300, dur: .1, g: .05, type: "triangle" }),
  zap: () => { nz({ dur: .35, g: .16, type: "bandpass", freq: 5000, f2: 300, q: 2, r: .2 }); tone({ f: 1400, f2: 90, dur: .35, g: .1, type: "sawtooth", lp: 3000 }); },
  poll: k => tone({ f: 300 + k * 26, dur: .05, g: .05, type: "square", lp: 2000 }),
  pollDone: () => [72, 76, 79].forEach((m, i) => tone({ f: mtof(m), t: now() + i * .07, dur: .25, g: .07, type: "triangle", wet: .5 })),
  ring: t => { [440, 480].forEach(f => tone({ f, t, dur: 1.0, g: .05, type: "sine", a: .02, r: .05 })); },
  pickup: () => { nz({ dur: .06, g: .1, type: "highpass", freq: 2500 }); tone({ f: 620, t: now() + .05, dur: .1, g: .05, type: "sine" }); },
  tick: last => tone({ f: last ? 1400 : 1000, dur: .04, g: last ? .08 : .045, type: "square", lp: 3000 }),
  hang: () => [480, 380].forEach((f, i) => tone({ f, t: now() + i * .16, dur: .14, g: .06, type: "sine" })),
  murmur: d => crowdMurmur(now(), d),

function duck(on) { if (A.ctx) A.mus.gain.setTargetAtTime(on ? .3 : .9, now(), .2); }

/* ---------- host voice (optional, uses the browser's built-in speech) ---------- */
let voiceOn = false;
function say(text) {
  if (!voiceOn || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1; u.pitch = .9; u.volume = 1; speechSynthesis.speak(u); } catch (e) {}
}
function hush() { try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {} }

  host("Phone the team. Who do you want on the line?");
  veil(`<div class="card"><span class="eyebrow">Phone the team</span><h2>Who are you calling?</h2><p>You get one call and 30 seconds. Pick a teammate.</p>
    <div class="team">${TEAM.map((m, n) => `<button class="mate" data-n="${n}"><span class="av" style="background:${m.col}">${m.name[0]}</span><b>${m.name}</b></button>`).join("")}</div>
    <div class="row"><button class="big ghost" id="noCall">SAVE IT FOR LATER</button></div></div>`);
  el.veil.querySelectorAll(".mate").forEach(b => (b.onclick = () => guard(callMate(TEAM[+b.dataset.n])))); $("noCall").onclick = () => { veil(""); duck(false); host("Saved. The phone is still yours."); };
}
async function callMate(m) {
  const run = G.run, q = G.cur; G.used.phone = true; renderLifelines();
  const live = [0, 1, 2, 3].filter(k => !G.dead.includes(k));
  let p = (m.strong.includes(q.c) ? .93 : .8) - (q.t === 4 ? .1 : q.t === 3 ? .04 : 0); if (live.length === 2) p += .05;
  const knows = Math.random() < p, guess = knows ? G.correct : pick(live.filter(k => k !== G.correct)), conf = knows ? (p > .85 ? 2 : 1) : (Math.random() < .5 ? 1 : 0);
  veil(`<div class="card"><span class="eyebrow">Phone the team</span><h2 id="callHead">Calling ${m.name}…</h2>
    <div class="call"><div class="clock"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="#1a2148" stroke-width="8"/><circle id="ring" cx="48" cy="48" r="42" fill="none" stroke="${m.col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="0"/></svg><span class="num" id="secs">30</span></div>
    <div class="chat" id="chat"><div class="ln sys">Ringing…</div></div></div>
    <div class="row"><button class="big go" id="hang" disabled>HANG UP</button></div></div>`);
  const chat = $("chat"), line = (who, text, cls = "") => { chat.insertAdjacentHTML("beforeend", `<div class="ln ${cls}">${who ? `<b>${who}</b>` : ""}${esc(text)}</div>`); chat.lastElementChild.scrollIntoView({ block: "nearest" }); };
  let iv = null; const finish = () => { if (iv) clearInterval(iv); veil(""); duck(false); };
  await guard((async () => {
    sfx.ring(now()); await wait(1700, run); sfx.ring(now()); await wait(1500, run); sfx.pickup();
    $("callHead").textContent = `${m.name} is on the line`; chat.innerHTML = ""; line(m.name, m.hello);
    let secs = 30; iv = setInterval(() => { if (run !== G.run) return clearInterval(iv); secs--; $("secs") && ($("secs").textContent = Math.max(0, secs)); $("ring") && $("ring").setAttribute("stroke-dashoffset", String(264 * (1 - secs / 30))); sfx.tick(secs <= 5); if (secs <= 0) { clearInterval(iv); sfx.hang(); line("", "Time's up. The line went dead.", "sys"); } }, 1000);
    await wait(1900, run); line("Host", `${q.q} Your choices: ${live.map(k => `${LET[k]}) ${G.opts[k]}`).join(", or ")}.`, "host");
    await wait(4200, run); line(m.name, pick(["Hmm. Give me a second.", "Okay. I have pressed this a thousand times.", "Right. Let me picture the keyboard.", "Good one. Thinking."]));
    await wait(3800, run);
    const ans = `answer ${LET[guess]} (${G.opts[guess]})`;
    line(m.name, conf === 2 ? `It's ${ans}. I would bet my per diem on it.` : conf === 1 ? `I'm pretty sure it's ${ans}. Call it 80 percent.` : `Honestly? I would lean ${ans}, but don't take that to air on my word alone.`);
    host(`${m.name} says ${LET[guess]}. ${conf === 2 ? "That sounded confident." : conf === 1 ? "Fairly sure, by the sound of it." : "Not exactly a guarantee."}`);
    const b = $("hang"); b.disabled = false; b.focus(); b.onclick = () => { sfx.hang(); finish(); };
  })());
  if (run !== G.run && iv) clearInterval(iv);
}

/* ---------- input ---------- */
el.ans.forEach((b, k) => b.addEventListener("click", () => select(k)));
el.fifty.onclick = useFifty; el.crowd.onclick = () => guard(useCrowd()); el.phone.onclick = usePhone; el.walk.onclick = walkAsk;
el.snd.onclick = () => { initAudio(); const on = el.snd.getAttribute("aria-pressed") !== "true"; el.snd.setAttribute("aria-pressed", String(on)); setSound(on); };
el.voice.onclick = () => { voiceOn = !voiceOn; el.voice.setAttribute("aria-pressed", String(voiceOn)); if (!voiceOn) hush(); else if (!("speechSynthesis" in window)) { voiceOn = false; el.voice.setAttribute("aria-pressed", "false"); el.voice.textContent = "NO VOICE HERE"; el.voice.disabled = true; } else say("Host voice on."); };
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;       // let focused buttons handle their own keys
  if (!el.veil.hidden) { if (e.key === "Escape") { const s = $("stay") || $("noCall") || ($("pollOk") && !$("pollOk").disabled && $("pollOk")) || ($("hang") && !$("hang").disabled && $("hang")); if (s) s.click(); } return; }
  const k = "abcd".indexOf(e.key.toLowerCase()), n = "1234".indexOf(e.key);
  if (k >= 0 || n >= 0) select(k >= 0 ? k : n);
  else if (e.key === "Enter") { if (G.phase === "confirm") guard(take()); else if (G.phase === "after") guard(next()); }
  else if (e.key === "Escape") unselect();
});
document.addEventListener("visibilitychange", () => { if (A.ctx) { if (document.hidden) A.ctx.suspend(); else A.ctx.resume(); } });

fxInit(); showTitle();

</script>
