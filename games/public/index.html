<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/lm-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LM Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('lmmon-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="/lm-ui.css">
<script src="/lm-ui.js" data-suffix="Games"></script>
<style>
:root{ --panel:var(--rail-bg); --card:var(--surface); --text:var(--ink); --muted:var(--ink-soft); }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100% - var(--bar-h))}
nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 0}
nav h3{font:600 10px var(--mono);letter-spacing:.12em;color:var(--muted);margin:8px 14px}
nav button,nav a{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:600 13px var(--sans);text-align:left;text-decoration:none;cursor:pointer}
nav button.on{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
nav .n{margin-left:auto;font:11px var(--mono);color:var(--muted)}
nav a{font-weight:400;font-size:12.5px}
nav h3.sp{margin-top:24px}
main{padding:28px 32px;max-width:1500px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{margin:0;font-size:22px}
.count{color:var(--muted);font-size:12px}
.search{margin-left:auto;width:min(320px,100%);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:13px var(--sans)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-height:210px}
.head{display:flex;gap:12px;align-items:center}
.ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ico svg{width:20px;height:20px}
.name{font-weight:600;font-size:15px}
.cat{font:11px var(--mono);color:var(--muted);letter-spacing:.06em}
.desc{color:var(--muted);font-size:13px;margin:12px 0 12px;flex:1}
.lb{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:2px}
.lb li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;font-size:12.5px;padding:3px 8px;border-radius:4px;background:var(--bg)}
.lb li.you{box-shadow:inset 3px 0 var(--accent)}
.lb .r,.lb .s{font:600 11.5px var(--mono)}
.lb .r{color:var(--muted)}
.lb-h{font:600 10px var(--mono);letter-spacing:.12em;color:var(--muted);margin:0 0 6px}
.lb-empty{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.vd{display:flex;flex-direction:column;line-height:1.3;white-space:nowrap}
.ver{font:600 12px var(--mono)}
.date{font-size:12px;color:var(--muted)}
.open{margin-left:auto;background:var(--save);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:12.5px;padding:6px 14px;border-radius:999px;white-space:nowrap}
.open:hover{background:var(--save-hover)}
.empty{color:var(--muted);padding:40px 0}
@media (max-width:760px){.layout{grid-template-columns:1fr}nav{display:none}main{padding:20px 16px}}
</style>
</head>
<body>
<div class="layout">
  <nav>
    <h3>GAMES</h3>
    <div id="cats"></div>
    <h3 class="sp">YOUR BEST</h3>
    <div id="bests"></div>
    <h3 class="sp">LIVE MEDIA</h3>
    <a id="portal" href="https://lm-portal.woorhyce.workers.dev/">Tool Library</a>
  </nav>
  <main>
    <div class="top">
      <h1 id="title">All games</h1>
      <span class="count" id="count"></span>
      <input class="search" id="q" type="search" placeholder="Search games" aria-label="Search games">
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const ICONS = {
  panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h4M7 12h4M14 9v7"/><circle cx="16.5" cy="15" r="2.5"/>',
  cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v6"/>',
  bricks:'<rect x="3" y="4" width="8" height="4" rx="1"/><rect x="13" y="4" width="8" height="4" rx="1"/><rect x="3" y="10" width="8" height="4" rx="1"/><path d="M8 20h8"/><circle cx="16" cy="15.5" r="1.5"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',
};
const GAMES = [
  { slug:'replay-op', href:'replay-op.html', key:'rop-hi', unit:'pts', name:'Replay Op', cat:'Simulator', icon:'panel',
    desc:'Run a replay channel on a virtual RCP-10 inside VUE with real DreamCatcher keyboard shortcuts, while the producer calls replays and the server throws real faults at you.' },
  { slug:'academy', href:'academy.html', key:'dcra-hi', unit:'pts', name:'DreamCatcher Replay Academy', cat:'Training', icon:'cap',
    desc:'Arcade quiz in seven stages, from Power Up to Troubleshoot. Steer your camera under the right answer before the gate arrives.' },
  { slug:'input-breaker', href:'input-breaker.html', key:'ib-hi', unit:'pts', name:'Input Breaker', cat:'Arcade', icon:'bricks',
    desc:'The multiview is full. Bounce the ball off your T-bar and break every input out. Tally-lit inputs take more hits.' },
  { slug:'million-frame', href:'million-frame-replay.html', key:'mfr-best', unit:'frames', name:'Million Frame Replay', cat:'Quiz', icon:'mic',
    desc:'The DreamCatcher operator quiz show. Use your lifelines, climb the ladder and walk off with as many frames as you dare.' },
];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const fmt = n => Number(n).toLocaleString();
const best = g => { try { return +localStorage.getItem(g.key) || 0; } catch (e) { return 0; } };
const boards = {};
let cat = 'All games', q = '';

function render(){
  const cats = {'All games': GAMES.length};
  GAMES.forEach(g => cats[g.cat] = (cats[g.cat] || 0) + 1);
  $('cats').innerHTML = Object.entries(cats).map(([c,n]) => `<button class="${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${n}</span></button>`).join('');
  $('bests').innerHTML = GAMES.map(g => `<a href="${esc(g.href)}">${esc(g.name)}<span class="n">${best(g) ? fmt(best(g)) : '–'}</span></a>`).join('');
  const list = GAMES.filter(g => (cat === 'All games' || g.cat === cat) && (!q || (g.name + ' ' + g.desc + ' ' + g.cat).toLowerCase().includes(q)));
  $('title').textContent = cat;
  $('count').textContent = `${list.length} game${list.length === 1 ? '' : 's'}`;
  $('grid').innerHTML = list.length ? list.map(g => {
    const b = best(g), rows = boards[g.slug];
    const lb = rows === undefined ? '' : rows.length
      ? `<p class="lb-h">TEAM TOP 3</p><ol class="lb">${rows.slice(0,3).map(r => `<li class="${r.you?'you':''}"><span class="r">${r.rank}</span><span>${esc(r.name)}</span><span class="s">${fmt(r.score)}</span></li>`).join('')}</ol>`
      : '<p class="lb-empty">No team scores yet. Be the first.</p>';
    return `<article class="card">
      <div class="head"><div class="ico">${svg(g.icon)}</div>
        <div><div class="name">${esc(g.name)}</div><div class="cat">${esc(g.cat.toUpperCase())}</div></div></div>
      <p class="desc">${esc(g.desc)}</p>
      ${lb}
      <div class="foot"><div class="vd"><span class="ver">${b ? fmt(b) + ' ' + g.unit : 'No score yet'}</span><span class="date">Your best</span></div>
        <a class="open" href="${esc(g.href)}">Play</a></div>
    </article>`; }).join('') : `<p class="empty">No games match “${esc(q)}”. Clear the search or pick another category.</p>`;
}
$('cats').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ cat = b.dataset.cat; render(); } });
$('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
render();

if (/^https?:$/.test(location.protocol)) {
  fetch('/api/me').then(r => r.ok ? r.json() : {}).then(u => { if (u.portal) $('portal').href = u.portal; }).catch(() => {});
  GAMES.forEach(g => fetch('/api/leaderboard?key=' + encodeURIComponent(g.key), {cache:'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d && d.rows){ boards[g.slug] = d.rows; render(); } })
    .catch(() => {}));
  addEventListener('storage', render);
  setTimeout(render, 1500); // lm-sync finishes pulling saved scores
}
})();
</script>
</body>
</html>
