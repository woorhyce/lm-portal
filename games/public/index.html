<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/lm-sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LM Games</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel-2:#f4f6fa; --ink:#18202c; --muted:#5a6578; --line:#d5dbe5;
  --tally:#d8342a; --green:#2f9e4a; --amber:#c98612;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --panel:#1b2230; --panel-2:#222b3c; --ink:#e8ecf3; --muted:#97a2b6; --line:#2e3a50;
    --tally:#ff4f43; --green:#49d06a; --amber:#f2ad35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --panel:#1b2230; --panel-2:#222b3c; --ink:#e8ecf3; --muted:#97a2b6; --line:#2e3a50;
  --tally:#ff4f43; --green:#49d06a; --amber:#f2ad35;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:32px 20px 72px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{margin:0;font-size:30px;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted)}
.who{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
.art{height:120px;position:relative;display:grid;place-items:center;overflow:hidden}
.art .tag{position:absolute;left:12px;top:10px;font:700 11px/1 system-ui,sans-serif;letter-spacing:.06em;padding:4px 7px;border-radius:4px;background:rgba(0,0,0,.45);color:#fff}
.art .tally{position:absolute;right:12px;top:12px;width:10px;height:10px;border-radius:50%;background:#ff4f43;box-shadow:0 0 8px #ff4f43}
.body{padding:14px 16px 6px;display:grid;gap:6px;align-content:start}
.body h2{margin:0;font-size:19px}
.body p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:18px;margin-top:6px;font-size:13px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.lb{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px}
.lb li{display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:3px 6px;border-radius:4px;background:var(--panel-2)}
.lb li.you{outline:1px solid var(--green)}
.lb .r{color:var(--muted)}
.lb .s{font-variant-numeric:tabular-nums;font-weight:600}
.lb-empty{color:var(--muted);font-size:13px;margin:8px 0 0}
.foot{padding:12px 16px 16px}
.play{display:block;text-align:center;text-decoration:none;background:var(--tally);color:#fff;font-weight:700;padding:10px 14px;border-radius:7px}
.play:hover{filter:brightness(1.08)}
.play:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* card art */
.a-rop{background:linear-gradient(160deg,#4f5e88,#262e45)}
.a-dcra{background:linear-gradient(160deg,#1f2a44,#0d1220)}
.a-ib{background:#0b0f18}
.a-mfr{background:radial-gradient(circle at 50% 120%,#3a2a8a,#0c0a26 70%);padding-right:60px}
.t-title{font:800 26px/1 system-ui,sans-serif;letter-spacing:.02em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);text-align:center}
.t-title small{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;opacity:.8;margin-top:6px}
.bricks{position:absolute;inset:38px 16px auto;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.bricks i{height:10px;border-radius:2px;background:#2b3a5c}
.bricks i:nth-child(3n){background:#c8342a}
.bricks i:nth-child(5n){background:#3d8b4f}
.ib-ball{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:58%;top:62%}
.ib-pad{position:absolute;width:70px;height:8px;border-radius:4px;background:#cfd3d8;left:50%;bottom:12px;transform:translateX(-50%)}
.ladder{position:absolute;right:14px;top:16px;bottom:16px;display:grid;gap:3px;align-content:center}
.ladder i{width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.ladder i:first-child{background:#f2ad35}
.note{margin-top:28px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>LM Games</h1>
      <p>Learn DreamCatcher the fun way. Your best scores follow you to any computer you log in from.</p>
    </div>
    <span class="who" id="who"></span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">Every game has an LM Games button in the bottom-left corner to get back here.</p>
</main>
<script>
(() => {
const GAMES = [
  { slug:'replay-op', href:'replay-op.html', key:'rop-hi', unit:'pts', title:'Replay Op', tag:'SIMULATOR',
    desc:'Run replays on a virtual RCP-10 inside VUE while the producer yells and the server throws real faults at you.',
    art:'<div class="t-title">REPLAY OP<small>RCP-10 + VUE</small></div><span class="tally"></span>', cls:'a-rop' },
  { slug:'academy', href:'academy.html', key:'dcra-hi', unit:'pts', title:'DreamCatcher Replay Academy', tag:'TRAINING',
    desc:'Arcade quiz in seven stages, from Power Up to Troubleshoot. Steer your camera under the right answer.',
    art:'<div class="t-title">REPLAY ACADEMY<small>7 STAGES</small></div>', cls:'a-dcra' },
  { slug:'input-breaker', href:'input-breaker.html', key:'ib-hi', unit:'pts', title:'Input Breaker', tag:'ARCADE',
    desc:'The multiview is full. Bounce the ball off your T-bar and break every input out. Tally-lit inputs take more hits.',
    art:'<div class="bricks">' + '<i></i>'.repeat(24) + '</div><span class="ib-ball"></span><span class="ib-pad"></span>', cls:'a-ib' },
  { slug:'million-frame', href:'million-frame-replay.html', key:'mfr-best', unit:'frames', title:'Million Frame Replay', tag:'QUIZ SHOW',
    desc:'The DreamCatcher operator quiz show. Use your lifelines, climb the ladder and walk off with as many frames as you dare.',
    art:'<div class="t-title">MILLION<br>FRAME REPLAY</div><div class="ladder">' + '<i></i>'.repeat(8) + '</div>', cls:'a-mfr' },
];
const fmt = n => Number(n).toLocaleString();
const grid = document.getElementById('grid');
for (const g of GAMES) {
  let mine = 0; try { mine = +localStorage.getItem(g.key) || 0; } catch (e) {}
  const c = document.createElement('article');
  c.className = 'card';
  c.innerHTML = `
    <div class="art ${g.cls}" aria-hidden="true"><span class="tag">${g.tag}</span>${g.art}</div>
    <div class="body">
      <h2></h2><p></p>
      <div class="stats"><span>Your best<b>${mine ? fmt(mine) + ' ' + g.unit : 'None yet'}</b></span></div>
      <div class="lbw" id="lb-${g.slug}"></div>
    </div>
    <div class="foot"><a class="play" href="${g.href}">Play</a></div>`;
  c.querySelector('h2').textContent = g.title;
  c.querySelector('p').textContent = g.desc;
  grid.appendChild(c);
}
if (/^https?:$/.test(location.protocol)) {
  fetch('/api/me').then(r => r.ok ? r.json() : {}).then(u => { if (u.email) document.getElementById('who').textContent = 'Signed in as ' + u.email; }).catch(() => {});
  for (const g of GAMES) {
    fetch('/api/leaderboard?key=' + encodeURIComponent(g.key), { cache:'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        const box = document.getElementById('lb-' + g.slug);
        if (!d || !d.rows) return;
        if (!d.rows.length) { box.innerHTML = '<p class="lb-empty">No team scores yet. Be the first.</p>'; return; }
        const ol = document.createElement('ol'); ol.className = 'lb';
        for (const r of d.rows.slice(0, 3)) {
          const li = document.createElement('li'); if (r.you) li.className = 'you';
          li.innerHTML = '<span class="r"></span><span class="n"></span><span class="s"></span>';
          li.children[0].textContent = r.rank; li.children[1].textContent = r.name; li.children[2].textContent = fmt(r.score);
          ol.appendChild(li);
        }
        box.appendChild(ol);
      }).catch(() => {});
  }
}
})();
</script>
</body>
</html>
