name = "lm-portal"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Where each tool lives. {slug} is replaced with the tool slug.
TOOL_URL = "https://{slug}.evertz.app/"

[[d1_databases]]
binding = "DB"
database_name = "lm-db"
database_id = "04b131fe-c2aa-4a9a-9d63-8ae0459fff1e"

[[routes]]
pattern = "evertz.app"
custom_domain = true

# Customer log uploads (written by lm-logs, read here behind Access)
[[r2_buckets]]
binding = "LOGS"
bucket_name = "lm-logs"

# Manuals & release notes for the customer support site
[[r2_buckets]]
binding = "DOCS"
bucket_name = "lm-docs"
