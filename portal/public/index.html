<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Media Tool Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('lmmon-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="/lm-ui.css">
<script src="/lm-ui.js"></script>
<style>
:root{
  --panel:var(--rail-bg); --card:var(--surface); --text:var(--ink); --muted:var(--ink-soft);
  --warn-bg:var(--caution-soft); --warn:var(--caution-ink); --local-bg:var(--good-soft); --local:var(--good-txt);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
.identity-bar .who{margin-left:auto;font:600 .7rem var(--mono);letter-spacing:.06em;color:rgba(255,255,255,.72);background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:6px}
.identity-bar .who:hover{color:#fff;background:rgba(255,255,255,.08)}
.rma-quick{display:flex;gap:8px;flex-wrap:wrap}
.rma-quick button{background:var(--surface);border:1px solid var(--line);color:var(--ink);font:600 12px var(--sans);padding:6px 12px;border-radius:99px;cursor:pointer}
.rma-quick button:hover{border-color:var(--ink-soft)}
td.asg{color:var(--ink-soft);white-space:nowrap}
td.asg.me{color:var(--accent-ink);font-weight:600}
.identity-bar .who + .theme-switch{margin-left:18px}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.who{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100% - var(--bar-h))}
nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 0}
nav h3{font:600 10px var(--mono);letter-spacing:.12em;color:var(--muted);margin:8px 14px}
nav button,nav a{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:600 13px var(--sans);text-align:left;text-decoration:none;cursor:pointer}
nav button.on{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
nav .n{margin-left:auto;font:11px var(--mono);color:var(--muted)}
nav a{font-weight:400;font-size:12.5px}
nav h3.recent{margin-top:24px}
main{padding:28px 32px;max-width:1500px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{margin:0;font-size:22px}
.count{color:var(--muted);font-size:12px}
.search{margin-left:auto;width:min(320px,100%);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:13px var(--sans)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-height:210px}
.head{display:flex;gap:12px;align-items:center}
.ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ico svg{width:20px;height:20px}
.name{font-weight:600;font-size:15px}
.cat{font:11px var(--mono);color:var(--muted);letter-spacing:.06em}
.tags{display:flex;gap:6px;margin-top:12px}
.tag{font:600 10px var(--mono);padding:2px 7px;border-radius:4px;letter-spacing:.05em}
.tag.file{background:var(--warn-bg);color:var(--warn)}
.tag.local{background:var(--local-bg);color:var(--local)}
.desc{color:var(--muted);font-size:13px;margin:12px 0 14px;flex:1}
.foot{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.ver{font:600 12px var(--mono)}
.date{font-size:12px;color:var(--muted)}
.open{margin-left:auto;background:var(--save);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:12.5px;padding:6px 14px;border-radius:999px}
.dls{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.dl{display:inline-flex;align-items:center;gap:6px;background:var(--save);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:12.5px;padding:6px 13px;border-radius:999px}
.dl svg{width:14px;height:14px}
.vd{display:flex;flex-direction:column;line-height:1.3;white-space:nowrap}
.open,.notes-btn{white-space:nowrap}
.notes-btn{background:none;border:1px solid var(--line);color:var(--muted);font:600 12px var(--sans);padding:5px 11px;border-radius:999px;cursor:pointer}
.notes-btn .nb-date{margin-left:6px;padding-left:7px;border-left:1px solid var(--line);font:600 11px var(--mono);color:var(--ink-soft)}
.notes-btn:hover{color:var(--text);border-color:var(--muted)}
dialog{width:min(560px,92vw);max-height:80vh;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(5,8,14,.6)}
.dlg-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dlg-head h2{margin:0;font-size:16px}
.dlg-head .cat{margin-left:2px}
.close{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}
.rel{padding:16px 20px;border-bottom:1px solid var(--line)}
.rel:last-child{border-bottom:0}
.rel-top{display:flex;align-items:baseline;gap:10px}
.rel-ver{font:600 13px var(--mono)}
.rel-date{font-size:12px;color:var(--muted)}
.rel-latest{font:600 10px var(--mono);color:var(--accent);margin-left:auto}
.rel ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.rel p{margin:8px 0 0;color:var(--muted);font-size:13px}
dialog.wide{width:min(820px,94vw)}
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:73px;background:var(--panel);z-index:1}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 13px var(--sans);padding:10px 4px;margin-right:14px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.guide{padding:18px 24px 28px;font-size:14px;line-height:1.6;max-width:72ch}
.guide h1{font-size:20px;margin:4px 0 12px}.guide h2{font-size:16px;margin:24px 0 8px}.guide h3{font-size:14px;margin:18px 0 6px}
.guide p,.guide li{color:var(--text)}.guide ul,.guide ol{padding-left:20px}
.guide code{font:12.5px var(--mono);background:rgba(122,167,239,.12);padding:1px 5px;border-radius:4px}
.guide pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto}
.guide pre code{background:none;padding:0}
.guide table{border-collapse:collapse;display:block;overflow-x:auto}.guide th,.guide td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.guide blockquote{margin:0;padding:4px 14px;border-left:3px solid var(--accent);color:var(--muted)}
.guide a{color:var(--accent)}.guide img{max-width:100%}
nav .n.hot{background:var(--err);color:#fff;border-radius:99px;padding:0 7px;font-weight:600}
.rma-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rma-filters button{background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);font:600 12px var(--sans);padding:5px 12px;border-radius:99px;cursor:pointer}
.rma-filters button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.rma-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.rma{width:100%;border-collapse:collapse;font-size:13px}
table.rma th{text-align:left;font:600 .62rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);background:var(--rail-bg);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rma td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.rma tbody tr{cursor:pointer} table.rma tbody tr:hover{background:var(--accent-soft)}
table.rma .ref{font:600 12px var(--mono);white-space:nowrap}
.flag{display:inline-block;font:600 10px var(--mono);letter-spacing:.05em;padding:1px 6px;border-radius:4px;margin-left:6px;background:var(--warn-soft);color:var(--err)}
.flag.loan{background:var(--caution-soft);color:var(--caution-ink)} .flag.due{background:var(--accent-soft);color:var(--accent-ink)}
.st{display:inline-block;font:600 11px var(--sans);padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--rail-bg);color:var(--ink-soft)}
.st.New{background:var(--accent-soft);color:var(--accent-ink)} .st.Shipped{background:var(--good-soft);color:var(--good-txt)}
.st.Waiting{background:var(--caution-soft);color:var(--caution-ink)}
.rma-public{font-size:12px;color:var(--ink-soft);margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rma-public a{color:var(--accent-ink);font-family:var(--mono)}
.rma-detail{padding:16px 20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.rma-detail .full{grid-column:1/-1}
.rma-detail h4{margin:0 0 4px;font:600 .62rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.rma-detail p{margin:0;white-space:pre-wrap;line-height:1.45}
.rma-detail .unit{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:8px}
.rma-detail select,.rma-detail input,.rma-detail textarea{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px var(--sans)}
.rma-detail textarea{min-height:80px;resize:vertical}
.rma-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rma-actions .saved{font-size:12px;color:var(--good-txt)}
@media (max-width:640px){.rma-detail{grid-template-columns:1fr}}
.empty{color:var(--muted);padding:40px 0}
.banner{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:6px 20px}
@media (max-width:760px){.layout{grid-template-columns:1fr}nav{display:none}main{padding:20px 16px}.who{display:none}}
</style>
<script src="/vendor/marked-12.0.2.min.js"></script>
<script src="/vendor/purify-3.1.6.min.js"></script>
</head>
<body>
<div id="banner" class="banner" hidden>Showing sample data. The tools API isn’t reachable from this page.</div>
<header class="identity-bar" id="identityBar">
  <div class="identity-brand"><svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181.40 20" role="img" aria-label="Live Media"><g transform="translate(7,5)" fill="none" stroke-width="1.45" stroke-linecap="square" stroke-linejoin="round"><path d="M0,0 V7.4 Q0,10 2.6,10 H17" transform="translate(0.00,0)" stroke="#ffffff"/><path d="M0,0 V10" transform="translate(21.60,0)" stroke="#ffffff"/><path d="M0,0 L8.5,10 L17,0" transform="translate(26.20,0)" stroke="#ffffff"/><path d="M17,0 H2.6 Q0,0 0,2.6 V7.4 Q0,10 2.6,10 H17" transform="translate(47.80,0)" stroke="#ffffff"/><path d="M0,5.0 H14" transform="translate(47.80,0)" stroke="#ffffff"/><path d="M0,5.0 H7" transform="translate(69.40,0)" stroke="#3d8bea"/><path d="M0,10 V2.6 Q0,0 2.6,0 H14.4 Q17,0 17,2.6 V10" transform="translate(81.00,0)" stroke="#3d8bea"/><path d="M8.5,0 V10" transform="translate(81.00,0)" stroke="#3d8bea"/><path d="M17,0 H2.6 Q0,0 0,2.6 V7.4 Q0,10 2.6,10 H17" transform="translate(102.60,0)" stroke="#3d8bea"/><path d="M0,5.0 H14" transform="translate(102.60,0)" stroke="#3d8bea"/><path d="M0,0 H14.4 Q17,0 17,2.6 V7.4 Q17,10 14.4,10 H0 Z" transform="translate(124.20,0)" stroke="#3d8bea"/><path d="M0,0 V10" transform="translate(145.80,0)" stroke="#3d8bea"/><path d="M0,10 V2.6 Q0,0 2.6,0 H14.4 Q17,0 17,2.6 V10" transform="translate(150.40,0)" stroke="#3d8bea"/><path d="M0,5.8 H17" transform="translate(150.40,0)" stroke="#3d8bea"/></g></svg><span class="brand-suffix">Tool Library</span></div>
  <button class="who" id="who" type="button" title="Set the name shown to your team"></button>
</header>
<div class="layout">
  <nav>
    <h3>LIBRARY</h3>
    <div id="cats"></div>
    <h3 class="recent">INBOX</h3>
    <div id="inbox"><button data-view="rma" data-mine="0">RMA requests<span class="n" id="rmaCount" title="Not responded to yet"></span></button><button data-view="rma" data-mine="1">Assigned to me<span class="n" id="rmaMineCount" title="Open and assigned to you"></span></button></div>
    <h3 class="recent">RECENTLY UPDATED</h3>
    <div id="recent"></div>
  </nav>
  <main>
    <div class="top">
      <h1 id="title">All tools</h1>
      <span class="count" id="count"></span>
      <input class="search" id="q" type="search" placeholder="Search tools" aria-label="Search tools">
    </div>
    <div class="grid" id="grid"></div>
    <div id="rmaView" hidden>
      <div class="rma-filters" id="rmaFilters"></div>
      <div class="rma-wrap"><table class="rma"><thead><tr><th>Ref</th><th>Received</th><th>Company</th><th>Contact</th><th>Type</th><th>Units</th><th>Assigned</th><th>Status</th></tr></thead><tbody id="rmaRows"></tbody></table></div>
      <p class="rma-public">Customer form: <a id="rmaLink" target="_blank" rel="noopener"></a> <button class="notes-btn" id="rmaCopy">Copy link</button></p>
    </div>
  </main>
</div>
<dialog id="rmaDlg" class="wide" aria-labelledby="rma-title">
  <div class="dlg-head"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></div>
    <div><h2 id="rma-title"></h2><div class="cat" id="rma-sub"></div></div>
    <button class="close" id="rma-close" aria-label="Close">×</button></div>
  <div id="rma-body" class="rma-detail"></div>
</dialog>
<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head"><div class="ico" id="dlg-ico"></div>
    <div><h2 id="dlg-title"></h2><div class="cat" id="dlg-sub">Release notes</div></div>
    <button class="close" id="dlg-close" aria-label="Close">×</button></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="notes">Release notes</button>
    <button class="tab" role="tab" data-tab="guide">How it works</button>
  </div>
  <div id="dlg-body"></div>
</dialog>
<script>
const ICONS = {
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  grid:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h3v4H7zM14 10h3v4h-3z"/>',
  flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.9-.7-1.3-.7-2.2 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4c0-4.7-4-8.6-9-8.6z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  box:'<rect x="4" y="4" width="16" height="16" rx="2"/>'
};
const SAMPLE = [
 {slug:'admin',name:'LM Admin Tools',category:'Admin',description:'Per diem, RMA, travel requests, trip reports, vacation, travel dates and weekly summary builders.',version:'2.2',updated:'2026-10-16',last_release:'2026-10-16',icon:'briefcase',url:'#'},
 {slug:'commissioning',name:'LM Commissioning',category:'Commissioning',description:'Project-based commissioning: server, Matrox and I/O setup, Operational Settings, and Package & Deploy for per-server .efp files.',version:'2.50',updated:'2026-11-13',last_release:'2026-11-13',icon:'wrench',url:'#'},
 {slug:'health',name:'LM Health Report',category:'Monitoring',description:'Installable DreamCatcher cluster health check (.efp). Pick the build for the server: Trusty or Live Media.',version:'latest',icon:'heart',downloads:[{label:'Trusty',url:'#'},{label:'Live Media',url:'#'}]},
 {slug:'monitoring',name:'LM Monitoring',category:'Monitoring',description:'Live, read-only 2110 view of DreamCatcher Matrox cards from the NMOS API. IO map, Red/Blue lanes, SDP compare across servers.',version:'1.0.80',updated:'2026-11-10',icon:'pulse',local_only:true,url:'#'},
 {slug:'core-builder',name:'LM Core Builder',category:'Documentation',description:'Draws rear and front plates for an LM-CORE build: model, input card, SDI I/O config and front PCIe slot. Exports PNG.',version:'0.1',updated:'2026-10-30',icon:'grid',file_needed:true,url:'#'},
 {slug:'games',name:'LM Arcade',category:'Training',description:'Game and event tracking.',version:'latest',icon:'flag',url:'#'},
 {slug:'mediabank',name:'Media Bank Integration',category:'Integrations',description:'MediaBank and DreamCatcher integration tools.',version:'latest',icon:'link',url:'#'},
 {slug:'roster',name:'VueWeb Roster Management',category:'Integrations',description:'Build and manage vueWeb rosters.',version:'latest',icon:'users',url:'#'},
 {slug:'scheduler',name:'Scheduler Builder',category:'Operations',description:'Build DreamCatcher schedules.',version:'latest',icon:'calendar',url:'#'},
 {slug:'design-studio',name:'LM Design Studio',category:'Design',description:'Live-Media design studio.',version:'latest',icon:'palette',url:'#'},
 {slug:'highlights',name:'Highlight Factory Tools',category:'Production',description:'Highlight Factory setup and helpers.',version:'latest',icon:'film',url:'#'}
];
let tools = [], cat = 'All tools';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtShort = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||ICONS.box}</svg>`;

function render(){
  const cats = {};
  tools.forEach(t => cats[t.category] = (cats[t.category]||0) + 1);
  $('cats').innerHTML = [['All tools', tools.length], ...Object.entries(cats).sort()]
    .map(([c,n]) => `<button class="${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${n}</span></button>`).join('');
  $('recent').innerHTML = tools.filter(t=>t.updated).sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,5)
    .map(t => `<a href="${esc(t.url)}">${esc(t.name)}<span class="n">${esc(t.version)}</span></a>`).join('');
  const q = $('q').value.trim().toLowerCase();
  const list = tools.filter(t => (cat==='All tools' || t.category===cat) &&
    (!q || (t.name+' '+t.description+' '+t.category).toLowerCase().includes(q)));
  $('title').textContent = cat;
  $('count').textContent = list.length + (list.length===1?' tool':' tools');
  $('grid').innerHTML = list.length ? list.map(t => `
    <article class="card">
      <div class="head"><div class="ico">${svg(t.icon)}</div>
        <div><div class="name">${esc(t.name)}</div><div class="cat">${esc(t.category)}</div></div></div>
      ${(t.file_needed||t.local_only)?`<div class="tags">${t.file_needed?'<span class="tag file">FILE NEEDED</span>':''}${t.local_only?'<span class="tag local">RUNS ON SITE LAN</span>':''}</div>`:''}
      <p class="desc">${esc(t.description)}</p>
      ${t.downloads ? `<div class="dls">${t.downloads.map(d => `<a class="dl" href="${esc(d.url)}" download>${svg('download')}${esc(d.label)}</a>`).join('')}</div>` : ''}
      <div class="foot"><div class="vd"><span class="ver">${/^\d/.test(t.version)?'v'+esc(t.version):'Latest'}</span>
        </div>
        <button class="notes-btn" data-notes="${esc(t.slug)}" style="margin-left:auto">Release notes${(t.last_release||t.updated) ? `<span class="nb-date">${fmtShort(t.last_release||t.updated)}</span>` : ''}</button>
        ${t.downloads ? '' : `<a class="open" style="margin-left:0" href="${esc(t.url)}" ${t.local_only?'download':''}>${t.local_only?'Download':'Open'}</a>`}</div>
    </article>`).join('') : `<p class="empty">No tools match “${esc(q)}”. Clear the search or pick another category.</p>`;
}
$('cats').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ cat = b.dataset.cat; showView('tools'); render(); } });
$('inbox').addEventListener('click', e => { const b = e.target.closest('[data-view=rma]'); if (b) { rmaFilter = b.dataset.mine === '1' ? 'Mine' : 'Open'; showView('rma'); } });

/* ---------- RMA inbox ---------- */
const RMA_FORM_URL = (location.hostname.endsWith('.workers.dev') ? 'https://lm-rma.' + location.hostname.split('.').slice(1).join('.') : 'https://dcrma.' + location.hostname) + '/';
let rmas = [], rmaFilter = 'Open', view = 'tools', me = null, users = [];
const nameOf = e => { if (!e) return ''; const u = users.find(x => x.email === e); return (u && u.name) || e.split('@')[0]; };
const STATUSES = ['New','In progress','Waiting on customer','Shipped','Closed'];
const isOpen = r => r.status !== 'Closed' && r.status !== 'Shipped';
function showView(v){
  view = v;
  $('grid').hidden = v !== 'tools'; $('q').hidden = v !== 'tools'; $('rmaView').hidden = v !== 'rma';
  document.querySelectorAll('#inbox button').forEach(b => b.classList.toggle('on', v === 'rma' && (b.dataset.mine === '1') === (rmaFilter === 'Mine')));
  document.querySelectorAll('#cats button').forEach(b => b.classList.toggle('on', v === 'tools' && b.dataset.cat === cat));
  if (v === 'rma') { $('title').textContent = 'RMA requests'; loadRma(); }
}
async function loadRma(){
  try { const r = await fetch('/api/rma', {cache:'no-store'}); if (!r.ok) throw 0; rmas = (await r.json()).requests; }
  catch { rmas = SAMPLE_RMA; }
  try { const r = await fetch('/api/users', {cache:'no-store'}); if (r.ok) users = (await r.json()).users; } catch {}
  renderRma();
}
function renderRma(){
  const n = rmas.filter(r => r.status === 'New').length;
  $('rmaCount').textContent = n || ''; $('rmaCount').className = 'n' + (n ? ' hot' : '');
  const mine = rmas.filter(r => me && r.assigned === me && isOpen(r));
  const mineNew = mine.filter(r => r.status === 'New').length;
  $('rmaMineCount').textContent = mine.length || ''; $('rmaMineCount').className = 'n' + (mineNew ? ' hot' : '');
  document.querySelectorAll('#inbox button').forEach(b => b.classList.toggle('on', view === 'rma' && (b.dataset.mine === '1') === (rmaFilter === 'Mine')));
  if (view !== 'rma') return;
  const filters = ['Open','New','Mine','Unassigned','All'];
  $('rmaFilters').innerHTML = filters.map(f => `<button class="${f===rmaFilter?'on':''}" data-f="${f}">${f}</button>`).join('');
  const list = rmas.filter(r => rmaFilter === 'All' ? true : rmaFilter === 'New' ? r.status === 'New'
    : rmaFilter === 'Mine' ? (me && r.assigned === me && isOpen(r)) : rmaFilter === 'Unassigned' ? (!r.assigned && isOpen(r)) : isOpen(r));
  $('title').textContent = rmaFilter === 'Mine' ? 'Assigned to me' : 'RMA requests';
  $('count').textContent = list.length + (list.length === 1 ? ' request' : ' requests');
  $('rmaRows').innerHTML = list.length ? list.map(r => `<tr data-ref="${esc(r.ref)}">
    <td class="ref">${esc(r.ref)}</td><td>${fmtWhen(r.created)}</td>
    <td>${esc(r.company)}${r.urgent==='Yes'||r.hot==='Yes'?'<span class="flag">URGENT</span>':''}${r.loaner==='Yes'?'<span class="flag loan">LOANER</span>':''}${r.needed_by?`<span class="flag due">BY ${esc(fmtDue(r.needed_by))}</span>`:''}</td>
    <td>${esc(r.contact)}</td><td>${esc(r.type)}</td><td>${(r.units||[]).length}</td>
    <td class="asg${r.assigned && r.assigned === me ? ' me' : ''}">${r.assigned ? esc(r.assigned === me ? 'Me' : nameOf(r.assigned)) : '—'}</td>
    <td><span class="st ${esc(r.status.split(' ')[0])}">${esc(r.status)}</span></td></tr>`).join('')
    : `<tr><td colspan="8" style="color:var(--ink-soft);padding:24px 12px">${rmaFilter === 'Mine' ? 'Nothing open is assigned to you.' : 'No ' + (rmaFilter === 'All' ? '' : rmaFilter.toLowerCase() + ' ') + 'requests.'}</td></tr>`;
}
$('who').onclick = async () => {
  if (!me) return;
  const cur = $('who').textContent === me ? '' : $('who').textContent;
  const n = prompt('Your name, as your team sees it (leaderboard, RMA assignments):', cur);
  if (n === null) return;
  try {
    const r = await fetch('/api/me', {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({name: n})});
    if (r.ok) { const d = await r.json(); $('who').textContent = d.name || me; const u = users.find(x => x.email === me); if (u) u.name = d.name; renderRma(); }
  } catch {}
};
const fmtDue = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtWhen = s => s ? new Date(s.replace(' ', 'T') + 'Z').toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
$('rmaFilters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { rmaFilter = b.dataset.f; renderRma(); } });
$('rmaRows').addEventListener('click', e => { const tr = e.target.closest('tr[data-ref]'); if (tr) openRma(tr.dataset.ref); });
$('rmaLink').textContent = RMA_FORM_URL; $('rmaLink').href = RMA_FORM_URL;
$('rmaCopy').onclick = () => navigator.clipboard.writeText(RMA_FORM_URL).then(() => { $('rmaCopy').textContent = 'Copied'; setTimeout(() => $('rmaCopy').textContent = 'Copy link', 1500); });
function field(label, v, full){ return `<div class="${full?'full':''}"><h4>${label}</h4><p>${esc(v || '—')}</p></div>`; }
function openRma(ref){
  const r = rmas.find(x => x.ref === ref); if (!r) return;
  $('rma-title').textContent = r.company + ' · ' + r.ref;
  $('rma-sub').textContent = 'Received ' + fmtWhen(r.created) + (r.email_status && r.email_status !== 'sent' ? ' · email ' + r.email_status : '');
  const subj = encodeURIComponent('Evertz RMA ' + r.ref);
  $('rma-body').innerHTML = `
    ${field('Contact', r.contact)}${field('Company', r.company)}
    <div><h4>Email</h4><p><a href="mailto:${esc(r.email)}?subject=${subj}${r.cc ? '&cc=' + encodeURIComponent(r.cc) : ''}">${esc(r.email)}</a></p></div>${field('Phone', r.phone)}
    ${r.cc ? field('CC', r.cc, true) : ''}
    ${field('Type', r.type)}${field('Urgent / Hot RMA', r.urgent === 'Yes' || r.hot === 'Yes' ? 'Yes' : 'No')}
    ${field('Loaner needed', r.loaner === 'Yes' ? 'Yes' : 'No')}${field('Needed by', r.needed_by ? fmtDue(r.needed_by) : '')}
    ${field('Fee + automatic return if no fault found', r.auto_return === 'Yes' ? 'Accepted' : r.auto_return, true)}
    ${field('Company address', r.company_address)}${field('Shipping address', r.shipping_address)}
    <div class="full"><h4>Units</h4>${(r.units||[]).map((u,i) => `<div class="unit">
      <p><b>${i+1}. ${esc(u.part)}</b> · S/N ${esc(u.serial)}${u.firmware ? ' · FW ' + esc(u.firmware) : ''}</p>
      <p style="margin-top:6px">${esc(u.problem)}</p>${u.troubleshooting ? `<p style="margin-top:6px;color:var(--ink-soft)">Tried: ${esc(u.troubleshooting)}</p>` : ''}</div>`).join('')}</div>
    <div><h4>Status</h4><select id="rmaStatus">${STATUSES.map(s => `<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><h4>Assigned to</h4><select id="rmaAssigned"><option value="">Unassigned</option>${users.map(u => `<option value="${esc(u.email)}" ${u.email === r.assigned ? 'selected' : ''}>${esc((u.name || u.email) + (u.email === me ? ' (me)' : ''))}</option>`).join('')}${r.assigned && !users.some(u => u.email === r.assigned) ? `<option value="${esc(r.assigned)}" selected>${esc(r.assigned)}</option>` : ''}</select></div>
    <div class="full rma-quick">${r.assigned !== me ? '<button type="button" id="rmaTakeIt">Assign to me</button>' : ''}${r.status !== 'Closed' ? '<button type="button" id="rmaCloseIt">Mark closed</button>' : '<button type="button" id="rmaReopen">Reopen</button>'}</div>
    <div class="full"><h4>Internal notes</h4><textarea id="rmaNotes" placeholder="Evertz RMA #, tracking number, anything the team should know">${esc(r.notes||'')}</textarea></div>
    <div class="full rma-actions"><button class="open" id="rmaSave" style="margin-left:0;border:0;cursor:pointer">Save</button>
      <span class="saved" id="rmaSaved"></span>${r.updated_by ? `<span style="font-size:12px;color:var(--ink-soft)">Last updated by ${esc(nameOf(r.updated_by))}</span>` : ''}</div>`;
  const save = async (body) => {
    try {
      const res = await fetch('/api/rma/' + encodeURIComponent(r.ref), {method:'PATCH', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
      if (!res.ok) throw new Error((await res.json()).error || 'Save failed');
      Object.assign(r, body); r.updated_by = me; $('rmaSaved').style.color = ''; $('rmaSaved').textContent = 'Saved'; renderRma();
      return true;
    } catch (err) { $('rmaSaved').style.color = 'var(--err)'; $('rmaSaved').textContent = err.message || 'Save failed'; return false; }
  };
  $('rmaSave').onclick = () => save({ status: $('rmaStatus').value, assigned: $('rmaAssigned').value, notes: $('rmaNotes').value });
  /* taking a New request counts as responding to it */
  if ($('rmaTakeIt')) $('rmaTakeIt').onclick = async () => { if (await save({ assigned: me, status: r.status === 'New' ? 'In progress' : r.status })) openRma(r.ref); };
  if ($('rmaCloseIt')) $('rmaCloseIt').onclick = async () => { if (await save({ status: 'Closed' })) $('rmaDlg').close(); };
  if ($('rmaReopen')) $('rmaReopen').onclick = async () => { if (await save({ status: 'In progress' })) openRma(r.ref); };
  if (!$('rmaDlg').open) $('rmaDlg').showModal();
}
$('rma-close').onclick = () => $('rmaDlg').close();
$('rmaDlg').addEventListener('click', e => { if (e.target === $('rmaDlg')) $('rmaDlg').close(); });
const SAMPLE_RMA = [
  {ref:'LM-20261114-7Q2K', created:'2026-11-14 15:02:11', status:'New', company:'Sample University Athletics', contact:'Jordan Smith', email:'jsmith@example.edu', phone:'555-0100', type:'Repair', urgent:'Yes', hot:'No', company_address:'1 Stadium Way', shipping_address:'Same as company', units:[{part:'DC-IO-MX8-12G-SDI', serial:'1234567', firmware:'', problem:'Card not detected after power cycle.'}]},
  {ref:'LM-20261112-0B9D', created:'2026-11-12 18:40:00', status:'In progress', company:'Sample Arena', contact:'Alex Lee', email:'alee@example.com', phone:'555-0101', type:'Warranty Replacement', urgent:'No', hot:'No', company_address:'2 Arena Blvd', shipping_address:'Same as company', units:[{part:'LM-25GE', serial:'7654321', problem:'Link drops'},{part:'PSU', serial:'99881', problem:'Fan noise'}], assigned:'Rhyce'}
];
$('q').addEventListener('input', render);

const SAMPLE_NOTES = {
  admin:[{version:'2.2',date:'2026-10-16',notes:'- Weekly summary builder\n- Travel dates view\n- Fixed per diem rounding on partial days'},
         {version:'2.1',date:'2026-09-30',notes:'- Added RMA form\n- Trip reports export'}],
  monitoring:[{version:'1.0.80',date:'2026-11-10',notes:'- SDP compare across servers\n- Red/Blue lane view'}]
};
function noteHtml(text){
  const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
  let out = '', inList = false;
  for (const l of lines){
    if (l.startsWith('- ')){ if(!inList){ out += '<ul>'; inList = true; } out += `<li>${esc(l.slice(2))}</li>`; }
    else { if(inList){ out += '</ul>'; inList = false; } out += `<p>${esc(l)}</p>`; }
  }
  return out + (inList ? '</ul>' : '');
}
let dlgSlug = null;
async function showNotes(t){
  $('dlg-body').innerHTML = '<div class="rel"><p>Loading…</p></div>';
  let rels;
  try { const r = await fetch(`/api/tools/${t.slug}/releases`); if (!r.ok) throw 0; rels = (await r.json()).releases; }
  catch { rels = SAMPLE_NOTES[t.slug] || []; }
  if (dlgSlug !== t.slug) return;
  $('dlg-body').innerHTML = rels.length ? rels.map((x,i) => `
    <section class="rel"><div class="rel-top"><span class="rel-ver">${/^\d/.test(x.version)?'v'+esc(x.version):esc(x.version)}</span>
      <span class="rel-date">${fmtDate(x.date)}</span>${i===0?'<span class="rel-latest">CURRENT</span>':''}</div>
      ${noteHtml(x.notes)}</section>`).join('')
    : '<div class="rel"><p>No release notes yet for this tool.</p></div>';
}
async function showGuide(t){
  $('dlg-body').innerHTML = '<div class="guide"><p>Loading…</p></div>';
  let md = null;
  try { const r = await fetch(`/guides/${t.slug}.md`, {cache:'no-cache'}); if (r.ok) md = await r.text(); } catch {}
  if (dlgSlug !== t.slug) return;
  if (!md) { $('dlg-body').innerHTML = `<div class="guide"><p>No guide yet for ${esc(t.name)}.</p><p>Add <code>portal/public/guides/${esc(t.slug)}.md</code> in GitHub and it shows up here.</p></div>`; return; }
  const html = window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(md)) : `<pre>${esc(md)}</pre>`;
  $('dlg-body').innerHTML = `<article class="guide">${html}</article>`;
  $('dlg-body').querySelectorAll('.guide a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}
function setTab(tab){
  const t = tools.find(x => x.slug === dlgSlug); if (!t) return;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('dlg').classList.toggle('wide', tab === 'guide');
  $('dlg-sub').textContent = tab === 'guide' ? 'How it works' : 'Release notes';
  $('dlg').scrollTop = 0;
  tab === 'guide' ? showGuide(t) : showNotes(t);
}
function openNotes(slug, tab = 'notes'){
  const t = tools.find(x => x.slug === slug); if (!t) return;
  dlgSlug = slug;
  $('dlg-title').textContent = t.name;
  $('dlg-ico').innerHTML = svg(t.icon);
  $('dlg').showModal();
  setTab(tab);
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('grid').addEventListener('click', e => { const b = e.target.closest('[data-notes]'); if (b) openNotes(b.dataset.notes); });
$('dlg-close').onclick = () => $('dlg').close();
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });

let serverTheme = null;
function setTheme(t){ serverTheme = t; LMUI.setTheme(t); }
new MutationObserver(() => {
  const t = document.documentElement.getAttribute('data-theme');
  if ((t === 'light' || t === 'dark') && t !== serverTheme) {
    serverTheme = t;
    fetch('/api/prefs', {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({theme:t})}).catch(()=>{});
  }
}).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

(async () => {
  try {
    const r = await fetch('/api/tools'); if (!r.ok) throw 0;
    tools = (await r.json()).tools;
    fetch('/api/me').then(r=>r.json()).then(u => { me = u.email; $('who').textContent = u.name || u.email; if (u.theme) setTheme(u.theme); renderRma(); }).catch(()=>{});
  } catch { tools = SAMPLE; $('banner').hidden = false; }
  render();
  loadRma();
})();
</script>
</body>
</html>
