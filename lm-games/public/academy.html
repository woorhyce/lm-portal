*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: a single arcade cabinet column — HUD marquee, question CRT panel, play screen, camera-select buttons, control deck. Single dark look by choice. */
:root {
  --void: #07061c;      /* cabinet black, blue-biased */
  --panel: #120f33;     /* CRT glass */
  --line: #2b2766;      /* bezel lines */
  --cyan: #3fe0ff;      /* player / camera */
  --amber: #ffb52e;     /* score, selection */
  --tally: #ff3346;     /* on-air red, lives, misses */
  --green: #4dff9a;     /* clip saved */
  --ink: #e8e6ff;       /* body text */
  --dim: #8f8ac7;       /* secondary text */
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void);
  background-image: radial-gradient(ellipse at 50% -10%, #1d1760 0%, var(--void) 60%);
  color: var(--ink);
  font-family: var(--body);
  font-size: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cab {
  max-width: 540px; margin: 0 auto; padding-block: 16px 28px;
  display: flex; flex-direction: column; gap: 12px;
}
.marquee { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.marquee h1 {
  font-family: var(--display); font-size: clamp(14px, 4.2vw, 20px); line-height: 1.4; margin: 0;
  color: var(--amber); text-shadow: 3px 3px 0 var(--tally); letter-spacing: 1px; text-wrap: balance;
}
.marquee small { font-family: var(--display); font-size: 8px; color: var(--dim); letter-spacing: 2px; }

.hud {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  font-family: var(--display); font-size: 9px; letter-spacing: 1px;
  border: 2px solid var(--line); background: var(--panel); padding: 10px 12px;
}
.rec { color: var(--tally); display: flex; align-items: center; gap: 6px; }
.rec i { width: 8px; height: 8px; background: var(--tally); display: inline-block; animation: blink 1s steps(1) infinite; }
.stage { color: var(--cyan); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { display: flex; gap: 10px; align-items: center; }
.score { color: var(--amber); font-variant-numeric: tabular-nums; }
.lives { display: flex; gap: 4px; }
.lives b { width: 9px; height: 9px; background: var(--tally); box-shadow: 0 0 6px var(--tally); }
.lives b.off { background: #3a1420; box-shadow: none; }

.panel {
  border: 2px solid var(--line); background: var(--panel); padding: 12px 14px; min-height: 108px;
  display: flex; flex-direction: column; gap: 6px;
}
.eyebrow { font-family: var(--display); font-size: 8px; color: var(--dim); letter-spacing: 2px; margin: 0; }
.q { margin: 0; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.verdict { font-family: var(--display); font-size: 11px; margin: 0; line-height: 1.5; }
.verdict.ok { color: var(--green); }
.verdict.bad { color: var(--tally); }
.tip { margin: 0; color: var(--amber); font-size: 21px; line-height: 1.15; }

.screen { position: relative; border: 3px solid var(--line); background: #000; box-shadow: 0 0 0 2px #000, 0 0 30px #2a1f8a55; }
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px);
  box-shadow: inset 0 0 60px rgba(0,0,0,.7);
}
canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; image-rendering: crisp-edges; }
.ov {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 16px; background: rgba(7,6,28,.82); z-index: 2;
}
.ov h2 { font-family: var(--display); font-size: clamp(13px, 4vw, 18px); margin: 0; line-height: 1.5; color: var(--cyan); text-wrap: balance; }
.ov h2.red { color: var(--tally); }
.ov h2.amber { color: var(--amber); }
.ov p { margin: 0; max-width: 34ch; font-size: 21px; line-height: 1.15; color: var(--ink); }
.ov .sub { font-family: var(--display); font-size: 8px; color: var(--dim); letter-spacing: 2px; }
.ov .blink { font-family: var(--display); font-size: 10px; color: var(--amber); animation: blink 1s steps(1) infinite; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt {
  font: inherit; color: var(--ink); background: var(--panel); border: 2px solid var(--line);
  text-align: left; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0;
}
.opt span { font-family: var(--display); font-size: 8px; color: var(--cyan); letter-spacing: 1px; }
.opt em { font-style: normal; font-size: 19px; line-height: 1.05; }
.opt.sel { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.opt.sel span { color: var(--amber); }
.opt.right { border-color: var(--green); background: #0d2a22; }
.opt.right span { color: var(--green); }
.opt.wrong { border-color: var(--tally); background: #2d0d18; }
.opt.wrong span { color: var(--tally); }
.opt:disabled { cursor: default; }
.opt:focus-visible, .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.deck { display: flex; gap: 8px; }
.btn {
  font-family: var(--display); font-size: 11px; letter-spacing: 1px; cursor: pointer;
  border: none; padding: 14px 12px; color: var(--void);
}
.fire { flex: 1; background: var(--tally); box-shadow: 0 4px 0 #8a0f1e; color: #fff; }
.fire:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a0f1e; }
.mute { background: var(--line); color: var(--ink); box-shadow: 0 4px 0 #15123a; }
.help { margin: 0; color: var(--dim); font-size: 18px; text-align: center; line-height: 1.15; }
.lb { width: 100%; max-width: 280px; margin: 6px auto 4px; border-collapse: collapse; font-family: var(--display); font-size: 8px; line-height: 1.9; }
.lb td { padding: 1px 4px; color: var(--ink); white-space: nowrap; text-align: left; }
.lb td:first-child { color: var(--dim); width: 2.5em; text-align: right; }
.lb td:last-child { text-align: right; color: var(--amber); }
.lb tr.you td { color: var(--cyan); }
.btn:disabled { opacity: .45; cursor: default; }
kbd { font-family: var(--display); font-size: 8px; color: var(--cyan); }

@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .rec i, .ov .blink { animation: none; } }
</style>
</head>
<body>
<div class="cab">
  <div class="marquee">
    <h1>DREAMCATCHER<br>REPLAY ACADEMY</h1>
    <small>OPERATOR TRAINING · 7 STAGES</small>
  </div>

  <div class="hud">
    <div class="rec"><i></i>REC</div>
    <div class="stage" id="stage">STAGE 1/7</div>
    <div class="right"><span class="score" id="score">000000</span><span class="lives" id="lives"><b></b><b></b><b></b></span></div>
  </div>

  <section class="panel" aria-live="polite">
    <p class="eyebrow" id="eyebrow">STANDBY</p>
    <p class="q" id="qtext">Line up your camera under the right answer before the gate reaches you.</p>
    <p class="verdict" id="verdict" hidden></p>
    <p class="tip" id="tip" hidden></p>
  </section>

  <div class="screen">
    <canvas id="cv" width="320" height="240" aria-label="Game screen"></canvas>
    <div class="ov" id="ov"></div>
  </div>

  <div class="opts" id="opts">
    <button class="opt" id="opt0" data-i="0"><span>CAM A</span><em>—</em></button>
    <button class="opt" id="opt1" data-i="1"><span>CAM B</span><em>—</em></button>
    <button class="opt" id="opt2" data-i="2"><span>CAM C</span><em>—</em></button>
    <button class="opt" id="opt3" data-i="3"><span>CAM D</span><em>—</em></button>
  </div>

  <div class="deck">
    <button class="btn fire" id="fire">INSERT COIN</button>
    <button class="btn mute" id="board" aria-pressed="false">SCORES</button>
    <button class="btn mute" id="mute" aria-pressed="false">SND ON</button>
  </div>
  <p class="help"><kbd>← →</kbd> or tap a camera to move · tap it again or <kbd>SPACE</kbd> to lock in early for a speed bonus</p>
</div>

<script>
/* ================= TRAINING CONTENT =================
   Each stage = one section of the operator guide.
   q: question, a: four answers, c: index of correct answer, tip: shown after answering.
   Edit freely — answers are shuffled into camera lanes each play. */
const STAGES = [
  { name: "POWER UP", topic: "Sessions & startup",
    brief: "Every show starts the same way. Power up cleanly, get into the right session, and know your inputs from your outputs.",
    qs: [
      { q: "It's game day. Before you record anything, you should…", a: ["Start or load the session for today's game", "Delete yesterday's clips", "Unplug the RCP panel", "Record into last week's session"], c: 0, tip: "Work in the right session so today's clips stay with today's game." },
      { q: "Input channels on the replay server mainly…", a: ["Record the incoming camera feeds", "Play replays to air", "Store your playlists", "Run the scoreboard"], c: 0, tip: "Inputs record. Outputs play back. Know which is which before the show." },
      { q: "Shutting the system down for the night. The right way is…", a: ["Pull the power cord", "A proper shutdown through the software and OS", "Flip the breaker", "Leave it recording all night"], c: 1, tip: "A clean shutdown protects recordings. Hard power cuts cause trouble on the next show." },
    ]},
  { name: "ON AIR", topic: "Output & input control",
    brief: "The producer calls it, you roll it. Stay cued, stay on the right output, and talk to the truck.",
    qs: [
      { q: "Output channels are used to…", a: ["Record the cameras", "Play clips and replays out to the show", "Back up the database", "Monitor network traffic"], c: 1, tip: "Outputs feed the switcher. That's what the audience sees." },
      { q: "Before you roll a replay to air, check that you're…", a: ["On the right output channel", "Done emptying every bin", "Out of the session", "Finished deleting tags"], c: 0, tip: "The right clip on the wrong output is a classic on-air miss." },
      { q: "Producer calls for a replay and you aren't cued yet. Best move?", a: ["Roll anyway and hope", "Cue the clip, then tell them you're ready", "Ignore the call", "Restart the server"], c: 1, tip: "Get cued, then call 'ready.' Clear talkback beats a rushed roll." },
    ]},
  { name: "REPLAY THEORY", topic: "Clipping technique",
    brief: "A replay tells a tiny story: setup, payoff, done. Grab the moment first and polish it after.",
    qs: [
      { q: "A clip is defined by an IN point and an…", a: ["OUT point", "END tag", "STOP bin", "EXIT session"], c: 0, tip: "IN and OUT frame the story. Everything else is extra." },
      { q: "For a good replay, set your IN point…", a: ["Exactly on the catch", "A beat before the key action", "After the play ends", "At kickoff"], c: 1, tip: "Give viewers a moment of setup before the payoff." },
      { q: "Which of these plays back the slowest?", a: ["100%", "75%", "50%", "25%"], c: 3, tip: "Lower percentage = slower motion. 25% is quarter speed." },
      { q: "Big play just happened. Your first priority is…", a: ["Naming it perfectly", "Grabbing the clip so it isn't lost", "Building a playlist", "Exporting it"], c: 1, tip: "Capture first, tidy later. Rename and tag once the moment is safe." },
    ]},
  { name: "FIND IT FAST", topic: "Search, naming & tags",
    brief: "A clip you can't find is a clip you don't have. Name it the same way every time and tag what matters.",
    qs: [
      { q: "Why follow a naming convention?", a: ["It looks nicer", "Anyone can find clips fast in a search", "It saves disk space", "Clips won't play without it"], c: 1, tip: "Consistent names mean the next operator finds your clips too." },
      { q: "Tags are best used to…", a: ["Mark clips by player, play type, or moment", "Delete old clips", "Change playback speed", "Route video"], c: 0, tip: "Tag with the words people will search for later." },
      { q: "Halftime package needs every touchdown. Fastest way to find them?", a: ["Scrub through the whole half", "Search or filter by your tag", "Ask the camera ops", "Re-record them"], c: 1, tip: "Good tagging during the game pays off at halftime." },
    ]},
  { name: "PLAYLISTS", topic: "Building packages",
    brief: "Playlists turn single clips into a package. Order matters, and swapping angles should be muscle memory.",
    qs: [
      { q: "A playlist is…", a: ["A list of input channels", "An ordered sequence of clips to play back", "A backup of the session", "A camera shot sheet"], c: 1, tip: "Think highlight reel: clips in the order they'll air." },
      { q: "Shortcut to swap the angle of a clip inside a playlist?", a: ["A", "B", "D", "S"], c: 2, tip: "It's D. Easy to mix up with B." },
      { q: "Building a highlight reel during a timeout. Your clips should be…", a: ["In the order you want them to air", "Alphabetical", "Random", "All exactly the same length"], c: 0, tip: "Build in air order so you can just roll it." },
    ]},
  { name: "BINS & EXPORT", topic: "Organize and move media",
    brief: "Bins keep the game organized. Export and import move media on and off the system.",
    qs: [
      { q: "Bins are used to…", a: ["Organize clips into groups", "Record audio", "Set playback speed", "Restart services"], c: 0, tip: "Group by quarter, player, or package. Whatever your crew searches for." },
      { q: "Export is how you…", a: ["Erase a session", "Get clips off the system for other uses", "Swap camera angles", "Change the output channel"], c: 1, tip: "Export for social, coaches, or archive." },
      { q: "Import lets you…", a: ["Bring outside media into the system", "Mute the audio", "Lock a playlist", "Rename the server"], c: 0, tip: "Bring in bumpers, graphics, or old highlights." },
    ]},
  { name: "TROUBLESHOOT", topic: "Troubleshooting & maintenance",
    brief: "Something will go wrong. Work upstream, talk early, and keep the system healthy between shows.",
    qs: [
      { q: "One input shows black. Check first…", a: ["Reinstall the software", "Whether the source is actually sending video", "Delete the session", "Order a new server"], c: 1, tip: "Work upstream first: camera, router, cable. Many 'replay problems' start before the replay server." },
      { q: "Two devices on the network have the same IP address. That's an…", a: ["IP conflict", "Audio dropout", "Export error", "Tag mismatch"], c: 0, tip: "IP conflicts cause strange, intermittent failures. Escalate them." },
      { q: "Something breaks mid-show and you can't fix it fast. You should…", a: ["Stay quiet and keep trying", "Tell the producer and call venue support", "Reboot everything at once", "Unplug the network"], c: 1, tip: "Communicate early. Support helps faster when they hear about it during the show." },
      { q: "Storage is nearly full before a big game. Best fix?", a: ["Clear out old sessions you no longer need", "Stop recording cameras", "Hope it lasts", "Turn off the outputs"], c: 0, tip: "Housekeeping between shows keeps game day calm." },
    ]},
];

/* ================= PROLOGUE: THE ELEVATOR =================
   Story intro before Stage 1. Every choice moves on; the elevator always takes the same time. */
const PROLOGUE = {
  wake:  "Game day. The alarm is going off and crew call is in an hour.",
  apt:   "Coffee in one hand, credentials around your neck. Time to head out.",
  hall:  "Down the hall to the elevator. You live on the 14th floor.",
  question: "The elevator is all the way down in the lobby. How many times do you press the call button?",
  ride:  "Going down. Next stop: the replay room.",
  arrival: "ELEVATOR ARRIVED IN 12 SEC",
  choices: [
    { key: "ONCE", label: "1 · Once", presses: 1, pts: 150, cls: "ok", verdict: "PRO MOVE +150",
      tip: "One press. The elevator heard you. Same with DreamCatcher: press a key once, then let the system work." },
    { key: "TWICE", label: "2 · Twice, just to be sure", presses: 2, pts: 75, cls: "ok", verdict: "THE INSURANCE PRESS +75",
      tip: "We all do it. The elevator was already on its way after the first one. Once is enough on the controller too." },
    { key: "MASH IT", label: "7(ish) · Until it gets the message", presses: 7, pts: 7, cls: "bad", verdict: "COMEDY BONUS +7",
      tip: "Same 12 seconds. Mashing a button doesn't bring the elevator faster, and on a replay controller mashing a key can fire the command more than once. One clean press." },
  ],
};

/* ================= ENGINE ================= */
const W = 320, H = 240, LANES = 4, LW = W / LANES, PY = 214, GATE_H = 22;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const els = { stage: $("stage"), score: $("score"), lives: $("lives"), eyebrow: $("eyebrow"), q: $("qtext"),
  verdict: $("verdict"), tip: $("tip"), ov: $("ov"), fire: $("fire"), mute: $("mute"),
  opts: [0,1,2,3].map(i => $("opt" + i)) };
const C = { cyan: "#3fe0ff", amber: "#ffb52e", tally: "#ff3346", green: "#4dff9a", line: "#2b2766", dim: "#8f8ac7", ink: "#e8e6ff" };

let state = "title", stageIdx = 0, qIdx = 0, score = 0, stageStartScore = 0, lives = 3, streak = 0;
let correctCount = 0, answeredCount = 0, cur = null, lane = 1, px = LW * 1.5, gateY = -GATE_H, gateSpeed = 30;
let result = null, shake = 0, flash = 0, flashColor = C.tally, particles = [], t = 0, lastStageBonus = 0;
let hi = 0; try { hi = +localStorage.getItem("dcra-hi") || 0; } catch (e) {}
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 10 + Math.random() * 40, c: Math.random() < .2 ? C.cyan : "#5a55a8" }));

/* ---- sound ---- */
let ac = null, muted = false;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); }
function beep(f, d = .08, type = "square", f2 = null, vol = .06) {
  if (muted || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n); if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  o.connect(g).connect(ac.destination); o.start(n); o.stop(n + d + .02);
}
const sfx = {
  move: () => beep(660, .04),
  good: () => { beep(523, .07); setTimeout(() => beep(784, .07), 70); setTimeout(() => beep(1046, .12), 140); },
  bad: () => beep(220, .35, "sawtooth", 60, .08),
  coin: () => { beep(988, .06); setTimeout(() => beep(1319, .2), 60); },
  clear: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .1), i * 90)),
  over: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, .22, "triangle"), i * 200)),
};

/* ---- helpers ---- */
function shuffle(q) {
  const order = [0,1,2,3].sort(() => Math.random() - .5);
  return { q: q.q, tip: q.tip, a: order.map(i => q.a[i]), c: order.indexOf(q.c) };
}
const pad = n => String(n).padStart(6, "0");
function hud() {
  const s = STAGES[stageIdx];
  els.stage.textContent = state === "story" ? "PROLOGUE · GAME DAY" : `STAGE ${stageIdx + 1}/${STAGES.length} · ${s.name}`;
  els.score.textContent = pad(score);
  els.lives.innerHTML = [0,1,2].map(i => `<b class="${i < lives ? "" : "off"}"></b>`).join("");
}
function setOpts(list, interactive, keys) {
  els.opts.forEach((b, i) => {
    b.className = "opt"; b.disabled = !interactive; b.hidden = !!list && i >= list.length;
    b.querySelector("em").textContent = list && list[i] != null ? list[i] : "—";
    b.querySelector("span").textContent = keys ? (keys[i] || "") : "CAM " + "ABCD"[i];
  });
}
function markSel() { els.opts.forEach((b, i) => b.classList.toggle("sel", i === lane && state === "play")); }
function overlay(html) { els.ov.innerHTML = html; els.ov.hidden = !html; }
function panel(eyebrow, q, verdict, vClass, tip) {
  els.eyebrow.textContent = eyebrow; els.q.textContent = q;
  els.verdict.hidden = !verdict; els.verdict.textContent = verdict || ""; els.verdict.className = "verdict " + (vClass || "");
  els.tip.hidden = !tip; els.tip.textContent = tip || "";
}

/* ---- flow ---- */
function showTitle() {
  state = "title"; hud(); setOpts(null, false);
  panel("STANDBY", "Each question drops a gate of four camera angles. Park your camera under the right answer before it reaches you.");
  overlay(`<h2 class="amber">REPLAY ACADEMY</h2><p>It's game day. Get out of bed, make it to the truck, then survive ${STAGES.length} stages. 3 tally lights. Miss three and you're off air.</p>
    <span class="sub">HI-SCORE ${pad(hi)}</span><span class="blink">PRESS START</span>`);
  els.fire.textContent = "INSERT COIN";
}
function showBrief() {
  state = "brief"; const s = STAGES[stageIdx]; hud(); setOpts(null, false);
  panel(`STAGE ${stageIdx + 1} BRIEFING`, s.brief);
  overlay(`${lastStageBonus ? `<span class="sub">STAGE CLEAR · BONUS +${lastStageBonus}</span>` : ""}
    <h2>STAGE ${stageIdx + 1}<br>${s.name}</h2><span class="sub">${s.topic.toUpperCase()} · ${s.qs.length} QUESTIONS</span><span class="blink">READY?</span>`);
  els.fire.textContent = "START STAGE";
}
function startStage() { stageStartScore = score; qIdx = 0; lastStageBonus = 0; nextQuestion(); }
function nextQuestion() {
  const s = STAGES[stageIdx];
  cur = shuffle(s.qs[qIdx]); state = "play"; result = null; overlay("");
  gateY = -GATE_H;
  const seconds = Math.max(5.5, 11 - stageIdx * 0.8);   // time for the gate to reach you
  gateSpeed = (PY - GATE_H - 4 + GATE_H) / seconds;
  panel(`STAGE ${stageIdx + 1} · Q${qIdx + 1}/${s.qs.length}`, cur.q);
  setOpts(cur.a, true); markSel(); hud();
  els.fire.textContent = "LOCK IN";
}
function moveTo(i) {
  if (state !== "play") return;
  i = Math.max(0, Math.min(LANES - 1, i));
  if (i !== lane) { lane = i; sfx.move(); markSel(); }
}
function lockIn() { if (state === "play") resolve(true); }
function resolve(early) {
  const travel = PY - GATE_H - 4 + GATE_H;
  const remaining = Math.max(0, 1 - (gateY + GATE_H) / travel);
  const ok = lane === cur.c; answeredCount++;
  state = "result"; gateY = PY - GATE_H - 4;
  let verdict, cls;
  if (ok) {
    streak++; correctCount++;
    const mult = Math.min(4, streak), speed = early ? Math.round(remaining * 100) : 0, pts = 100 * mult + speed;
    score += pts; verdict = `CLIP SAVED! +${pts}` + (mult > 1 ? ` (x${mult} STREAK)` : "") + (speed ? ` · SPEED +${speed}` : "");
    cls = "ok"; sfx.good(); burst(LW * lane + LW / 2, PY - 8, C.green); burst(LW * lane + LW / 2, PY - 8, C.amber);
    flash = .25; flashColor = C.green;
  } else {
    streak = 0; lives--; shake = .4; flash = .35; flashColor = C.tally; sfx.bad();
    verdict = `DROPPED FRAME · ANSWER WAS CAM ${"ABCD"[cur.c]}`; cls = "bad";
  }
  result = { ok, chose: lane };
  els.opts.forEach((b, i) => { b.disabled = true; b.classList.remove("sel");
    if (i === cur.c) b.classList.add("right"); else if (i === lane) b.classList.add("wrong"); });
  panel(`STAGE ${stageIdx + 1} · Q${qIdx + 1}/${STAGES[stageIdx].qs.length}`, cur.q, verdict, cls, cur.tip);
  hud();
  els.fire.textContent = lives <= 0 ? "GAME OVER ▶" : "NEXT ▶";
}
function advance() {
  if (lives <= 0) return gameOver();
  qIdx++;
  if (qIdx < STAGES[stageIdx].qs.length) return nextQuestion();
  lastStageBonus = 250 + lives * 100; score += lastStageBonus; sfx.clear();
  stageIdx++;
  if (stageIdx >= STAGES.length) return win();
  showBrief();
}
function gameOver() {
  state = "over"; sfx.over(); setOpts(null, false);
  overlay(`<h2 class="red">OFF AIR</h2><p>You ran out of tally lights on stage ${stageIdx + 1}. Review the tips and take another run at it.</p><span class="blink">CONTINUE?</span>`);
  panel("GAME OVER", "Continue restarts this stage with three fresh lives. Your score rolls back to the start of the stage.");
  els.fire.textContent = "CONTINUE";
}
function win() {
  state = "win"; setOpts(null, false);
  const acc = Math.round(correctCount / Math.max(1, answeredCount) * 100);
  const rank = acc >= 90 ? "LEAD REPLAY OPERATOR" : acc >= 70 ? "REPLAY OPERATOR" : "TRAINEE · RUN IT AGAIN";
  if (score > hi) { hi = score; try { localStorage.setItem("dcra-hi", String(hi)); } catch (e) {} }
  stageIdx = STAGES.length - 1; hud(); stageIdx = 0;
  overlay(`<span class="sub">ALL ${STAGES.length} STAGES COMPLETE</span><h2 class="amber">${rank}</h2>
    <p>Score ${pad(score)} · ${acc}% accuracy (${correctCount}/${answeredCount})</p><span class="sub">HI-SCORE ${pad(hi)}</span><span class="blink">PLAY AGAIN?</span>`);
  panel("CERTIFIED", "Training run complete. Every tip you saw comes from the operator guide, so revisit any stage you dropped frames on.");
  els.fire.textContent = "PLAY AGAIN";
}
function fire() {
  audio();
  switch (state) {
    case "title": sfx.coin(); score = 0; lives = 3; streak = 0; stageIdx = 0; correctCount = answeredCount = 0; lastStageBonus = 0; startStory(); break;
    case "story": storyFire(); break;
    case "brief": startStage(); break;
    case "play": lockIn(); break;
    case "result": advance(); break;
    case "over": sfx.coin(); lives = 3; streak = 0; score = stageStartScore; lastStageBonus = 0; showBrief(); break;
    case "win": showTitle(); break;
  }
}

/* ---- prologue story ---- */
let sc = null, st = 0, story = null;
function startStory() { state = "story"; setScene("wake"); }
function setScene(name) {
  sc = name; st = 0; overlay(""); hud();
  const P = PROLOGUE;
  if (name === "wake") { setOpts(null, false); panel("PROLOGUE · 6:00 AM", P.wake); els.fire.textContent = "GET UP"; }
  if (name === "apt")  { panel("PROLOGUE · 6:04 AM", P.apt); els.fire.textContent = "WALKING…"; }
  if (name === "hall") { panel("PROLOGUE · 6:05 AM", P.hall); els.fire.textContent = "WALKING…"; }
  if (name === "button") {
    story = { choice: null, toPress: 0, pressed: 0, next: 0, press: 0, fT: -1, arrived: false, open: 0 };
    panel("PROLOGUE · FIRST TASK", P.question);
    setOpts(P.choices.map(c => c.label), true, P.choices.map(c => c.key));
    els.fire.textContent = "CHOOSE ABOVE";
  }
  if (name === "ride") { setOpts(null, false); panel("PROLOGUE · 6:06 AM", P.ride); els.fire.textContent = "SKIP ▶"; }
}
function choose(i) {
  if (state !== "story" || sc !== "button" || story.choice !== null) return;
  story.choice = i; story.toPress = PROLOGUE.choices[i].presses; story.next = .25;
  els.opts.forEach((b, j) => { b.disabled = true; b.classList.toggle("sel", j === i); });
  els.fire.textContent = "PRESSING…";
}
function storyFire() {
  if (sc === "wake") { sfx.coin(); setScene("apt"); }
  else if (sc === "button" && story.arrived) setScene("ride");
  else if (sc === "ride") endStory();
}
function endStory() { stageIdx = 0; lastStageBonus = 0; showBrief(); }
function updateStory(dt) {
  st += dt;
  if (sc === "apt" && st > 2.4) setScene("hall");
  else if (sc === "hall" && st > 2.6) setScene("button");
  else if (sc === "ride" && st > 3.4) endStory();
  else if (sc === "button" && story.choice !== null) {
    if (story.pressed < story.toPress) {
      story.next -= dt;
      if (story.next <= 0) {
        story.pressed++; story.press = .1; beep(880 + story.pressed * 50, .05);
        story.next = story.toPress > 2 ? .15 : .45;
        if (story.pressed === story.toPress) story.fT = 0;
        if (story.toPress > 2 && story.pressed > 3) shake = .15;
      }
    } else if (!story.arrived) {
      story.fT += dt;
      if (story.fT >= 2.4) {
        story.arrived = true;
        const c = PROLOGUE.choices[story.choice];
        score += c.pts; hud();
        [1319, 1047].forEach((f, k) => setTimeout(() => beep(f, .25, "triangle", null, .07), k * 180));
        panel("PROLOGUE · FIRST TASK", PROLOGUE.question, `${c.verdict} · ${PROLOGUE.arrival}`, c.cls, c.tip);
        els.fire.textContent = "RIDE DOWN ▶";
      }
    } else story.open = Math.min(1, story.open + dt * 1.6);
    if (story.press > 0) story.press -= dt;
  }
}

/* person sprite: x = center, y = feet, s = pixel scale */
function person(x, y, s, frame = 0, opts = {}) {
  const r = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x + (dx - 4) * s), Math.round(y + (dy - 16) * s), Math.ceil(w * s), Math.ceil(h * s)); };
  const skin = "#f1b98a", hair = "#3a2418", pants = "#3d3a82", shoe = "#111";
  r(1, 0, 6, 2, hair); r(1, 2, 1, 2, hair);
  r(2, 2, 5, 3, skin); r(3, 3, 1, 1, "#111"); r(5, 3, 1, 1, "#111");
  r(1, 5, 6, 6, C.cyan); r(0, 5, 1, 5, C.cyan); r(7, 5, 1, 5, C.cyan);
  r(0, 10, 1, 1, skin); r(7, 10, 1, 1, skin);
  r(3, 5, 1, 3, C.tally); r(4, 5, 1, 3, C.tally); r(3, 8, 2, 2, "#fff");
  if (opts.coffee) { r(8, 8, 2, 3, "#fff"); r(8, 8, 2, 1, "#6b3f22"); }
  if (frame % 2 === 0) { r(2, 11, 2, 4, pants); r(4, 11, 2, 4, pants); r(2, 15, 2, 1, shoe); r(4, 15, 2, 1, shoe); }
  else { r(1, 11, 2, 4, pants); r(5, 11, 2, 4, pants); r(1, 15, 2, 1, shoe); r(5, 15, 2, 1, shoe); }
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function floorLabel(n) { return n <= 0 ? "L" : String(n); }

function drawStory() {
  const sh = shake > 0 ? (Math.random() - .5) * 6 * shake : 0;
  ctx.save(); ctx.translate(sh, 0);
  const walk = Math.floor(st / .15);
  if (sc === "wake" || sc === "apt") {
    rect(0, 0, W, H, "#1b1640"); rect(0, 182, W, 58, "#2a1f3d"); rect(0, 180, W, 3, "#3d3070");
    // window at dawn
    rect(128, 48, 64, 56, "#0e0b2a"); rect(132, 52, 56, 48, "#3b2a7a"); rect(132, 84, 56, 16, "#a6466b"); rect(132, 94, 56, 6, C.amber);
    rect(158, 52, 4, 48, "#0e0b2a"); rect(132, 74, 56, 3, "#0e0b2a");
    for (let i = 0; i < 6; i++) rect(136 + i * 9, 88 - (i % 3) * 4, 6, 12 + (i % 3) * 4, "#1d1545");   // skyline
    // bed + nightstand + clock
    rect(14, 128, 8, 54, "#5a3a2a"); rect(14, 164, 92, 18, "#5a3a2a");
    rect(22, 154, 84, 12, "#e8e6ff"); rect(24, 148, 20, 8, "#ffffff");
    rect(110, 164, 22, 18, "#4a3326");
    const ring = sc === "wake" && Math.floor(t * 4) % 2;
    rect(113 + (ring ? 1 : 0), 154, 16, 10, "#000"); text("6:00", 121 + (ring ? 1 : 0), 159, ring ? C.tally : "#7a1d28", 5);
    // door
    rect(272, 104, 34, 78, "#4a3326"); rect(276, 108, 26, 32, "#5a4030"); rect(276, 144, 26, 32, "#5a4030"); rect(298, 142, 3, 3, C.amber);
    if (sc === "wake") {
      rect(28, 140, 9, 4, "#3a2418"); rect(29, 144, 8, 5, "#f1b98a"); rect(31, 146, 1, 1, "#111"); rect(34, 146, 1, 1, "#111");
      rect(36, 148, 70, 10, "#3fa0c0"); rect(36, 148, 70, 2, "#6fc6e0");                         // blanket
      const z = (t * 12) % 30;
      text("z", 44 + z * .3, 136 - z, C.dim, 6); text("Z", 52 + ((z + 15) % 30) * .3, 136 - (z + 15) % 30, C.dim, 8);
      if (ring) { text("BEEP", 121, 142, C.tally, 6); }
    } else {
      const k = Math.min(1, st / 2.1), x = 60 + (285 - 60) * k;
      person(x, 181, 2, k < 1 ? walk : 0, { coffee: true });
      rect(22, 154, 84, 4, "#3fa0c0");   // kicked-off blanket
    }
  }
  if (sc === "hall") {
    rect(0, 0, W, H, "#231d4f"); rect(0, 120, W, 6, "#3a3175"); rect(0, 126, W, 56, "#2d2660");
    rect(0, 182, W, 58, "#3a1f3a"); for (let x = -((st * 0) % 16); x < W; x += 16) rect(x + 4, 200, 8, 2, "#4f2a4f");
    [[20, "1403"], [100, "1405"], [180, "1407"]].forEach(([dx, n]) => {
      rect(dx, 100, 34, 82, "#4a3326"); rect(dx + 26, 142, 3, 3, C.amber); text(n, dx + 17, 92, C.dim, 5);
    });
    for (let x = 30; x < W; x += 80) { rect(x, 30, 22, 6, "#fff4c8"); rect(x + 6, 36, 10, 2, "#c9b98a"); }   // ceiling lights
    rect(232, 96, 64, 86, "#596084"); rect(236, 100, 28, 82, "#8b93b8"); rect(264, 100, 28, 82, "#9aa2c6"); rect(263, 100, 2, 82, "#3a3f5e");
    rect(250, 80, 28, 12, "#000"); text("L", 264, 86, C.amber, 6);
    rect(300, 132, 8, 14, "#5a6188"); rect(302, 136, 4, 4, "#c9cbe0");
    const k = Math.min(1, st / 2.2);
    person(14 + (214 - 14) * k, 181, 2, k < 1 ? walk : 0, { coffee: true });
  }
  if (sc === "button") {
    const fl = story.fT < 0 ? 0 : Math.floor(14 * Math.min(1, story.fT / 2.4));
    rect(0, 0, W, H, "#231d4f"); rect(0, 200, W, 40, "#3a1f3a");
    // doors
    const gap = story.open * 58;
    rect(30, 34, 176, 172, "#596084"); rect(38, 42, 160, 164, "#fff1c4");
    rect(38, 42, 80 - gap, 164, "#8b93b8"); rect(118 + gap, 42, 80 - gap, 164, "#9aa2c6");
    if (!story.open) rect(117, 42, 2, 164, "#3a3f5e");
    // floor indicator
    rect(90, 10, 56, 20, "#000"); rect(92, 12, 52, 16, "#120a08");
    text(floorLabel(fl), 118, 21, C.amber, 10);
    if (story.fT >= 0 && !story.arrived) text("▲", 100, 21, C.amber, 6);
    // call panel + button
    rect(226, 96, 52, 76, "#5a6188"); rect(230, 100, 44, 68, "#454b6e");
    const lit = story.pressed > 0 && !story.arrived, hot = story.press > 0;
    rect(240, 118, 24, 24, hot ? "#fff6d8" : lit ? C.amber : "#c9cbe0");
    rect(244, 114, 16, 32, hot ? "#fff6d8" : lit ? C.amber : "#c9cbe0");
    rect(236, 122, 32, 16, hot ? "#fff6d8" : lit ? C.amber : "#c9cbe0");
    text("▼", 252, 131, "#454b6e", 8);
    // finger
    if (story.choice !== null && !story.arrived) {
      const fx = hot ? 262 : 280;
      rect(fx, 126, 40, 10, "#f1b98a"); rect(fx + 18, 120, 30, 22, "#f1b98a"); rect(fx + 36, 120, 20, 22, C.cyan);
    }
    // the elevator talks back
    if (story.choice === 2 && story.pressed >= 4 && !story.arrived) bubble(story.pressed >= 7 ? "SERIOUSLY." : "I HEARD YOU.", 150, 58);
    if (story.choice === 1 && story.pressed >= 2 && !story.arrived) bubble("...", 150, 58);
    if (story.arrived) bubble("DING!", 150, 58);
    text(`PRESSES: ${story.pressed}`, 252, 186, C.dim, 6);
  }
  if (sc === "ride") {
    const fl = Math.max(0, 14 - Math.floor(14 * Math.min(1, st / 3)));
    rect(0, 0, W, H, "#5f6386"); rect(0, 0, W, 16, "#3a3f5e"); rect(0, 210, W, 30, "#2d2a44");
    for (let x = 16; x < W; x += 72) rect(x, 30, 56, 170, "#6b6f94");
    rect(136, 20, 48, 16, "#000"); text(floorLabel(fl), 160, 28, C.amber, 8);
    rect(270, 80, 26, 70, "#454b6e"); for (let i = 0; i < 6; i++) rect(276 + (i % 2) * 10, 88 + Math.floor(i / 2) * 18, 6, 6, i === 5 ? C.amber : "#c9cbe0");
    person(160, 214 + (Math.floor(t * 8) % 2 ? 1 : 0), 4, 0, { coffee: true });
    const n = (t * 20) % 40; rect(60 + n * .4, 70 - n, 3, 6, C.cyan); rect(63 + n * .4, 66 - n, 4, 2, C.cyan);
  }
  ctx.restore();
  const fade = Math.max(0, 1 - st * 3);
  if (fade > 0) { ctx.globalAlpha = fade; rect(0, 0, W, H, "#000"); ctx.globalAlpha = 1; }
}
function bubble(str, x, y) {
  ctx.font = '6px "Press Start 2P", monospace';
  const w = ctx.measureText(str).width + 12;
  rect(x - w / 2, y - 9, w, 16, "#fff"); rect(x - 3, y + 7, 6, 4, "#fff");
  text(str, x, y, "#120f33", 6);
}

/* ---- input ---- */
els.fire.addEventListener("click", fire);

/* ---- leaderboard (top 10 across every account, from the Tool Library) ---- */
const boardBtn = document.getElementById("board");
let boardOpen = false, boardSaved = null;
const boardStates = ["title", "brief", "over", "win"];
function syncBoardBtn() { boardBtn.disabled = !boardOpen && !boardStates.includes(state); }
setInterval(syncBoardBtn, 300);
function closeBoard() {
  if (!boardOpen) return;
  boardOpen = false; boardBtn.setAttribute("aria-pressed", "false"); boardBtn.textContent = "SCORES";
  els.ov.innerHTML = boardSaved; els.ov.hidden = !boardSaved;
}
async function openBoard() {
  boardOpen = true; boardSaved = els.ov.innerHTML;
  boardBtn.setAttribute("aria-pressed", "true"); boardBtn.textContent = "BACK";
  overlay(`<h2 class="amber">HIGH SCORES</h2><span class="sub">LOADING…</span>`);
  let rows = null;
  try { const r = await fetch("/api/leaderboard", { cache: "no-store" }); if (r.ok) rows = (await r.json()).rows; } catch (e) {}
  if (!boardOpen) return;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const body = rows == null ? `<span class="sub">LEADERBOARD OFFLINE</span>`
    : !rows.length ? `<span class="sub">NO SCORES YET · FINISH A RUN TO GET ON THE BOARD</span>`
    : `<table class="lb">${rows.map((r) => `<tr class="${r.you ? "you" : ""}"><td>${r.rank}.</td><td>${esc(r.name)}${r.you ? " &lt;" : ""}</td><td>${pad(r.score)}</td></tr>`).join("")}</table>`;
  overlay(`<h2 class="amber">HIGH SCORES</h2>${body}<span class="sub">ALL OPERATORS · FULL RUNS</span>`);
}
boardBtn.addEventListener("click", () => { audio(); boardOpen ? closeBoard() : openBoard(); });
els.fire.addEventListener("click", (e) => { if (boardOpen) { e.stopImmediatePropagation(); closeBoard(); } }, true);
window.addEventListener("keydown", (e) => {
  if (boardOpen && (e.key === "Escape" || e.key === " " || e.key === "Enter")) { e.preventDefault(); e.stopImmediatePropagation(); closeBoard(); }
}, true);
els.opts.forEach((b, i) => b.addEventListener("click", () => { audio(); if (state === "story") return choose(i); if (state !== "play") return; if (i === lane) lockIn(); else moveTo(i); }));
cv.addEventListener("pointerdown", e => {
  audio(); const r = cv.getBoundingClientRect(), i = Math.floor((e.clientX - r.left) / r.width * LANES);
  if (state === "play") { if (i === lane) lockIn(); else moveTo(i); } else if (state === "story" && sc === "button" && !story.arrived) return; else fire();
});
els.ov.addEventListener("pointerdown", () => fire());
els.mute.addEventListener("click", () => { muted = !muted; els.mute.textContent = muted ? "SND OFF" : "SND ON"; els.mute.setAttribute("aria-pressed", String(muted)); });
addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); moveTo(lane - 1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); moveTo(lane + 1); }
  else if (state === "story" && ["1","2","3","7"].includes(e.key)) choose(e.key === "7" ? 2 : +e.key - 1);
  else if (["1","2","3","4"].includes(e.key)) moveTo(+e.key - 1);
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); fire(); }
});

/* ---- render ---- */
function burst(x, y, color) {
  for (let i = 0; i < 18; i++) { const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 90;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: .7 + Math.random() * .4, color }); }
}
function text(str, x, y, color, size = 8, align = "center") {
  ctx.font = `${size}px "Press Start 2P", monospace`; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillStyle = color; ctx.fillText(str, Math.round(x), Math.round(y));
}
function drawCamera(x, y) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = "#1a6f86"; ctx.fillRect(x - 12, y - 4, 24, 12);          // body shadow
  ctx.fillStyle = C.cyan; ctx.fillRect(x - 12, y - 6, 24, 11);             // body
  ctx.fillStyle = "#0b2a38"; ctx.fillRect(x - 5, y - 14, 10, 8);           // lens hood
  ctx.fillStyle = C.cyan; ctx.fillRect(x - 3, y - 12, 6, 5);               // lens glass
  ctx.fillStyle = "#e8fbff"; ctx.fillRect(x - 2, y - 11, 2, 2);            // glint
  ctx.fillStyle = (Math.floor(t * 3) % 2) ? C.tally : "#5a1220"; ctx.fillRect(x + 7, y - 4, 3, 3);  // tally
  ctx.fillStyle = "#0b2a38"; ctx.fillRect(x - 8, y - 2, 10, 3);            // vents
  const fl = 3 + Math.floor(Math.random() * 3);                            // thruster
  ctx.fillStyle = C.amber; ctx.fillRect(x - 6, y + 6, 3, fl); ctx.fillRect(x + 3, y + 6, 3, fl);
}
function draw(dt) {
  if (state === "story") { drawStory(); return; }
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 8 * shake, (Math.random() - .5) * 8 * shake);
  ctx.fillStyle = "#05041a"; ctx.fillRect(-8, -8, W + 16, H + 16);

  const warp = state === "play" ? 2.2 : 1;
  for (const s of stars) { s.y += s.s * warp * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    ctx.fillStyle = s.c; ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, s.s > 35 ? 2 : 1); }

  // lanes
  ctx.fillStyle = C.line;
  for (let i = 1; i < LANES; i++) for (let y = (t * 40) % 12 - 12; y < H; y += 12) ctx.fillRect(i * LW, Math.round(y), 1, 6);
  if (state === "play" || state === "result") { ctx.fillStyle = "rgba(255,181,46,.06)"; ctx.fillRect(lane * LW, 0, LW, H); }

  // timeline bar
  if (cur && (state === "play" || state === "result")) {
    const travel = PY - GATE_H - 4 + GATE_H, p = Math.min(1, (gateY + GATE_H) / travel);
    ctx.fillStyle = C.line; ctx.fillRect(8, 6, W - 16, 4);
    ctx.fillStyle = p > .75 ? C.tally : C.amber; ctx.fillRect(8, 6, Math.round((W - 16) * (1 - p)), 4);
  }

  // gate
  if (cur && (state === "play" || state === "result")) {
    for (let i = 0; i < LANES; i++) {
      const gx = i * LW + 7, gw = LW - 14, gy = Math.round(gateY);
      let col = C.cyan, fill = "rgba(63,224,255,.08)";
      if (state === "result") {
        if (i === cur.c) { col = C.green; fill = "rgba(77,255,154,.25)"; }
        else if (i === result.chose) { col = C.tally; fill = "rgba(255,51,70,.25)"; }
        else { col = C.line; fill = "rgba(0,0,0,0)"; }
      } else if (i === lane) { col = C.amber; fill = "rgba(255,181,46,.18)"; }
      ctx.fillStyle = fill; ctx.fillRect(gx, gy, gw, GATE_H);
      ctx.fillStyle = col; ctx.fillRect(gx, gy, gw, 2); ctx.fillRect(gx, gy + GATE_H - 2, gw, 2);
      ctx.fillRect(gx, gy, 2, GATE_H); ctx.fillRect(gx + gw - 2, gy, 2, GATE_H);
      text("CAM " + "ABCD"[i], gx + gw / 2, gy + GATE_H / 2 + 1, col);
    }
  }

  // player
  const target = lane * LW + LW / 2; px += (target - px) * Math.min(1, dt * 16);
  if (state !== "title" && state !== "win") drawCamera(px, PY);

  // particles
  particles = particles.filter(p => (p.life -= dt) > 0);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt;
    ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }

  // attract mode
  if (state === "title" || state === "win") {
    const bob = Math.sin(t * 2) * 4; drawCamera(W / 2 + Math.sin(t) * 60, 190 + bob);
  }
  ctx.restore();

  if (flash > 0) { ctx.globalAlpha = Math.min(.5, flash); ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  if (state === "story") updateStory(dt);
  if (state === "play") { gateY += gateSpeed * dt; if (gateY >= PY - GATE_H - 4) resolve(false); }
  if (shake > 0) shake -= dt; if (flash > 0) flash -= dt * 1.5;
  draw(dt); requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
</script>
