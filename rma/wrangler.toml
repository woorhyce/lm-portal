# PUBLIC customer RMA form. Do NOT enable Cloudflare Access on this Worker.
# It can only add requests; reading them happens in the (Access-protected) portal.
name = "lm-rma"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
TO_EMAIL = "livemediavenues@gmail.com"   # one or more, comma-separated; each must be verified in Email Routing
FROM_EMAIL = "rma@evertz.app"
TURNSTILE_SITE_KEY = ""    # optional spam protection; secret goes in TURNSTILE_SECRET (a Secret)

[[routes]]
pattern = "dcrma.evertz.app"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "lm-db"
database_id = "04b131fe-c2aa-4a9a-9d63-8ae0459fff1e"

# Email: evertz.app has Email Routing on, and TO_EMAIL is a verified destination address.
[[send_email]]
name = "EMAIL"
# no destination_address: can send to any verified destination listed in TO_EMAIL
