<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/lm-sync.js"></script>
<link rel="stylesheet" href="/lm-ui.css">
<script src="/lm-ui.js" data-suffix="HF Clip Name Builder"></script>
<title>Clip Name Builder</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  /* Shared colours (--bg --surface --ink --ink-soft --line --accent --save --on-accent) come from lm-ui.css.
     Everything below is derived from them, so the app follows the portal's light/dark switch. */
  --line-soft:color-mix(in srgb,var(--line) 50%,var(--surface)); --rail-bg:color-mix(in srgb,var(--bg) 72%,var(--line));
  --accent-ink:color-mix(in srgb,var(--accent) 75%,var(--ink)); --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--surface));
  --warn:#c07a45; --warn-ink:color-mix(in srgb,#c07a45 55%,var(--ink)); --warn-soft:color-mix(in srgb,#c07a45 16%,var(--surface));
  --good:#4f9a6c; --good-soft:color-mix(in srgb,#4f9a6c 16%,var(--surface));
  --danger:#c4513a; --danger-soft:color-mix(in srgb,#c4513a 16%,var(--surface));
  --header-fill:color-mix(in srgb,var(--line) 55%,var(--surface));
  --primary-ink:var(--on-accent); --save-hover:color-mix(in srgb,var(--save) 85%,var(--surface));
  --focus:var(--accent); --blue:#5aaee8; --bar-h:0px;
}
*{box-sizing:border-box} [hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
.mono,code,pre{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
code{font-size:.78rem;background:var(--line-soft);padding:1px 5px;border-radius:4px}
h1,h2,h3{margin:0}
h3{font-size:.86rem;font-weight:600}
.muted{color:var(--ink-soft)}
button{font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}


/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - var(--bar-h))}
.railnav{position:sticky;top:var(--bar-h);align-self:start;height:calc(100vh - var(--bar-h));display:flex;flex-direction:column;background:var(--rail-bg);border-right:1px solid var(--line);overflow-y:auto}
.rail-group{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);padding:16px 16px 6px}
.rail-group .rg-acts{display:flex;gap:4px}
.rail-mini{width:24px;height:24px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--accent-ink);border-radius:6px;cursor:pointer;padding:0}
.rail-mini svg{width:14px;height:14px}
.rail-mini:hover{border-color:var(--ink-soft)}
.rail-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;border:none;border-bottom:1px solid var(--line-soft);background:transparent;color:var(--ink);font:inherit;font-size:.82rem;font-weight:600;text-align:left;cursor:pointer}
.rail-item svg{width:20px;height:20px;flex:none;color:var(--accent-ink)}
.rail-item:hover{background:var(--line-soft)}
.rail-item[aria-current="true"]{background:var(--accent-soft)}
.rail-item .rail-count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.64rem;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.rail-tog,.rail-tog-pad{flex:none;width:20px;height:20px;margin-left:4px;display:inline-grid;place-items:center;border-radius:4px;color:var(--ink-soft)}
.rail-tog{cursor:pointer}
.rail-tog:hover{background:var(--line);color:var(--ink)}
.rail-tog svg{width:14px !important;height:14px !important;color:currentColor !important;transition:transform .12s}
.rail-tog[aria-expanded="true"] svg{transform:rotate(90deg)}
.rail-tog:focus-visible{outline:2px solid var(--focus)}
.rail-item .soon{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.1em;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:1px 6px}
.rail-item.sub{padding-left:26px}
.rail-item[disabled]{cursor:default;color:var(--ink-soft)}
.rail-item[disabled] svg{color:var(--ink-soft)}
.rail-item .rail-dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.srv-list{list-style:none;margin:0;padding:0}
.srv-item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:2px 9px;width:100%;padding:8px 12px 8px 16px;border:none;border-top:1px solid var(--line-soft);background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.srv-item:hover{background:var(--line-soft)}
.srv-item[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.srv-item .sd{width:9px;height:9px;border-radius:50%;grid-row:1 / span 2;background:transparent;box-shadow:inset 0 0 0 2px var(--ink-soft)}
.srv-item .sd.tpl{background:var(--accent);box-shadow:none}
.srv-item .sn{font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv-item .sh{grid-column:2;font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv-item .st{grid-row:1 / span 2;grid-column:3;font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.rail-foot{margin-top:auto;padding:12px 16px 14px;border-top:1px solid var(--line)}
.rail-foot .rf-row{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.meter{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden} .meter span{display:block;height:100%;background:var(--accent)}
.rail-foot .ver{font-size:.62rem;color:var(--ink-soft);margin-top:8px}

.content{padding:24px 16px 60px;min-width:0}
.wrap{max-width:1180px;margin:0 auto}
.masthead{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding-bottom:12px;border-bottom:2px solid var(--accent);margin-bottom:22px}
.masthead h1{font-size:1.5rem;font-weight:600;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.mast-meta{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-soft);letter-spacing:.04em}
.draft-when{font-size:.7rem;color:var(--ink-soft);white-space:nowrap}
.draft-when.is-dirty{color:var(--warn-ink);font-weight:700}
.masthead-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill-btn,.tool-reset-btn,.draft-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;font:inherit;font-size:.78rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.tool-reset-btn{color:var(--ink-soft);background:transparent;border:1px solid var(--line)}
.tool-reset-btn:hover{color:var(--ink);background:var(--surface);border-color:var(--ink-soft)}
.tool-reset-btn.confirm-armed,.btn.confirm-armed{background:#c0392b;border-color:#c0392b;color:#fff}
.draft-btn{color:var(--on-accent);background:var(--save);border:1px solid var(--save);box-shadow:0 1px 2px rgba(20,40,90,.18)}
.draft-btn:hover{background:var(--save-hover)}
.draft-btn:disabled{opacity:.6;cursor:wait}
.tool-reset-btn svg,.draft-btn svg{width:14px;height:14px}

/* ---------- cards / board ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 20px 22px;min-width:0}
.card + .card{margin-top:18px}
.card-hint{font-size:.74rem;color:var(--ink-soft);margin:-6px 0 12px}
.section-label{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.section-label .count{order:2;color:var(--ink-soft);letter-spacing:.06em}
.section-label .sl-act{order:3;font-family:"IBM Plex Sans",sans-serif;letter-spacing:0;text-transform:none}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.board > .span{grid-column:1 / -1}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.stack > .card + .card,.board > .card + .card{margin-top:0}
@media (max-width:1100px){ .board.setup{grid-template-columns:minmax(0,1fr)} }
@media (max-width:880px){ .board{grid-template-columns:minmax(0,1fr)} }
.sticky{position:sticky;top:calc(var(--bar-h) + 12px)}
.send-to-note{font-size:.8rem;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;margin-bottom:18px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.link-btn{border:none;background:none;color:var(--accent-ink);text-decoration:underline;font-size:.76rem;font-weight:600;cursor:pointer;padding:0}

/* ---------- fields ---------- */
.field{display:grid;gap:5px;min-width:0}
.label,.dcl{display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft)}
.hint{font-size:.72rem;color:var(--ink-soft);font-weight:400}
input[type=text],input[type=password],input:not([type]),input[type=search],select,textarea{width:100%;min-width:0;font:inherit;font-size:.88rem;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input.mono,select.mono{font-family:"IBM Plex Mono",monospace;font-size:.8rem}
textarea{resize:vertical;min-height:64px;font-family:"IBM Plex Mono",monospace;font-size:.8rem;line-height:1.45}
input[type=file]{font-size:.78rem;color:var(--ink-soft)}
input[type=checkbox]{accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;align-items:start}
.dcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){ .dcgrid{grid-template-columns:1fr} }
.dcf{display:grid;gap:5px;min-width:0}
.dcnote{font-size:.72rem;color:var(--ink-soft)}
.dcsub{font-size:.8rem;font-weight:600;color:var(--ink)}
.dcsep{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;align-items:end}
@media (max-width:640px){ .dcsep{grid-template-columns:1fr} }
.panel-body{display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;cursor:pointer}
.check input{width:16px;height:16px;margin:2px 0 0;flex:none}
.check b{font-weight:600}
.stack-12{display:grid;gap:12px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.8rem;font-weight:600;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft)}
.btn.sm{font-size:.76rem;padding:5px 10px;border-radius:6px}
.btn.primary{background:var(--save);color:var(--on-accent);border-color:var(--save)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--line-soft);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.kdelete{background:transparent;color:var(--danger);border-color:var(--line)}
.btn.kclose{background:var(--save);border-color:var(--save);color:var(--on-accent)}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:64px;font:inherit;font-size:.78rem;font-weight:600;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ---------- pills / status ---------- */
.pill{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--line-soft);color:var(--ink-soft);white-space:nowrap}
.pill.tpl{background:var(--accent-soft);color:var(--accent-ink)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn,.pill.bad{background:var(--warn-soft);color:var(--warn-ink)}
.status{font-size:.76rem;color:var(--good);font-weight:600}
.status.bad{color:var(--warn-ink)}
.status:empty{display:none}
.empty{font-size:.8rem;color:var(--ink-soft);padding:18px 0;text-align:center}

/* ---------- dual list (Available | Selected) ---------- */
.dual{display:grid;gap:6px}
.dual-g{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr) 34px;gap:0 8px;align-items:start}
.dl-col{display:grid;min-width:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.dl-head{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.dl-list{list-style:none;margin:0;padding:3px;height:150px;overflow-y:auto}
.dl-list li{padding:4px 8px;font-size:.78rem;cursor:pointer;user-select:none;overflow-wrap:anywhere;border-radius:4px}
.dl-list li:hover{background:var(--line-soft)}
.dl-list li[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.dl-list .dl-empty{cursor:default;color:var(--ink-soft);font-style:italic}
.dl-list .dl-empty:hover{background:transparent}
.dl-x{color:var(--warn-ink);font-size:.68rem}
.dl-foot{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-soft);padding:4px 8px;border-top:1px solid var(--line-soft);font-variant-numeric:tabular-nums;background:var(--surface)}
.dl-btns{display:grid;gap:6px;align-content:center;padding-top:30px}
.dl-btns button{height:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--accent-ink);font:600 .8rem "IBM Plex Mono",monospace;cursor:pointer;padding:0}
.dl-btns button:disabled{color:var(--line);cursor:not-allowed;background:transparent}
.dl-btns button:not(:disabled):hover{border-color:var(--ink-soft)}
.dl-add{display:flex;gap:8px}
@media (max-width:640px){ .dual-g{grid-template-columns:minmax(0,1fr);gap:6px} .dl-btns{grid-auto-flow:column;padding-top:0} .dl-list{height:120px} }

/* ---------- name keys ---------- */
.keyblock{display:grid;gap:12px}
.keypal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kbtn{font:inherit;font-size:.76rem;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.kbtn:hover{border-color:var(--ink-soft)}
.kbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
.kbtn[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
.kother{flex:1 1 200px;width:auto;max-width:300px;font-size:.76rem;padding:5px 10px;border-radius:99px}
.keyrow{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:8px;border:1px dashed var(--line);background:var(--bg);min-height:56px;align-items:center}
.ktile{display:inline-flex;align-items:stretch;gap:4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:grab;max-width:100%;user-select:none;-webkit-user-select:none}
.ktile[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kgrip{display:inline-flex;align-items:center;padding:0 2px;color:var(--ink-soft);font-size:.9rem;cursor:grab;touch-action:none}
.kgreen{border:0;border-radius:6px;background:var(--save);color:var(--on-accent);font:600 .82rem "IBM Plex Sans",sans-serif;padding:6px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;overflow-wrap:anywhere;text-align:left}
.kgreen .kord{font:600 .66rem "IBM Plex Mono",monospace;opacity:.7}
.kgreen .subs{font-size:.6rem;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 6px}
.kpre{display:inline-flex;align-items:center;font:600 .72rem "IBM Plex Mono",monospace;padding:0 8px;border-radius:6px;background:var(--line-soft);color:var(--ink);border:1px solid var(--line)}
.keyrow.sorting,.keyrow.sorting *{cursor:grabbing}
.ktile.dragging{opacity:.45}
.ktile.drop-before{box-shadow:-4px 0 0 var(--accent)}
.ktile.drop-after{box-shadow:4px 0 0 var(--accent)}
.result-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.result-line .rl-label{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.result-line code{background:none;padding:0;font-size:.8rem;color:var(--ink);overflow-wrap:anywhere}
.keypanel{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:16px;display:grid;gap:14px}
.keypanel .kp-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.keypanel h3,.keypanel .hint.mono{overflow-wrap:anywhere}
.keypanel details > summary{font-size:.76rem;color:var(--ink-soft);cursor:pointer}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px;align-items:start}
.kgrid input,.kgrid select,.subedit input{background:var(--surface)}
.subgrid{display:grid;gap:6px;max-height:360px;overflow:auto}
.subedit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
@media (max-width:560px){ .subedit{grid-template-columns:1fr 1fr} .subedit > :last-child{grid-column:1 / -1;justify-self:end} }
.sublist{display:grid;gap:4px;max-height:240px;overflow:auto}
.subrow{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 4px 4px 10px;font-family:"IBM Plex Mono",monospace;font-size:.74rem}
.subrow span{min-width:0;overflow-wrap:anywhere}
.targets{display:grid;gap:2px;max-height:220px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.targets .grp{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:6px 4px 2px}
.targets label{display:flex;gap:8px;align-items:center;font-size:.8rem;padding:2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--line-soft);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-family:"IBM Plex Mono",monospace;font-size:.72rem;max-width:100%}
.chip button{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:.9rem;line-height:1;padding:0 4px;border-radius:50%}
.fmt-overlay{position:fixed;inset:0;z-index:50;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.fmt-box{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.25);display:grid;gap:12px}
.dsec{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.dsec-h{font-size:.9rem}

/* ---------- item cards (sessions / templates) ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;grid-auto-rows:1fr}
.item-card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink-soft);border-radius:10px;padding:14px 16px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item-card.is-active{border-left-color:var(--save)}
.item-card.is-tpl{border-left-color:var(--accent)}
.item-card:hover{border-color:var(--ink-soft);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.item-card.is-open{box-shadow:0 0 0 2px var(--good)}
.item-card .ic-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item-card .ic-name{font-size:.92rem;font-weight:600;overflow-wrap:anywhere}
.item-card .ic-meta{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.item-card .ic-keys{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink);overflow-wrap:anywhere}
.item-card.name-only{justify-content:center;min-height:0;padding:14px 16px}
.card-grid:has(.name-only){grid-auto-rows:auto}
.soon-card{text-align:center;padding:40px 20px}
.soon-card h2{font-size:1rem;font-weight:600;margin-bottom:6px}

/* ---------- stories ---------- */
.rule{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--surface)}
.rule[open]{border-left-color:var(--save)}
.rule.is-done{border-left-color:var(--good)}
.rule > summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rule > summary::-webkit-details-marker{display:none}
.rule > summary .caret{transition:transform .15s;color:var(--ink-soft);font-size:.66rem}
.rule[open] > summary .caret{transform:rotate(90deg)}
.rule .body{padding:4px 14px 16px;display:grid;gap:12px;border-top:1px solid var(--line-soft)}
.rule-name{display:flex;gap:10px;align-items:center;flex:1 1 220px;min-width:0}
.rule-name input{width:280px;max-width:100%;font-weight:600}
.match{border-left:3px solid var(--accent-soft);padding:10px 0 4px 12px;display:grid;gap:6px}
.match-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.or{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;padding-left:2px}
.cond{display:grid;grid-template-columns:minmax(150px,2fr) 92px minmax(110px,1.4fr) minmax(110px,1.4fr) auto;gap:6px;align-items:center}
.cond input{padding:6px 8px;font-size:.8rem}
.cond-head{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:400}
@media (max-width:720px){ .cond{grid-template-columns:1fr 1fr} .cond > :first-child{grid-column:1 / -1} .cond-head{display:none} }
.trainbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;max-height:180px;overflow:auto;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.trainbox label{display:flex;gap:6px;align-items:center;font-size:.78rem}

/* ---------- build ---------- */
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.78rem;margin:0}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:.74rem;word-break:break-all}
.pkglist{display:grid;gap:4px}
.pkglist label{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line-soft);font-size:.82rem}
.pkgrow{display:grid;gap:4px}
.pkgrow > input{margin-left:28px;width:calc(100% - 28px)}
.pkglist .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.result{display:grid;gap:14px}
.tbl,.filetable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.filetable th{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:400}
.filetable td{padding:4px 8px;border-bottom:1px solid var(--line-soft);font-size:.78rem}
.filetable td.mono{font-size:.72rem}
.filetable td.num{font-family:"IBM Plex Mono",monospace;text-align:right}
.scroll{overflow-x:auto}
pre.cmd{margin:8px 0 0;font-size:.7rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:220px;overflow:auto;white-space:pre}
ol.howto{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.8rem}
details > summary.hint{font-size:.76rem}
.build-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- dialog / toast ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.25);display:grid;gap:12px}
.dialog h2{font-size:1rem;font-weight:600}
.dialog .dlg-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:6px;width:28px;height:28px;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.icon-btn svg{width:14px;height:14px}
body.modal-open{overflow:hidden}
.toast{position:fixed;left:50%;top:calc(var(--bar-h,44px) + 12px);transform:translateX(-50%);z-index:60;width:min(440px,calc(100vw - 32px));background:var(--save);color:var(--on-accent);border-radius:10px;padding:12px 16px;box-shadow:0 12px 32px rgba(0,0,0,.28);font-size:.8rem;display:flex;gap:10px;align-items:center}
.toast svg{width:16px;height:16px;color:#8fd3a8;flex:none}
.toast.warn svg{color:#f5c26b}

@media (max-width:1000px){ .shell{grid-template-columns:190px minmax(0,1fr)} .rail-item{padding:10px 12px;gap:8px} .rail-group{padding:14px 12px 6px} .srv-item{padding-left:12px} .content{padding:20px 14px 60px} }

/* ---------- in-page tabs (Highlight Factory) ---------- */
.page-tabs{display:flex;align-items:flex-end;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:-6px 0 20px}
.page-tab{border:0;background:none;color:var(--ink-soft);font:inherit;font-size:.82rem;font-weight:600;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.page-tab:hover{color:var(--ink)}
.page-tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.page-tab.minor{font-weight:400;font-size:.76rem}
.page-tab .ct{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-soft);margin-left:5px}
.pt-sep{align-self:center;font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:0 6px 0 14px;margin-left:6px;border-left:1px solid var(--line);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-gap{flex:1}

/* ---------- setup ---------- */
.check-row{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;color:var(--ink);cursor:pointer}
.check-row input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){ .grid3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .grid3{grid-template-columns:1fr} }
.toggles{display:flex;flex-wrap:wrap;gap:10px 22px}
details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-soft);border-bottom:2px solid var(--ink-soft);transform:rotate(45deg);transition:transform .12s}
details.fold[open] > summary::after{transform:rotate(-135deg)}
.fold-title{font-size:1rem;font-weight:600}
.chip{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--line-soft);color:var(--ink-soft)}
.chip.on{background:var(--good-soft);color:var(--good)}
.league-block{border-top:1px solid var(--line-soft);padding:14px 0 4px;display:grid;gap:12px}
.league-block:first-of-type{border-top:0}
.lg-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.lg-head h3{font-size:.95rem;min-width:44px}

/* ---------- stories (DreamCatcher layout) ---------- */
.story-list{display:grid;gap:10px}
.story{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.story[open]{border-left-color:var(--save)}
.story > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;flex-wrap:wrap}
.story > summary::-webkit-details-marker{display:none}
.story .caret svg,.search-tog svg{width:14px;height:14px;color:var(--ink-soft);transition:transform .12s;display:block}
.story[open] > summary .caret svg{transform:rotate(90deg)}
.story-name{flex:1 1 200px;max-width:360px;font-weight:600;padding:6px 9px;font-size:.86rem}
.story-meta{display:flex;gap:6px}
.story-acts{display:flex;gap:4px;margin-left:auto}
.story-acts .icon-btn svg,.cond-row .icon-btn svg{width:14px;height:14px}
.icon-btn.confirm-armed{background:#c0392b;border-color:#c0392b;color:#fff}
.story-body{border-top:1px solid var(--line-soft);background:var(--bg);padding-bottom:8px}
.search{border-bottom:1px solid var(--line-soft)}
.search-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px}
.search-tog{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:2px 0}
.search-tog[aria-expanded="true"] svg{transform:rotate(90deg)}
.cond-row{display:grid;grid-template-columns:minmax(160px,1.3fr) auto minmax(140px,1.4fr) 28px;gap:10px;align-items:center;padding:6px 10px 6px 34px;background:var(--surface);border-top:1px solid var(--line-soft)}
.cond-row select,.cond-row input{padding:6px 9px;font-size:.82rem;background:var(--bg)}
.cr-key{display:grid;gap:4px;min-width:0}
.cr-val{text-align:center;font-weight:600}
.eqneq{display:inline-flex;gap:4px}
.eqneq button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font:600 .9rem "IBM Plex Mono",monospace;cursor:pointer;padding:0}

.story-foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.story-foot > div{display:grid;gap:2px;text-align:center}
.sf-k{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.sf-v{font-size:.82rem;font-weight:600;overflow-wrap:anywhere}

<script type="text/plain" id="hf-installer">
#!/usr/bin/env python
# Highlight Factory template installer. Generated by the HF EFP Builder.
# Runs from the extracted .efp directory: sh install -v -D
# Python 2.7 and 3.x compatible.
from __future__ import print_function
import copy
import json
import re
import os
import socket
import subprocess
import sys
import time

HERE = os.path.dirname(os.path.abspath(__file__))
VERBOSE = "-v" in sys.argv


def log(msg):
    print("[hf-install] " + msg)
    sys.stdout.flush()


def vlog(msg):
    if VERBOSE:
        log(msg)


def fail(msg):
    log("ERROR: " + msg)
    sys.exit(1)


def load_json(name):
    f = open(os.path.join(HERE, name))
    try:
        return json.load(f)
    finally:
        f.close()


cfg = load_json("config.json")
sessions = load_json("sessions.json")
if isinstance(sessions, dict):
    sessions = [sessions]

DCRCP = os.environ.get("HF_DCRCP") or cfg.get("dcrcp") or "/opt/dreamcatcher/bin/dcrcp"
METHOD = (cfg.get("create_method") or "").strip()
PARAMS_TEMPLATE = cfg.get("params_template") or "{SESSION}"
# HF_DRY_RUN=1 forces a dry run; HF_DRY_RUN=0 installs for real without rebuilding the .efp.
_env_dry = (os.environ.get("HF_DRY_RUN") or "").strip()
DRY_RUN = (_env_dry != "0") if _env_dry in ("0", "1") else bool(cfg.get("dry_run", True))
SKIP_EXISTING = bool(cfg.get("skip_existing", True))
STRIP_CLIPS_BINS = bool(cfg.get("strip_clips_bins", False))
STRIP_IDS = bool(cfg.get("strip_ids", False))
# "names" = only change clip/export name settings on templates already on the server.
NAMES_ONLY = (cfg.get("mode") or "full") == "names"
UPDATE_METHOD = (cfg.get("update_method") or "").strip()
# update_template (from `dcrcp --docs`): params {"session_id": <id>, "session_data": {key/value pairs}, "name": optional}.
# We send the server's whole session_data back with only the name fields changed, so it is right whether
# DreamCatcher merges the keys or replaces session_data. "whole" sends the full object instead (older guess).
UPDATE_STYLE = (cfg.get("update_style") or "session_data").strip()
# Templates are saved with update_template; live sessions with update_session (both listed in `dcrcp --docs`).
SESSION_UPDATE_METHOD = (cfg.get("session_update_method") or "update_session").strip()


def method_for(item):
    return UPDATE_METHOD if is_template(item) else SESSION_UPDATE_METHOD


def update_params(item):
    if UPDATE_STYLE == "session_data":
        return json.dumps({"session_id": item.get("session_id"), "session_data": item.get("session_data") or {}}, separators=(",", ":"))
    return PARAMS_TEMPLATE.replace("{SESSION}", json.dumps(item, separators=(",", ":")))
NAME_FIELDS = ["clip_name_keys", "export_name_keys", "clip_name_separator", "export_name_separator"]
ASK_TARGET = NAMES_ONLY and bool(cfg.get("ask_target", False))
# Train matching by name: {source train id: train name} from the builder.
TRAIN_NAMES = cfg.get("train_names") or {}
MATCH_BY_NAME = bool(cfg.get("match_trains_by_name", True)) and bool(TRAIN_NAMES)
ALLOW_MISSING = bool(cfg.get("allow_missing_trains", False))
TRAINS_METHOD = (cfg.get("trains_method") or "").strip()
USERS_METHOD = (cfg.get("users_method") or "").strip()
# Read-only dcrcp methods tried, in order, when no method is set in the builder.
# From `dcrcp --docs`: record trains are "outputs" in the API.
TRAIN_METHODS = ["get_all_outputs", "get_outputs", "get_output_status", "get_input_sources"]
USER_METHODS = ["get_users"]
try:
    STR_TYPES = (str, unicode)  # noqa: F821  (Python 2)
except NameError:
    STR_TYPES = (str,)
UUID_RE = re.compile(r"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$")
ID_KEYS = ("id", "train_id", "uuid", "_id", "uid")
NAME_KEYS = ("name", "train_name", "display_name", "label", "title")
USER_KEYS = ("username", "user_name", "login", "name")


ARG_LIMIT = 120000  # Linux refuses a single command-line argument over 128 KB


def dcrcp_python():
    """The Python interpreter named on dcrcp's first line, if dcrcp is a Python script."""
    try:
        with open(DCRCP, "rb") as f:
            first = f.readline().decode("utf-8", "replace").strip()
    except (IOError, OSError):
        return None
    if not first.startswith("#!") or "python" not in first:
        return None
    parts = first[2:].split()
    if os.path.basename(parts[0]) == "env" and len(parts) > 1:
        return parts[1:2]
    return parts[:1]


def run(method, params):
    big = len(params) > ARG_LIMIT
    try:
        if big:
            # Too long for the command line: start dcrcp's own Python and hand the params over stdin.
            interp = dcrcp_python()
            if not interp:
                return 7, "Package data is %d bytes, over the 128 KB command-line limit, and dcrcp isn't a Python script, so it can't be passed another way." % len(params)
            boot = ("import sys, runpy; a = sys.stdin.read(); sys.argv = [%r, %r, a]; "
                    "runpy.run_path(%r, run_name='__main__')") % (DCRCP, method, DCRCP)
            p = subprocess.Popen(interp + ["-c", boot], stdin=subprocess.PIPE,
                                 stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
        else:
            p = subprocess.Popen([DCRCP, method, params],
                                 stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
    except OSError as e:
        return 127, str(e)
    out = p.communicate(params.encode("utf-8") if big else None)[0]
    if not isinstance(out, str):
        out = out.decode("utf-8", "replace")
    return p.returncode, out


def extract_json(raw):
    """Return the first real JSON value in dcrcp output, skipping log lines."""
    dec = json.JSONDecoder()
    for i, ch in enumerate(raw):
        if ch in "[{":
            try:
                return dec.raw_decode(raw[i:])[0]
            except ValueError:
                continue
    return None


def get_sessions():
    if NAMES_ONLY:
        return all_items()
    rc, out = run("get_sessions", '{"template": True}')
    data = extract_json(out)
    if data is None:
        vlog("dcrcp output:\n" + out)
        return None
    if isinstance(data, dict):
        data = [data]
    return data


def is_str(v):
    return isinstance(v, STR_TYPES)


def named_ids(data):
    """Collect {name: id} from dcrcp output: any object with a UUID id and a name,
    or any {uuid: {name: ...}} mapping. Names that appear twice are returned in dups."""
    found, dups = {}, set()

    def add(name, ident):
        name = name.strip()
        if name in found and found[name] != ident:
            dups.add(name)
        found.setdefault(name, ident)

    def walk(v):
        if isinstance(v, dict):
            ident = next((v[k] for k in ID_KEYS if is_str(v.get(k)) and UUID_RE.match(v.get(k))), None)
            name = next((v[k] for k in NAME_KEYS if is_str(v.get(k)) and v.get(k).strip()), None)
            if ident and name:
                add(name, ident)
            for k, x in v.items():
                if is_str(k) and UUID_RE.match(k) and isinstance(x, dict):
                    n = next((x[nk] for nk in NAME_KEYS if is_str(x.get(nk)) and x.get(nk).strip()), None)
                    if n:
                        add(n, k)
                walk(x)
        elif isinstance(v, list):
            for x in v:
                walk(x)
    walk(data)
    return found, dups


def first_working(methods, parse, what):
    """Try read-only dcrcp methods until one returns something parse() understands."""
    for m in methods:
        rc, out = run(m, "{}")
        data = extract_json(out) if rc == 0 else None
        if data is None:
            vlog("dcrcp %s: no %s list (exit %d)" % (m, what, rc))
            continue
        result = parse(data)
        if result and result[0]:
            return m, result
        vlog("dcrcp %s: returned JSON but no %s in it" % (m, what))
    return None, None


def user_names(data):
    names = set()

    def walk(v):
        if isinstance(v, dict):
            for k in USER_KEYS:
                if is_str(v.get(k)) and v.get(k).strip():
                    names.add(v.get(k).strip())
            for x in v.values():
                walk(x)
        elif isinstance(v, list):
            for x in v:
                if is_str(x) and x.strip():
                    names.add(x.strip())
                else:
                    walk(x)
    walk(data)
    return (names,)


def strings_in(v, acc):
    if isinstance(v, dict):
        for x in v.values():
            strings_in(x, acc)
    elif isinstance(v, list):
        for x in v:
            strings_in(x, acc)
    elif is_str(v):
        acc.add(v)
    return acc


def remap(value, mapping):
    if not mapping:
        return value
    if isinstance(value, dict):
        return dict((k, remap(v, mapping)) for k, v in value.items())
    if isinstance(value, list):
        return [remap(v, mapping) for v in value]
    if isinstance(value, str) or (sys.version_info[0] == 2 and isinstance(value, unicode)):  # noqa: F821
        return mapping.get(value, value)
    return value


DROP = set()  # source train IDs with no match on this server (only when missing trains are allowed)


def prune(v):
    if isinstance(v, dict):
        return dict((k, prune(x)) for k, x in v.items())
    if isinstance(v, list):
        return [prune(x) for x in v if not (is_str(x) and x in DROP)]
    return v


def prepare(s, mapping):
    obj = remap(prune(copy.deepcopy(s)), mapping)
    sd = obj.get("session_data") or {}
    sc = sd.get("stats_config") or {}
    if STRIP_CLIPS_BINS:
        obj["session_clips"] = []
        if "clips" in sd:
            sd["clips"] = []
        if "bin_ids" in sd:
            sd["bin_ids"] = []
    if STRIP_IDS:
        for d in (obj, sd, sc):
            d.pop("session_id", None)
            d.pop("template_id", None)
        obj.pop("creator_machine_id", None)
        obj.pop("modified", None)
    return obj


def key_summary(sc):
    def n(f):
        ks = sc.get(f) or []
        subs = sum(len(k.get("word_substitutions") or []) for k in ks if isinstance(k, dict))
        return "%d key(s), %d substitution(s)" % (len(ks), subs)
    return "clip names: %s; export names: %s" % (n("clip_name_keys"), n("export_name_keys"))


def all_items():
    """Templates and sessions on this server (get_sessions asked for templates, then sessions)."""
    items, seen = [], set()
    for params in ('{"template": True}', '{"template": False}', '{}'):
        rc, out = run("get_sessions", params)
        data = extract_json(out) if rc == 0 else None
        if isinstance(data, dict):
            data = [data]
        for x in data or []:
            if isinstance(x, dict) and x.get("name"):
                k = x.get("session_id") or x.get("name")
                if k not in seen:
                    seen.add(k)
                    items.append(x)
    return items


def is_template(x):
    return bool((x.get("session_data") or {}).get("template"))


def kind(x):
    return "template" if is_template(x) else "session"


def choose(items):
    """List what's on the server and ask which to update. HF_TARGETS (numbers or names) answers without a prompt."""
    order = sorted(items, key=lambda x: (not is_template(x), (x.get("name") or "").lower()))
    log("Templates and sessions on this server:")
    for i, x in enumerate(order, 1):
        log("  %3d  %-9s %s" % (i, kind(x).upper(), x.get("name")))
    ans = (os.environ.get("HF_TARGETS") or "").strip()
    if not ans:
        try:
            tout = open("/dev/tty", "w")
            tin = open("/dev/tty", "r")
            if not sys.stdout.isatty():
                tout.write("\n")
                for i, x in enumerate(order, 1):
                    tout.write("  %3d  %-9s %s\n" % (i, kind(x).upper(), x.get("name")))
            tout.write("[hf-install] Apply the clip names to which? Numbers or names, comma separated (blank = cancel): ")
            tout.flush()
            ans = tin.readline().strip()
            tin.close()
            tout.close()
        except (IOError, OSError, ValueError):
            ans = ""
    if not ans:
        log("Nothing chosen, nothing changed. Run it from an SSH terminal to answer the question, or name them up front:")
        log("  HF_TARGETS=\"3,5\" efpinstall <file>.efp     (numbers or exact names)")
        sys.exit(0)
    picked = []
    for part in ans.split(","):
        p = part.strip()
        if not p:
            continue
        if p.isdigit() and 1 <= int(p) <= len(order):
            x = order[int(p) - 1]
        else:
            hits = [x for x in order if (x.get("name") or "").lower() == p.lower()]
            if len(hits) != 1:
                log("SKIP   %r (%s)" % (p, "not found" if not hits else "%d share this name; use its number" % len(hits)))
                continue
            x = hits[0]
        if x not in picked:
            picked.append(x)
    return picked


KP_OLD = "metadata.supplemental."
KP_NEW = "metadata.__supplemental__."


def key_paths(item):
    """Every metadata key path used in an item's name keys and auto-clipping rules."""
    sc = ((item.get("session_data") or {}).get("stats_config")) or {}
    out = []
    for f in ("clip_name_keys", "export_name_keys"):
        for k in sc.get(f) or []:
            if isinstance(k, dict) and is_str(k.get("key")):
                out.append(k["key"])
    for r in sc.get("auto_clipping") or []:
        for g in ((r or {}).get("filter") or {}).get("queries") or []:
            for c in g or []:
                if isinstance(c, dict) and is_str(c.get("keys")):
                    out.append(c["keys"])
    return out


def prefix_used(paths):
    new = sum(1 for p in paths if p.startswith(KP_NEW))
    old = sum(1 for p in paths if p.startswith(KP_OLD))
    if new or old:
        return KP_NEW if new >= old else KP_OLD
    return None


PATH_FIX = {"assistPlayerName": "assist_player_name", "actionSuccess": "success",
            "players.committed_by_player_name": "players.committed_penalty_player_name",
            "players.drawn_by_player_name": "players.drew_penalty_player_name",
            "properties.PenaltyType": "properties.PenaltyDescription"}


def match_prefix(src, target, server_default):
    """Write our key paths the way this target (or this server) writes them. Returns (src copy, count changed, prefix)."""
    want = prefix_used(key_paths(target)) or server_default or KP_NEW
    other = KP_OLD if want == KP_NEW else KP_NEW
    src = copy.deepcopy(src)
    n = 0
    for f in ("clip_name_keys", "export_name_keys"):
        for k in src.get(f) or []:
            if isinstance(k, dict) and is_str(k.get("key")):
                v = k["key"]
                if v.startswith(other):
                    v = want + v[len(other):]
                if v.startswith(want) and v[len(want) + len("pbp_event."):] in PATH_FIX:
                    v = want + "pbp_event." + PATH_FIX[v[len(want) + len("pbp_event."):]]
                if v != k["key"]:
                    k["key"] = v
                    n += 1
    return src, n, want


def names_only(existing):
    """Change only the clip/export name settings on templates or sessions already on this server.
    Everything else in the server's copy (trains, rules, users, roster IDs ...) is sent back unchanged."""
    log("NAMES ONLY: changes clip and export name keys, separators and word substitutions. Nothing else.")
    items = all_items()
    log("Read %d template(s) and session(s) from this server" % len(items))
    pairs, skipped = [], []
    server_prefix = prefix_used([p for it in items for p in key_paths(it)])
    log("Key paths on this server: %s" % ((server_prefix or KP_NEW) + "…"))
    if ASK_TARGET:
        src = (sessions[0].get("stats_config") if sessions else None) or {}
        pairs = [(x, src) for x in choose(items)]
    else:
        by_name = {}
        for x in items:
            by_name.setdefault(x["name"], []).append(x)
        for s in sessions:
            name = s.get("name", "(unnamed)")
            hits = by_name.get(name) or []
            if len(hits) != 1:
                log("SKIP   %s (%s)" % (name, "not on this server" if not hits else "%d share this name; rename one" % len(hits)))
                skipped.append(name)
                continue
            pairs.append((hits[0], s.get("stats_config") or {}))
    updated, failed, same, would = [], [], [], []
    for x, src in pairs:
        name = "%s (%s)" % (x.get("name"), kind(x))
        src, nfix, pre = match_prefix(src, x, server_prefix)
        if nfix:
            log("       %d key path(s) rewritten to %s… to match this %s" % (nfix, pre, kind(x)))
        new = copy.deepcopy(x)
        sc = new.setdefault("session_data", {}).setdefault("stats_config", {})
        changed = [f for f in NAME_FIELDS if f in src and sc.get(f) != src[f]]
        if not changed:
            log("SAME   %s (already matches)" % name)
            same.append(name)
            continue
        log("%s %s: %s  (dcrcp %s)" % ("WOULD UPDATE" if DRY_RUN else "UPDATE", name, ", ".join(changed), method_for(x)))
        would.append(name)
        log("       before  " + key_summary((x.get("session_data") or {}).get("stats_config") or {}))
        for f in changed:
            sc[f] = copy.deepcopy(src[f])
        log("       after   " + key_summary(sc))
        if DRY_RUN:
            continue
        if not new.get("session_id"):
            log("FAIL   %s (no session_id in the server's copy)" % name)
            failed.append(name)
            continue
        um = method_for(x)
        rc, out = run(um, update_params(new))
        vlog("dcrcp %s -> exit %d\n%s" % (um, rc, out.strip()[-2000:]))
        if rc != 0 or "Traceback" in out:
            log("FAIL   %s (dcrcp exit %d)" % (name, rc))
            if not VERBOSE:
                log(out.strip()[-600:])
            failed.append(name)
        else:
            updated.append((name, x, src))

    # Verify by reading back
    if updated:
        after = all_items()
        by_id = dict(((y.get("session_id") or y.get("name")), y) for y in after)
        for name, x, src in list(updated):
            y = by_id.get(x.get("session_id") or x.get("name")) or {}
            sc = ((y.get("session_data") or {}).get("stats_config")) or {}
            bad = [f for f in NAME_FIELDS if f in src and sc.get(f) != src[f]]
            if bad:
                log("FAIL   %s (saved, but %s did not change)" % (name, ", ".join(bad)))
                updated.remove((name, x, src))
                failed.append(name)
            else:
                log("OK     %s" % name)
    if DRY_RUN:
        log("Done (dry run): %d would be updated, %d already matched, %d skipped. Nothing was changed." % (len(would), len(same), len(skipped)))
    else:
        log("Done: %d updated, %d already matched, %d skipped, %d failed" % (len(updated), len(same), len(skipped), len(failed)))
    if failed:
        log("Restore point: see the backup path above")
        sys.exit(1)
    sys.exit(0)


# ---------- Stats site check ----------
# Before anything else, confirm this CM can reach the stats site for each sport in the package
# (the Rest API Host in the SMT I/O config). Only checks the connection: any HTTP answer, even
# 401/403/404, means the site is reachable. No login is sent.
STATS_CHECK = bool(cfg.get("stats_check", True)) and os.environ.get("HF_SKIP_STATS_CHECK") != "1"
STATS_URLS = cfg.get("stats_urls") or {}
STATS_TIMEOUT = float(cfg.get("stats_timeout", 10))
try:
    from urllib.request import Request, urlopen  # Python 3
    from urllib.error import HTTPError, URLError
except ImportError:
    from urllib2 import Request, urlopen, HTTPError, URLError  # noqa: F401  (Python 2)


def package_sports():
    sports = cfg.get("stats_sports")
    if not sports:
        sports = []
        for x in sessions:
            sc_ = ((x.get("session_data") or {}).get("stats_config") or x.get("stats_config") or {}) if isinstance(x, dict) else {}
            s = (sc_.get("field_sub_type") or "").strip().lower()
            if s and s not in sports:
                sports.append(s)
    return sports


def probe(url):
    """Returns (ok, message)."""
    req = Request(url, headers={"User-Agent": "hf-install"})
    ctx_kw = {}
    for attempt in ("verified", "unverified"):
        try:
            if attempt == "unverified":
                import ssl
                ctx_kw = {"context": ssl._create_unverified_context()}
            r = urlopen(req, timeout=STATS_TIMEOUT, **ctx_kw)
            code = r.getcode()
            r.close()
            note = "" if attempt == "verified" else " (certificate could not be verified on this CM)"
            return True, "reachable, HTTP %s%s" % (code, note)
        except HTTPError as e:
            note = "" if attempt == "verified" else " (certificate could not be verified on this CM)"
            return True, "reachable, HTTP %s%s" % (e.code, note)
        except Exception as e:
            reason = getattr(e, "reason", e)
            text = str(reason)
            low = text.lower()
            if attempt == "verified" and ("certificate" in low or "ssl" in low) and "timed out" not in low:
                continue  # retry without verification to see if the site itself is reachable
            if isinstance(reason, socket.gaierror) or "name or service" in low or "nodename" in low or "getaddrinfo" in low:
                return False, "can't look up the host name (DNS): " + text
            if isinstance(reason, socket.timeout) or "timed out" in low:
                return False, "timed out after %gs (firewall or no route?)" % STATS_TIMEOUT
            if "tunnel connection failed" in low or "proxy" in low:
                return False, "the proxy on this CM refused the connection: " + text
            if "refused" in low:
                return False, "connection refused: " + text
            if "unreachable" in low:
                return False, "network unreachable: " + text
            return False, text
    return False, "unknown error"


def check_stats_sites():
    if not STATS_CHECK:
        log("Stats site check: skipped")
        return
    sports = package_sports()
    if not sports:
        log("Stats site check: no sport set on the packaged sessions, nothing to check")
        return
    bad = []
    checked = 0
    for s in sports:
        url = (STATS_URLS.get(s) or "").strip()
        if not url:
            log("Stats site check: %s - no stats URL in the package, not checked" % s.upper())
            continue
        checked += 1
        ok, msg = probe(url)
        log("Stats site check: %s %s - %s" % (s.upper(), url, msg))
        if not ok:
            bad.append(s)
    if bad:
        fail("Could not reach stats server")
    if checked:
        log("successfully reached stats server, good to go!")

# ---------- Home team ----------
# The team this CM belongs to is read from the sessions already on it: the roster ID that shows up in the most
# sessions of the same sport (home or away) is this CM's team. It is written into the template as the Home Roster,
# and story conditions holding the placeholder {TEAM} get that team's code (NBA) or name (NHL).
# HF_TEAM=<code or roster ID> overrides it. If nothing can be worked out, the SSH terminal is asked; blank = both teams.
TEAM_TOKEN = "{TEAM}"
TEAM_IDS = cfg.get("team_ids") or {}          # {sport: {roster_id: [code, name]}}
TEAM_VALUE = cfg.get("team_value") or {}      # {sport: "code" | "name"}


def sc_of(x):
    return ((x.get("session_data") or {}).get("stats_config")) or {}


def uses_team(items):
    for x in items:
        for r in sc_of(x).get("auto_clipping") or []:
            for g in ((r or {}).get("filter") or {}).get("queries") or []:
                for c in g or []:
                    if isinstance(c, dict) and TEAM_TOKEN in str(c.get("filter", "")):
                        return True
    return False


def detect_home(existing, sport):
    """Roster ID in the most sessions of this sport on the server. Returns (id, sessions_with_it, sessions_seen) or None."""
    seen, score, home = 0, {}, {}
    for x in existing or []:
        if not isinstance(x, dict):
            continue
        c = sc_of(x)
        if (c.get("field_sub_type") or "").strip().lower() != sport:
            continue
        ids = set()
        for f in ("home_roster_id", "away_roster_id"):
            v = str(c.get(f) or "").strip()
            if v and v not in ("-1", "0"):
                ids.add(v)
        if not ids:
            continue
        seen += 1
        for v in ids:
            score[v] = score.get(v, 0) + 1
        h_ = str(c.get("home_roster_id") or "").strip()
        if h_:
            home[h_] = home.get(h_, 0) + 1
    if not score:
        return None
    ranked = sorted(score, key=lambda v: (score[v], home.get(v, 0)), reverse=True)
    top = ranked[0]
    if len(ranked) > 1 and (score[ranked[1]], home.get(ranked[1], 0)) == (score[top], home.get(top, 0)):
        return None  # a tie: can't tell which team this CM belongs to
    return top, score[top], seen


TEAM_KEYS = ("teamTricode", "team_name", "team_code")


def detect_team_from_stories(existing, sport):
    """Team value most used in the stories already on this CM (e.g. teamTricode = DEN, team_name = COLORADO AVALANCHE).
    NBA roster IDs in DreamCatcher are its own IDs (not the league's), so the stories are the reliable source."""
    score = {}
    for x in existing or []:
        if not isinstance(x, dict):
            continue
        c = sc_of(x)
        if (c.get("field_sub_type") or "").strip().lower() != sport:
            continue
        for r in c.get("auto_clipping") or []:
            for g in ((r or {}).get("filter") or {}).get("queries") or []:
                for q in g or []:
                    if not isinstance(q, dict):
                        continue
                    k = str(q.get("keys") or "").strip()
                    v = str(q.get("filter") or "").strip()
                    if v and TEAM_TOKEN not in v and k.split(".")[-1] in TEAM_KEYS:
                        score[v] = score.get(v, 0) + 1
    if not score:
        return ""
    ranked = sorted(score, key=lambda v: score[v], reverse=True)
    if len(ranked) > 1 and score[ranked[0]] == score[ranked[1]]:
        return ""
    return ranked[0]


def ask_line(question):
    try:
        tout = open("/dev/tty", "w")
        tin = open("/dev/tty", "r")
        tout.write("[hf-install] " + question)
        tout.flush()
        ans = tin.readline().strip()
        tin.close()
        tout.close()
        return ans
    except (IOError, OSError, ValueError):
        return ""


def team_lookup(sport, ans):
    """ans is a roster ID or a team code. Returns (roster_id, code, name)."""
    ids = TEAM_IDS.get(sport) or {}
    if ans in ids:
        return ans, ids[ans][0], ids[ans][1]
    for rid, cn in ids.items():
        if ans.lower() in (cn[0].lower(), cn[1].lower()):
            return rid, cn[0], cn[1]
    return "", ans, ans


def apply_home_team(items, existing):
    sports = []
    for x in items:
        s = (sc_of(x).get("field_sub_type") or "").strip().lower()
        if s and s not in sports:
            sports.append(s)
    for sport in sports:
        mine = [x for x in items if (sc_of(x).get("field_sub_type") or "").strip().lower() == sport]
        env = (os.environ.get("HF_TEAM") or "").strip()
        rid = code = name = ""
        if env:
            rid, code, name = team_lookup(sport, env)
            log("Home team (from HF_TEAM): %s" % env)
        else:
            found = detect_home(existing, sport)
            if found:
                rid, n, seen = found
                rid, code, name = team_lookup(sport, rid)
                rid = found[0]
                log("Home team found on this CM: %s (roster ID %s, in %d of %d %s sessions)" % (
                    name if name != rid else "team not in the package's list", rid, n, seen, sport.upper()))
                if code == rid:
                    code = name = ""
            else:
                log("Couldn't work out this CM's %s team from its sessions." % sport.upper())
                ans = ask_line("%s team for this CM (code like MIA, or roster ID). Blank = no home team: " % sport.upper())
                if ans:
                    rid, code, name = team_lookup(sport, ans)
        for x in mine:
            c = x.setdefault("session_data", {}).setdefault("stats_config", {})
            if rid:
                c["home_roster_id"] = rid
        value = (name.upper() if name else "") if TEAM_VALUE.get(sport) == "name" else code
        if not env and not value:
            learned = detect_team_from_stories(existing, sport)
            if learned:
                value = learned
                log("Team for the stories, from this CM's existing stories: %s" % learned)
        if not uses_team(mine):
            if rid:
                log("Home Roster set to %s" % rid)
            continue
        for x in mine:
            for r in sc_of(x).get("auto_clipping") or []:
                qs = ((r or {}).get("filter") or {}).get("queries") or []
                for gi, g in enumerate(qs):
                    keep = []
                    for c in g or []:
                        if isinstance(c, dict) and TEAM_TOKEN in str(c.get("filter", "")):
                            if not value:
                                continue
                            c = dict(c)
                            c["filter"] = str(c["filter"]).replace(TEAM_TOKEN, value)
                            c["filter_name"] = str(c.get("filter_name") or "").replace(TEAM_TOKEN, value) or value
                        keep.append(c)
                    qs[gi] = keep
        if rid or value:
            log("Home Roster set to %s; stories use team %s" % (rid or "(none)", value or "(both teams)"))
        if not value:
            log("No team for the stories: they will clip plays by both teams. Set HF_TEAM=<code> to pick one.")

def main():
    log("Package: %s  (%d item(s))" % (cfg.get("package_name", "?"), len(sessions)))
    if DRY_RUN:
        log("DRY RUN: nothing will be created. To install for real: HF_DRY_RUN=0 efpinstall <file>.efp")
    check_stats_sites()
    if not os.path.exists(DCRCP):
        fail("dcrcp not found at " + DCRCP)
    if NAMES_ONLY and not UPDATE_METHOD and not DRY_RUN:
        fail("No update method set in config.json")
    if not NAMES_ONLY and not METHOD and not DRY_RUN:
        fail("No create method set in config.json")

    # 1. Back up what is on this server now
    existing = get_sessions()
    if existing is None:
        fail("Could not read current sessions with get_sessions")
    stamp = time.strftime("%Y%m%d_%H%M%S")
    backup_dirs = [cfg.get("backup_dir") or "/opt/dreamcatcher/backup/hf_templates", "/var/tmp/hf_templates"]
    backup_path = None
    for d in backup_dirs:
        try:
            if not os.path.isdir(d):
                os.makedirs(d)
            path = os.path.join(d, "hf_backup_%s_%s.json" % (socket.gethostname(), stamp))
            f = open(path, "w")
            json.dump(existing, f, indent=2)
            f.close()
            os.chmod(path, 0o644)
            backup_path = path
            break
        except (IOError, OSError) as e:
            vlog("Backup to %s failed: %s" % (d, e))
    if backup_path is None:
        fail("Could not write a backup of current sessions")
    log("Backed up %d existing item(s) to %s" % (len(existing), backup_path))
    existing_names = set(x.get("name") for x in existing if isinstance(x, dict))

    if NAMES_ONLY:
        names_only(existing)
        return

    apply_home_team(sessions, existing)

    # 2. Train ID mapping: match by name on this server, then the package map, then an optional per-server file
    mapping = {}
    used = strings_in(sessions, set())
    if MATCH_BY_NAME:
        wanted = dict((sid, name) for sid, name in TRAIN_NAMES.items() if sid in used)
        method, res = first_working([TRAINS_METHOD] if TRAINS_METHOD else TRAIN_METHODS, named_ids, "train")
        if method is None:
            msg = ("Could not list this server's trains with dcrcp (tried: %s). Set the trains method in the builder "
                   "(Build tab), or add a train map." % ", ".join([TRAINS_METHOD] if TRAINS_METHOD else TRAIN_METHODS))
            if DRY_RUN:
                log("WARNING: " + msg)
            else:
                fail(msg)
        else:
            target, dups = res
            lower = dict((n.lower(), i) for n, i in target.items())
            log("Found %d train(s) on this server with dcrcp %s" % (len(target), method))
            missing = []
            for sid, name in sorted(wanted.items(), key=lambda x: x[1]):
                if name in dups:
                    missing.append(name + " (two trains have this name here)")
                    continue
                tid = target.get(name) or lower.get(name.lower())
                if tid:
                    mapping[sid] = tid
                    log("TRAIN  %-14s %s" % (name, tid if tid != sid else tid + " (same ID)"))
                else:
                    missing.append(name)
            log("Matched %d of %d train(s) by name" % (len(wanted) - len(missing), len(wanted)))
            if missing:
                log("MISSING on this server: " + ", ".join(missing))
                if not DRY_RUN and not ALLOW_MISSING:
                    fail("Some trains don't exist on this server. Rename them here, add a train map, "
                         "or allow missing trains in the builder.")
                for sid, name in wanted.items():
                    if sid not in mapping:
                        DROP.add(sid)
                log("Missing trains will be left out of the train lists")
        unnamed = [i for i in used if UUID_RE.match(i) and i not in TRAIN_NAMES and i not in mapping]
        vlog("%d other ID(s) left as they are (clips, bins, sessions, or trains without a name)" % len(unnamed))

        # Users: check they exist here (warning only)
        want_users = set()
        for s in sessions:
            sc = (s.get("session_data") or {}).get("stats_config") or {}
            if is_str(sc.get("username")) and sc.get("username"):
                want_users.add(sc.get("username"))
            want_users.update(u for u in (sc.get("auto_login_users") or []) if is_str(u))
        if want_users:
            um, ures = first_working([USERS_METHOD] if USERS_METHOD else USER_METHODS, user_names, "user")
            if um is None:
                vlog("Could not list users on this server; skipped the user check")
            else:
                gone = sorted(u for u in want_users if u not in ures[0])
                log("Users checked with dcrcp %s: %s" % (um, "all found" if not gone else "NOT FOUND: " + ", ".join(gone)))

    mapping.update(cfg.get("train_map") or {})
    server_map = cfg.get("server_train_map_file") or "/opt/dreamcatcher/hf_train_map.json"
    if os.path.exists(server_map):
        try:
            f = open(server_map)
            mapping.update(json.load(f))
            f.close()
            log("Loaded train map from " + server_map)
        except (IOError, ValueError) as e:
            fail("Bad train map file %s: %s" % (server_map, e))
    if mapping:
        log("Remapping %d train ID(s)" % len(mapping))

    # 3. Create
    created, skipped, failed = [], [], []
    for s in sessions:
        name = s.get("name", "(unnamed)")
        if SKIP_EXISTING and name in existing_names:
            log("SKIP   %s (already on this server)" % name)
            skipped.append(name)
            continue
        params = PARAMS_TEMPLATE.replace("{SESSION}", json.dumps(prepare(s, mapping), separators=(",", ":")))
        if DRY_RUN:
            log("WOULD CREATE  %s  via %s (%d bytes)" % (name, METHOD or "?", len(params)))
            vlog("params: " + params[:2000])
            continue
        rc, out = run(METHOD, params)
        vlog("dcrcp %s -> exit %d\n%s" % (METHOD, rc, out.strip()[-2000:]))
        if rc != 0 or "Traceback" in out:
            log("FAIL   %s (dcrcp exit %d)" % (name, rc))
            if not VERBOSE:
                log(out.strip()[-600:])
            failed.append(name)
        else:
            created.append(name)

    # 4. Verify by reading sessions back
    if created and not DRY_RUN:
        after = get_sessions() or []
        after_names = set(x.get("name") for x in after if isinstance(x, dict))
        for name in list(created):
            if name in after_names:
                log("OK     %s" % name)
            else:
                log("FAIL   %s (dcrcp returned but it is not in get_sessions)" % name)
                created.remove(name)
                failed.append(name)

    log("Done: %d created, %d skipped, %d failed" % (len(created), len(skipped), len(failed)))
    if failed:
        log("Restore point: " + backup_path)
        sys.exit(1)
    sys.exit(0)

}

function cmCommand(b) {

// Inside Claude the page saves through the downloads capability (allowed types only, so an .efp goes zipped).
// Opened on its own in a browser there is no capability, so it falls back to a normal browser download,
// which can be the plain file (alt) since no type list applies there.

    const a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();

        h("button", { class: "btn", id: "btn-cm", onclick: () => copyText(cmd, "Command copied. Paste it into your SSH session on the CM.") }, "Copy CM command"),
        h("ol", { class: "howto" },
          h("li", {}, "SSH into the server and paste the copied command. It should end with ", h("code", { text: "OK" }), "."),
          h("li", {}, "Run ", h("code", { text: "sudo efpinstall " + efpPath(b) }), ask ? ". It lists the templates and sessions with numbers; type the ones to update, e.g. 3,5." : "."),
          h("li", {}, cfg.dry_run ? "Read the WOULD UPDATE lines, then turn dry run off here, rebuild and install again." : "Check the OK lines. A backup is saved first."))))));
}
async function doBuild(btn) {
  const names = targetNames(), ask = state.ask !== false;
  if (!ask && !names.length) { toast("Add at least one template or session name"); return; }
  state.cfg.update_method = state.cfg.update_method || "update_template";
  btn.disabled = true;
  try {
    const pl = payload();
    const sessions = ask ? [{ name: "(chosen on the server)", stats_config: clone(pl) }] : names.map(n => ({ name: n, stats_config: clone(pl) }));
    const cfg = { mode: "names", ask_target: ask, dry_run: !!state.cfg.dry_run, update_method: state.cfg.update_method, params_template: state.cfg.params_template || "{SESSION}" };
    if (!state.home) { toast("Choose the home team in Setup first: it names the package"); btn.disabled = false; return; }
    const pkg = { name: pkgName(), version: state.pkg.version || "1.0.0", description: "Highlight Factory clip name keys" + (ask ? "" : " for " + names.join(", ")) };
    const r = await HF.buildEfp({ pkg, config: cfg, sessions, installerPy: INSTALLER });
    lastBuild = Object.assign(r, { name: pkg.name + ".efp" });
    renderOut();
  } catch (e) { toast("Build failed: " + e.message); }
  btn.disabled = false;
}
// Where the .efp is written on the server (the CM command creates the folder if needed).
function efpDir() { const d = String(state.efpDir ?? "/clips/clips").trim().replace(/\/+$/, ""); return d || "/tmp"; }
function efpPath(b) { return efpDir() + "/" + b.name; }
function renderPkgName() {
  const f = $("#pkg"); f.innerHTML = "";
  f.append(h("div", { class: "field" }, h("span", { class: "label", text: "Package" }), h("code", { id: "pkg-name", style: "font-size:.88rem;padding:6px 0;background:none", text: pkgName() + ".efp" }),
    h("span", { class: "hint", text: state.home ? "Named after the home team in Setup." : "Choose the home team in Setup to name it." })));
}
// "+ New": a blank slate for the league that's selected. Other leagues' saved work is kept.
function newBlank() {
  const c = sc(cur()), r = rosterPrefs(), lg = c.field_sub_type || "";
  c.clip_name_keys = []; c.clip_name_separator = " "; c.home_roster_id = ""; c.away_roster_id = "";
  state.home = ""; state.away = ""; state.targets = "";
  r.text = ""; r.fix = {}; r.keyTpl = {}; r.team = "";
  if (state.byLeague) delete state.byLeague[lg];
  OPEN_KEY = null; ROSTER_OPEN = false; lastBuild = null;
  save(); renderAll(); window.scrollTo({ top: 0 });
  toast(`New ${lg ? lg.toUpperCase() + " " : ""}clip names started`);
}
$("#btn-new").onclick = e => {
  const b = e.currentTarget, c = sc(cur());
  const has = (c.clip_name_keys || []).length || (rosterPrefs().text || "").trim() || state.home || state.away;
  if (!has) { newBlank(); return; }
  if (!b.dataset.armed) {
    b.dataset.armed = "1"; b.textContent = "Click again to clear"; b.classList.add("confirm-armed");
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "New"; b.classList.remove("confirm-armed"); } }, 3000);
    return;
  }
  delete b.dataset.armed; b.textContent = "New"; b.classList.remove("confirm-armed"); newBlank();
};
$("#btn-build-top").onclick = e => { const sec = $("#sec-build"); if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" }); doBuild(e.currentTarget); };
// rail highlights the section in view
(function railSpy() {
  const items = [...document.querySelectorAll(".rail-item[data-sec]")];
  const mark = id => items.forEach(a => a.setAttribute("aria-current", a.dataset.sec === id ? "true" : "false"));
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(es => { es.filter(x => x.isIntersecting).forEach(x => mark(x.target.id)); }, { rootMargin: "-30% 0px -60% 0px" });
  items.forEach(a => { const s = document.getElementById(a.dataset.sec); if (s) io.observe(s); });
  mark("sec-setup");
})();
// keep the rail below the sticky example bar
function sizeBar() {
  const b = $("#example-bar"); if (b) document.documentElement.style.setProperty("--ex-h", b.offsetHeight + "px");
  // the Live Media banner (lm-ui.js) sits above the app: keep the sticky bar and rail just below it
  let top = 0;
  for (const el of document.body.children) {
    if (el === b || el.classList.contains("shell") || el.closest(".toast,.overlay")) continue;
    const cs = getComputedStyle(el);
    if ((cs.position === "sticky" || cs.position === "fixed") && parseFloat(cs.top) === 0 && el.offsetHeight < 140) top = Math.max(top, el.getBoundingClientRect().bottom);
  }
  document.documentElement.style.setProperty("--bar-h", Math.round(top) + "px");
}
window.addEventListener("resize", sizeBar);
function renderAll() { renderSetup(); renderEditor(); renderPkgName(); renderOut(); }
if (!state.pkg || state.pkg.name === "HFTemplate_BallArena") state.pkg = { name: "ClipNames", version: "1.0.0" };
renderAll(); sizeBar(); flushSave();
window.addEventListener("load", sizeBar); setTimeout(sizeBar, 300);
// keep the example clip name current while typing in a key's fields
document.addEventListener("input", () => { clearTimeout(window.__smp); window.__smp = setTimeout(() => { renderSample(); sizeBar(); }, 150); });
document.addEventListener("change", () => setTimeout(renderSample, 0));
})();
</script>
